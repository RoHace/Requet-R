        return { reussi: false, message: `Une formule commence toujours par le signe égal. ${rappel}` };
      return { reussi: false, message: rappel };
    }
  },

  grille: {
    rendre(ex, api) {
      const t = creerTableur(api.reponsePrecedente || Feuille.creer(ex.feuille),
        { outils: ex.outils === true, hauteur: "230px" });
      const btn = el("button.btn.btn--fort", { onclick: () => api.repondre(t.feuille) }, "Vérifier");
      api.surRetour(() => { btn.disabled = true; });
      const cible = ex.cible || ex.validation?.cible;
      if (cible) { const p = Ref.depuis(cible); setTimeout(() => { t.selectionner(p.col, p.ligne); t.focus(); }, 60); }
      const atelier = ex.atelier && ATELIERS[ex.atelier]
        ? ATELIERS[ex.atelier].monter({ feuille: t.feuille, tableurUI: t }, ex) : null;
      return el("div", { style: "margin-top:18px" }, t.element, atelier,
        el("div", { style: "margin-top:14px" }, btn));
    },
    /** Validation à trois niveaux, déléguée au registre partagé avec les missions. */
    valider(ex, feuille) {
      return appliquerValidation(ex.validation || { ...ex, type: "cellule" }, feuille);
    }
  }
};

/* — Niveaux de contenu — */
const Contenu = {
  rang(niveau) { const i = CONFIG.niveaux.findIndex(n => n.id === niveau); return i === -1 ? 0 : i; },

  /** Niveau de contenu affiché : réglage explicite, sinon niveau déclaré à l'inscription. */
  niveauActif() {
    const r = Store.etat.reglages.niveauContenu;
    if (r) return r;
    return Store.etat.profil.niveauDeclare || "debutant";
  },

  changerNiveau(id) { Store.modifier(e => { e.reglages.niveauContenu = id; }); },

  /** Filtrage exclusif : le niveau choisi affiche uniquement le contenu de ce niveau,
   *  pour qu'on puisse dire « j'ai terminé le débutant, je passe à l'intermédiaire ». */
  accessible(item) {
    if (item.pack && !Packs.actif(item.pack)) return false;
    const actif = Contenu.niveauActif();
    return actif === "tout" || (item.niveau || "debutant") === actif;
  },

  /** Compétences jusqu'au niveau choisi, plus celles déjà pratiquées.
   *  Contrairement au contenu, filtré strictement, une compétence acquise ne disparaît jamais :
   *  un utilisateur avancé garde sous les yeux sa maîtrise des formules de base. */
  competencesVisibles() {
    const actif = Contenu.niveauActif();
    return CONTENU.competences.filter(c => {
      if (!c.actif) return false;
      if (actif === "tout" || Contenu.rang(c.niveau || "debutant") <= Contenu.rang(actif)) return true;
      return (Store.etat.competences[c.id]?.tentatives || 0) > 0;
    });
  },

  /** Sélecteur de niveau réutilisable, mémorisé dans les réglages. */
  selecteur(surChangement) {
    const actif = Contenu.niveauActif();
    const segment = el("div.segment", { style: "margin-bottom:20px" });
    [...CONFIG.niveaux, { id: "tout", nom: "Tout" }].forEach(n => {
      segment.append(el("button", {
        "aria-pressed": actif === n.id ? "true" : "false",
        onclick: () => { Contenu.changerNiveau(n.id); surChangement(); }
      }, n.nom));
    });
    return segment;
  }
};

/* — Indices progressifs (réutilisés par le moteur de missions) — */
const Indices = {
  /** Construit la liste des indices d'un exercice, en complétant automatiquement
   *  le niveau « Fonction » depuis le registre de formules. */
  pour(ex) {
    const liste = [];
    const fn = ex.fonction || ex.fonctionRequise || ex.validation?.fonctionRequise;
    if (ex.piste) liste.push({ titre: "Piste", texte: ex.piste });
    if (fn && FONCTIONS[fn]) liste.push({ titre: "Fonction", texte: `${FONCTIONS[fn].signature} — ${FONCTIONS[fn].aide}.` });
    if (ex.exemple) liste.push({ titre: "Exemple", texte: ex.exemple });
    const solution = ex.solution || ex.solutions?.[0] || (ex.type === "qcm" ? ex.options?.[ex.reponse] : null);
    if (solution) liste.push({ titre: "Solution", texte: solution, revele: true });
    return liste;
  },

  /** Multiplicateur d'XP : chaque indice coûte, la solution révélée annule le gain. */
  multiplicateurXp(utilises, liste) {
    if (utilises > 0 && liste[utilises - 1]?.revele) return 0;
    return Math.max(0.25, 1 - 0.25 * utilises);
  },

  /** Poids sur la maîtrise : aidé ne veut pas dire acquis, mais reste positif. */
  facteurMaitrise(utilises, liste) {
    if (utilises > 0 && liste[utilises - 1]?.revele) return 0.2;
    return Math.max(0.35, 1 - 0.2 * utilises);
  }
};

/** Fonctions Excel réellement citées par un exercice (pour le résumé de fin de série). */
function fonctionsDe(ex) {
  const texte = [ex.question, ex.extrait, ex.explication, ex.exemple, ex.solution,
                 ...(ex.solutions || []), ...(ex.options || [])].filter(Boolean).join(" ").toUpperCase();
  return Object.keys(FONCTIONS).filter(nom =>
    new RegExp("(^|[^A-Z0-9._])" + nom.replace(/\./g, "\\.") + "\\s*\\(").test(texte));
}

const Session = {
  courante: null,

  /** Priorise ce qui n'a jamais été vu, ce qui a été raté, et les compétences faibles. */
  choisir(competence, nb) {
    const vivier = CONTENU.exercices
      .filter(ex => (!competence || ex.competence === competence) && Contenu.accessible(ex));
    const notes = vivier.map(ex => {
        const h = Store.etat.exercices[ex.id];
        const m = Progression.maitrise(ex.competence);
        let score = Math.random();
        if (!h || h.tentatives === 0) score += 3;
        else if (h.reussites === 0) score += 2.5;
        else if (h.tentatives > h.reussites) score += 1.5;
        else score -= 1;
        if (m.effective < CONFIG.seuilRevision) score += 1.5;
        return { ex, score };
      });
    return notes.sort((a, b) => b.score - a.score).slice(0, nb).map(x => x.ex);
  },

  demarrer(competence = null, nb = 5) {
    const liste = Session.choisir(competence, nb);
    if (!liste.length) return false;
    Session.courante = { liste, index: 0, reussites: 0, xp: 0, certifs: [], indices: 0, aides: 0,
                         etat: "question", dernier: null, competence };
    return true;
  },

  exercice() { const s = Session.courante; return s ? s.liste[s.index] : null; },

  /** Révèle l'indice suivant et renvoie la liste des indices déjà visibles. */
  indiceSuivant() {
    const s = Session.courante;
    const liste = Indices.pour(Session.exercice());
    if (s.indices < liste.length) s.indices++;
    return liste.slice(0, s.indices);
  },

  repondre(reponse) {
    const s = Session.courante, ex = Session.exercice();
    const res = TYPES_EXERCICE[ex.type].valider(ex, reponse);
    const liste = Indices.pour(ex);
    const xp = res.reussi ? Math.round(10 * (ex.difficulte || 1) * Indices.multiplicateurXp(s.indices, liste)) : 0;
    const certifs = Progression.enregistrerResultat({
      competences: [ex.competence], reussi: res.reussi,
      difficulte: ex.difficulte || 1, xp,
      facteur: res.reussi ? Indices.facteurMaitrise(s.indices, liste) : 1,
      idExercice: ex.id
    });
    if (res.reussi) { s.reussites++; s.xp += xp; }
    if (s.indices > 0) s.aides++;
    s.certifs.push(...certifs);
    s.etat = "retour";
    s.dernier = { ...res, xp, reponse, indices: s.indices };
    return s.dernier;
  },

  suivant() {
    const s = Session.courante;
    if (s.index < s.liste.length - 1) { s.index++; s.etat = "question"; s.dernier = null; s.indices = 0; }
    else {
      s.etat = "bilan";
      if (s.reussites === s.liste.length && s.liste.length >= 5) {
        Store.modifier(e => { e.stats = e.stats || { seriesParfaites: 0 }; e.stats.seriesParfaites++; });
      }
    }
  },

  quitter() { Session.courante = null; }
};

/* ══ 6e. MOTEUR DE MISSIONS ═════════════════════════════════ */
/** Validateurs déclaratifs. Ajouter un type de contrôle = ajouter une entrée. */
const VALIDATEURS = {

  /** Une cellule doit contenir une formule utilisant la bonne fonction et donnant la bonne valeur. */
  cellule(v, f) {
    const c = f.cellules[v.cible];
    const saisie = String(c?.saisie || "").trim();
    if (!saisie) return { reussi: false, message: `La cellule ${v.cible} est encore vide.` };
    if (v.formuleObligatoire !== false && !saisie.startsWith("="))
      return { reussi: false, message: `En ${v.cible}, le résultat doit être calculé par une formule : saisi en dur, il ne se mettra pas à jour.` };
    if (v.fonctionRequise && !Formules.utilise(saisie, v.fonctionRequise))
      return { reussi: false, message: `La formule de ${v.cible} doit s'appuyer sur ${v.fonctionRequise}.` };
    if (c.erreur) return { reussi: false, message: `${v.cible} renvoie ${c.erreur}. ${Formules.messageErreur(c.erreur)}` };
    const attendu = v.attendu;
    const juste = typeof attendu === "number"
      ? Math.abs((c.valeur ?? NaN) - attendu) < (v.tolerance ?? 0.005)
      : versTexte(c.valeur).trim().toLowerCase() === versTexte(attendu).trim().toLowerCase();
    if (juste) return { reussi: true };
    const obtenu = Feuille.afficher(f, v.cible).texte || "rien";
    if (v.fonctionRequise)     // la fonction est la bonne : c'est donc ce qu'elle vise qui ne l'est pas
      return { reussi: false, message: `${v.cible} renvoie « ${obtenu} ». La fonction est la bonne, mais vérifiez la cellule ou la plage qu'elle désigne : faites défiler la grille pour voir toutes les colonnes.` };
    return { reussi: false, message: `${v.cible} renvoie « ${obtenu} ». Vérifiez la plage ou les valeurs de sortie.` };
  },

  /** Le même contrôle appliqué à chaque cellule d'une plage. */
  plage(v, f) {
    const refs = Ref.listePlage(Ref.plage(v.plage));
    for (let i = 0; i < refs.length; i++) {
      const r = VALIDATEURS.cellule({ ...v, cible: refs[i], attendu: v.attendus[i] }, f);
      if (!r.reussi) return { reussi: false, message: r.message, cible: refs[i] };
    }
    return { reussi: true };
  },

  /** Une colonne calculée d'un tableau de données, désignée par son en-tête. */
  colonne(v, f) {
    const t = Feuille.tableau(f, v.tableau);
    if (!t) return { reussi: false, message: `Le tableau « ${v.tableau} » est introuvable.` };
    const refs = t.refsColonne(v.entete);
    if (!refs.length) return { reussi: false, message: `La colonne « ${v.entete} » est introuvable.` };
    for (let i = 0; i < refs.length; i++) {
      const r = VALIDATEURS.cellule({ ...v, cible: refs[i], attendu: v.attendus[i] }, f);
      if (!r.reussi) return { reussi: false, message: r.message, cible: refs[i] };
    }
    return { reussi: true };
  },

  /** Le tableau doit être trié selon une colonne et un sens donnés. */
  tri(v, f) {
    const t = Feuille.tableau(f, v.tableau);
    if (!t) return { reussi: false, message: `Le tableau « ${v.tableau} » est introuvable.` };
    const valeurs = t.lignes().map(l => l[v.entete]);
    if (!valeurs.length) return { reussi: false, message: `La colonne « ${v.entete} » est introuvable.` };
    const sens = v.sens === "desc" ? -1 : 1;
    for (let i = 1; i < valeurs.length; i++) {
      if (comparerValeurs(valeurs[i - 1], valeurs[i]) * sens > 0)
        return { reussi: false, message: `Le tableau n'est pas encore trié par ${v.entete} en ordre ${v.sens === "desc" ? "décroissant" : "croissant"}.` };
    }
    return { reussi: true };
  },

  /** Seules certaines lignes doivent rester visibles après filtrage. */
  filtre(v, f) {
    const t = Feuille.tableau(f, v.tableau);
    if (!t) return { reussi: false, message: `Le tableau « ${v.tableau} » est introuvable.` };
    const visibles = t.lignes()
      .filter(l => !f.lignesMasquees || !f.lignesMasquees.has(l.__ligne))
      .map(l => versTexte(l[v.entete]).trim().toLowerCase());
    const attendus = v.attendus.map(x => versTexte(x).trim().toLowerCase());
    if (visibles.length !== attendus.length)
      return { reussi: false, message: `${visibles.length} ligne(s) visible(s), ${attendus.length} attendue(s). Ajustez le filtre.` };
    const manquant = attendus.find(a => !visibles.includes(a));
    if (manquant) return { reussi: false, message: `Le filtre ne laisse pas apparaître « ${manquant} ».` };
    return { reussi: true };
  },

  /** Le bon jeu de cellules doit être mis en évidence : on valide l'effet, pas la manipulation. */
  conditionnel(v, f) {
    const p = Ref.plage(v.plage);
    if (!p) return { reussi: false, message: `Plage ${v.plage} invalide.` };
    if (!(f.reglesMFC || []).length)
      return { reussi: false, message: "Aucune règle de mise en forme n'est encore posée." };
    const refs = Ref.listePlage(p);
    const mises = refs.filter(r => {
      const res = MFC.appliquer(f, r);
      return res && (!v.style || res.style === v.style);
    });
    const attendues = v.cellulesAttendues;
    const enTrop = mises.filter(r => !attendues.includes(r));
    const manquantes = attendues.filter(r => !mises.includes(r));
    if (manquantes.length)
      return { reussi: false, message: `${manquantes[0]} devrait être mise en évidence et ne l'est pas. Vérifiez la condition ou le style choisi.` };
    if (enTrop.length)
      return { reussi: false, message: `${enTrop[0]} est mise en évidence alors qu'elle ne devrait pas l'être. La condition est trop large.` };
    return { reussi: true };
  },

  /** Le croisement doit reposer sur les bons champs et produire les bons chiffres. */
  tcd(v, f) {
    const def = f.tcd;
    if (!def) return { reussi: false, message: "Aucun tableau croisé n'a encore été construit." };
    if (v.lignes && def.lignes !== v.lignes)
      return { reussi: false, message: `Le champ placé en lignes doit être « ${v.lignes} ».` };
    if ("colonnes" in v && (def.colonnes || null) !== (v.colonnes || null))
      return { reussi: false, message: v.colonnes
        ? `Placez « ${v.colonnes} » en colonnes.`
        : "Retirez le champ placé en colonnes : le croisement doit tenir sur une seule dimension." };
    if (v.valeur && def.valeur !== v.valeur)
      return { reussi: false, message: `Le champ à agréger doit être « ${v.valeur} ».` };
    if (v.agregat && def.agregat !== v.agregat)
      return { reussi: false, message: `Le calcul doit être « ${TCD.agregats[v.agregat].nom} », pas « ${TCD.agregats[def.agregat]?.nom || def.agregat} ».` };

    const r = TCD.calculer(f, def);
    if (!r) return { reussi: false, message: "Le croisement ne peut pas être calculé avec ces champs." };
    const nb = x => x === null ? "rien" : Formatage.nombre(x, "auto");
    for (const c of (v.controles || [])) {
      const obtenu = c.colonne ? r.cellule(c.ligne, c.colonne) : r.totalLigne(c.ligne);
      if (obtenu === null || Math.abs(obtenu - c.valeur) > 0.005)
        return { reussi: false, message: `Pour ${c.ligne}${c.colonne ? " / " + c.colonne : ""}, le croisement donne ${nb(obtenu)} au lieu de ${nb(c.valeur)}.` };
    }
    if (v.general !== undefined && Math.abs((r.general ?? NaN) - v.general) > 0.005)
      return { reussi: false, message: `Le total général donne ${nb(r.general)} au lieu de ${nb(v.general)}.` };
    return { reussi: true };
  },

  /** Le graphique doit être du bon type, reposer sur les bons champs et afficher les bonnes valeurs. */
  graphique(v, f) {
    const def = f.graphique;
    if (!def) return { reussi: false, message: "Aucun graphique n'a encore été créé." };
    if (v.forme && def.type !== v.forme)
      return { reussi: false, message: `Le type de graphique doit être « ${Graphique.types[v.forme].nom} », pas « ${Graphique.types[def.type]?.nom || def.type} ».` };
    if (v.libelles && def.libelles !== v.libelles)
      return { reussi: false, message: `Les étiquettes doivent venir du champ « ${v.libelles} ».` };
    if (v.valeurs && def.valeurs !== v.valeurs)
      return { reussi: false, message: `Le champ représenté doit être « ${v.valeurs} ».` };
    if (v.agregat && def.agregat !== v.agregat)
      return { reussi: false, message: `Le calcul doit être « ${TCD.agregats[v.agregat].nom} ».` };
    const serie = Graphique.serie(f, def);
    if (!serie) return { reussi: false, message: "Le graphique ne peut pas être calculé avec ces champs." };
    for (const c of (v.controles || [])) {
      const point = serie.find(s => s.nom === c.ligne);
      if (!point || Math.abs(point.valeur - c.valeur) > 0.005)
        return { reussi: false, message: `La valeur représentée pour ${c.ligne} devrait être ${Formatage.nombre(c.valeur, "auto")}.` };
    }
    if (v.nbPoints !== undefined && serie.length !== v.nbPoints)
      return { reussi: false, message: `Le graphique devrait comporter ${v.nbPoints} points, il en a ${serie.length}.` };
    return { reussi: true };
  },

  /** Une formule matricielle : bonne fonction, et bonne liste de valeurs déployées. */
  matriciel(v, f) {
    const c = f.cellules[v.cible];
    const saisie = String(c?.saisie || "").trim();
    if (!saisie) return { reussi: false, message: `La cellule ${v.cible} est encore vide.` };
    if (!saisie.startsWith("=")) return { reussi: false, message: `En ${v.cible}, le résultat doit être calculé par une formule.` };
    if (v.fonctionRequise && !Formules.utilise(saisie, v.fonctionRequise))
      return { reussi: false, message: `La formule de ${v.cible} doit s'appuyer sur ${v.fonctionRequise}.` };
    if (c.erreur) return { reussi: false, message: `${v.cible} renvoie ${c.erreur}. ${Formules.messageErreur(c.erreur)}` };
    const obtenus = c.matrice ? [...c.matrice] : [c.valeur];
    if (obtenus.length !== v.attendus.length)
      return { reussi: false, message: `La formule déploie ${obtenus.length} valeur(s), il en faut ${v.attendus.length}. Vérifiez la condition ou la plage.` };
    for (let i = 0; i < v.attendus.length; i++) {
      const a = v.attendus[i], o = obtenus[i];
      const juste = typeof a === "number" ? Math.abs((o ?? NaN) - a) < 0.005
                                          : versTexte(o).trim().toLowerCase() === versTexte(a).trim().toLowerCase();
      if (!juste) return { reussi: false, message: `La ${i + 1}ᵉ valeur déployée est « ${versTexte(o)} » au lieu de « ${versTexte(a)} ».` };
    }
    return { reussi: true };
  },

  /** Aucune cellule de la plage ne doit conserver d'espaces parasites. */
  sansEspaces(v, f) {
    const fautive = Ref.listePlage(Ref.plage(v.plage))
      .find(r => { const t = versTexte(f.cellules[r]?.valeur); return t !== t.trim() || /\s{2,}/.test(t); });
    return fautive
      ? { reussi: false, message: `${fautive} contient encore des espaces en trop.`, cible: fautive }
      : { reussi: true };
  },

  /** La plage ne doit plus contenir deux fois la même valeur. */
  sansDoublons(v, f) {
    const vus = new Map();
    for (const r of Ref.listePlage(Ref.plage(v.plage))) {
      const t = versTexte(f.cellules[r]?.valeur).trim().toLowerCase();
      if (!t) continue;
      if (vus.has(t)) return { reussi: false, message: `${r} reprend la même valeur que ${vus.get(t)}.`, cible: r };
      vus.set(t, r);
    }
    return { reussi: true };
  },

  /** Un format d'affichage doit être appliqué à toute la plage. */
  format(v, f) {
    const fautive = Ref.listePlage(Ref.plage(v.plage)).find(r => Feuille.formatDe(f, r) !== v.format);
    return fautive
      ? { reussi: false, message: `${fautive} n'est pas encore au format « ${Formatage.libelles[v.format]} ».`, cible: fautive }
      : { reussi: true };
  }
};

/** Ateliers : outils montés à côté de la grille quand une étape les réclame.
 *  Une étape déclare simplement `atelier:"tri"`. Ajouter un module = ajouter une entrée ici
 *  et le validateur correspondant dans VALIDATEURS. */
const ATELIERS = {

  tri: {
    monter(m, etape) {
      const f = m.feuille;
      const t = Feuille.tableau(f, etape.tableau);
      if (!t) return el("div.vide", { style: "margin-top:16px" },
        el("div.vide__boite", {}, el("h3", {}, "Tableau introuvable")));
      f.vue = f.vue || { tri: null, filtres: {} };

      const panneau = el("div.atelier", {});
      const etatLigne = el("div.atelier__etat", {});

      const majEtat = () => {
        const lignes = t.lignes();
        const caches = lignes.filter(l => f.lignesMasquees && f.lignesMasquees.has(l.__ligne)).length;
        etatLigne.replaceChildren(
          el("span", {}, caches ? `${lignes.length - caches} lignes affichées sur ${lignes.length}` : `${lignes.length} lignes`),
          ...(f.vue.tri ? [el("span.puce.puce--accent", {},
            `Trié par ${f.vue.tri.entete} ${f.vue.tri.sens === "desc" ? "décroissant" : "croissant"}`)] : [])
        );
      };

      /* Tri : réécrit physiquement les lignes du tableau, comme Excel */
      const selTri = el("select", {}, t.entetes.map(h => el("option", { value: h }, h)));
      const selSens = el("select", {},
        el("option", { value: "asc" }, "Croissant"), el("option", { value: "desc" }, "Décroissant"));

      const trier = () => {
        const entete = selTri.value, sens = selSens.value;
        const ordonnees = [...t.lignes()].sort((a, b) => comparerValeurs(a[entete], b[entete]) * (sens === "desc" ? -1 : 1));
        const source = ordonnees.map(ligne => t.entetes.map(h => {
          const c = f.cellules[ligne.__refs[h]];
          return { saisie: c ? c.saisie : "", format: c ? c.format : null };
        }));
        const modifs = {};
        source.forEach((ligne, i) => ligne.forEach((cel, j) => {
          modifs[Ref.vers(t.colDebut + j, t.premiereLigne + i)] = cel;
        }));
        m.tableurUI.appliquer(modifs);
        f.vue.tri = { entete, sens };
        majEtat();
      };

      /* Filtre : masque des lignes sans toucher aux données */
      const selFiltre = el("select", {}, t.entetes.map(h => el("option", { value: h }, h)));
      const valeursBoite = el("div.atelier__valeurs", {});

      const listerValeurs = () => {
        const entete = selFiltre.value;
        const distinctes = [...new Set(t.lignes().map(l => versTexte(l[entete])))].sort((a, b) => a.localeCompare(b, "fr"));
        const actives = f.vue.filtres[entete];
        valeursBoite.replaceChildren(...distinctes.map(v =>
          el("label.atelier__valeur", {},
            el("input", { type: "checkbox", value: v, checked: !actives || actives.includes(v) ? "" : null }),
            el("span", {}, v === "" ? "(vide)" : v))));
      };

      const recalculerMasquage = () => {
        const masquees = new Set();
        t.lignes().forEach(ligne => {
          const garder = Object.entries(f.vue.filtres).every(([h, valeurs]) => valeurs.includes(versTexte(ligne[h])));
          if (!garder) masquees.add(ligne.__ligne);
        });
        f.lignesMasquees = masquees;
        m.tableurUI.redessiner();
        m.tableurUI.rafraichir();
        majEtat();
      };

      const appliquerFiltre = () => {
        const entete = selFiltre.value;
        const cochees = [...valeursBoite.querySelectorAll("input:checked")].map(i => i.value);
        const distinctes = [...new Set(t.lignes().map(l => versTexte(l[entete])))];
        if (cochees.length === distinctes.length) delete f.vue.filtres[entete];
        else f.vue.filtres[entete] = cochees;
        recalculerMasquage();
      };

      const effacer = () => { f.vue.filtres = {}; listerValeurs(); recalculerMasquage(); };

      selFiltre.addEventListener("change", listerValeurs);
      listerValeurs();
      majEtat();

      panneau.append(
        el("div.atelier__titre", {}, `Tri et filtres — tableau « ${t.nom} »`),
        el("div.atelier__ligne", {},
          el("span.atelier__lib", {}, "Trier par"), selTri, selSens,
          el("button.btn", { onclick: trier }, "Trier")),
        el("div.atelier__ligne", {},
          el("span.atelier__lib", {}, "Filtrer sur"), selFiltre,
          el("button.btn", { onclick: appliquerFiltre }, "Appliquer"),
          el("button.btn.btn--nu", { onclick: effacer }, "Tout afficher")),
        valeursBoite,
        etatLigne
      );
      return panneau;
    }
  },

  conditionnel: {
    monter(m, etape) {
      const f = m.feuille;
      f.reglesMFC = f.reglesMFC || [];

      const champPlage = el("input.saisie", { type: "text", value: etape.plage || "", "aria-label": "Plage de cellules",
        placeholder: "Ex. D2:D6", style: "width:104px" });
      const selType = el("select", { "aria-label": "Type de règle" }, Object.entries(MFC.types).map(([k, d]) => el("option", { value: k }, d.nom)));
      const champVal = el("input.saisie", { type: "text", placeholder: "Valeur", "aria-label": "Valeur de comparaison", style: "width:104px" });
      const selStyle = el("select", { "aria-label": "Mise en forme" }, Object.entries(MFC.styles).map(([k, n]) => el("option", { value: k }, n)));
      const boiteVal = el("span", {}, champVal);
      const boiteStyle = el("span", {}, selStyle);
      const listeRegles = el("div", {});

      const majChamps = () => {
        const def = MFC.types[selType.value];
        boiteVal.style.display = def.valeur ? "" : "none";
        boiteStyle.style.display = def.barre ? "none" : "";
      };

      const majListe = () => {
        listeRegles.replaceChildren(...(f.reglesMFC.length
          ? f.reglesMFC.map((r, i) => el("div.regle", {},
              el("span.regle__pastille", { style: `background:var(--${r.style === "rouge" ? "rouge-doux" : r.style === "vert" ? "accent-doux" : r.style === "ambre" ? "ambre-doux" : "surface-2"})` }),
              el("span.regle__texte", {}, MFC.libelle(r)),
              el("button.btn.btn--nu", { style: "padding:3px 8px;font-size:12px",
                onclick: () => { f.reglesMFC.splice(i, 1); m.tableurUI.rafraichir(); majListe(); } }, "Retirer")))
          : [el("p.tres-muet", { style: "font-size:12.5px;padding:8px 0" }, "Aucune règle posée pour l'instant.")]));
      };

      const ajouter = () => {
        const plage = champPlage.value.trim().toUpperCase();
        if (!Ref.plage(plage)) { Toast.afficher("Indiquez une plage valide, par exemple D2:D6."); return; }
        const def = MFC.types[selType.value];
        if (def.valeur && champVal.value.trim() === "") { Toast.afficher("Cette règle attend une valeur de comparaison."); return; }
        const brut = champVal.value.trim().replace(",", ".");
        f.reglesMFC.push({
          plage, type: selType.value,
          valeur: /^-?\d+(\.\d+)?$/.test(brut) ? parseFloat(brut) : champVal.value.trim(),
          style: def.barre ? null : selStyle.value
        });
        m.tableurUI.rafraichir();
        majListe();
      };

      selType.addEventListener("change", majChamps);
      majChamps();
      majListe();

      return el("div.atelier", {},
        el("div.atelier__titre", {}, "Mise en forme conditionnelle"),
        el("div.atelier__ligne", {},
          el("span.atelier__lib", {}, "Plage"), champPlage,
          selType, boiteVal, boiteStyle,
          el("button.btn", { onclick: ajouter }, "Ajouter la règle")),
        el("div", { style: "margin-top:6px" }, listeRegles),
        el("div.atelier__etat", {},
          el("span", {}, "Les règles changent l'apparence, jamais les valeurs."))
      );
    }
  },

  tcd: {
    monter(m, etape) {
      const f = m.feuille;
      const t = Feuille.tableau(f, etape.tableau);
      if (!t) return el("div.vide", { style: "margin-top:16px" },
        el("div.vide__boite", {}, el("h3", {}, "Tableau introuvable")));

      const option = (v, n) => el("option", { value: v }, n);
      const selLignes = el("select", {}, t.entetes.map(h => option(h, h)));
      const selColonnes = el("select", {}, [option("", "— aucun —"), ...t.entetes.map(h => option(h, h))]);
      const selValeur = el("select", {}, t.entetes.map(h => option(h, h)));
      const selAgregat = el("select", {}, Object.entries(TCD.agregats).map(([k, d]) => option(k, d.nom)));
      const rendu = el("div.tcd", {});

      if (f.tcd) {
        selLignes.value = f.tcd.lignes || t.entetes[0];
        selColonnes.value = f.tcd.colonnes || "";
        selValeur.value = f.tcd.valeur || t.entetes[t.entetes.length - 1];
        selAgregat.value = f.tcd.agregat || "somme";
      } else {
        selValeur.value = t.entetes[t.entetes.length - 1];
      }

      const dessiner = () => {
        const r = TCD.calculer(f, f.tcd);
        if (!r) {
          rendu.replaceChildren(el("p.tcd__vide", {}, "Choisissez les champs, puis construisez le croisement."));
          return;
        }
        const nb = v => v === null ? "" : Formatage.nombre(v, "auto");
        const colonnes = r.modC || [null];
        const thead = el("thead", {}, el("tr", {},
          el("th", {}, f.tcd.lignes),
          colonnes.map(c => el("th", {}, c === null ? r.agregat : c)),
          r.modC ? el("th", {}, "Total") : null
        ));
        const tbody = el("tbody", {}, r.modL.map(l => el("tr", {},
          el("th.tcd__cle", {}, l),
          colonnes.map(c => el("td", {}, nb(r.cellule(l, c)))),
          r.modC ? el("td.tcd__total", {}, nb(r.totalLigne(l))) : null
        )));
        const tfoot = el("tfoot", {}, el("tr", {},
          el("th.tcd__cle.tcd__total", {}, "Total"),
          colonnes.map(c => el("td.tcd__total", {}, nb(c === null ? r.general : r.totalColonne(c)))),
          r.modC ? el("td.tcd__total", {}, nb(r.general)) : null
        ));
        rendu.replaceChildren(el("table", {}, thead, tbody, tfoot));
      };

      const construire = () => {
        f.tcd = {
          tableau: etape.tableau,
          lignes: selLignes.value,
          colonnes: selColonnes.value || null,
          valeur: selValeur.value,
          agregat: selAgregat.value
        };
        dessiner();
      };

      dessiner();
      return el("div.atelier", {},
        el("div.atelier__titre", {}, `Tableau croisé — données « ${t.nom} »`),
        el("div.atelier__ligne", {},
          el("span.atelier__lib", {}, "Lignes"), selLignes,
          el("span.atelier__lib", {}, "Colonnes"), selColonnes),
        el("div.atelier__ligne", {},
          el("span.atelier__lib", {}, "Valeurs"), selValeur, selAgregat,
          el("button.btn", { onclick: construire }, "Construire")),
        rendu,
        el("div.atelier__etat", {},
          el("span", {}, "Le croisement se recalcule sur les données du tableau : il ne les modifie jamais."))
      );
    }
  },

  graphique: {
    monter(m, etape) {
      const f = m.feuille;
      const t = Feuille.tableau(f, etape.tableau);
      if (!t) return el("div.vide", { style: "margin-top:16px" },
        el("div.vide__boite", {}, el("h3", {}, "Tableau introuvable")));

      const option = (v, n) => el("option", { value: v }, n);
      const selType = el("select", {}, Object.entries(Graphique.types).map(([k, d]) => option(k, d.nom)));
      const selLib = el("select", {}, t.entetes.map(h => option(h, h)));
      const selVal = el("select", {}, t.entetes.map(h => option(h, h)));
      const selAgg = el("select", {}, Object.entries(TCD.agregats).map(([k, d]) => option(k, d.nom)));
      const rendu = el("div", {});

      if (f.graphique) {
        selType.value = f.graphique.type || "colonnes";
        selLib.value = f.graphique.libelles || t.entetes[0];
        selVal.value = f.graphique.valeurs || t.entetes[t.entetes.length - 1];
        selAgg.value = f.graphique.agregat || "somme";
      } else {
        selVal.value = t.entetes[t.entetes.length - 1];
      }

      const dessiner = () => rendu.replaceChildren(
        f.graphique
          ? Graphique.dessiner(Graphique.serie(f, f.graphique), f.graphique.type)
          : el("p.tcd__vide", {}, "Choisissez les champs, puis créez le graphique."));

      const creer = () => {
        f.graphique = { tableau: etape.tableau, type: selType.value, libelles: selLib.value,
                        valeurs: selVal.value, agregat: selAgg.value };
        dessiner();
      };

      dessiner();
      return el("div.atelier", {},
        el("div.atelier__titre", {}, `Graphique — données « ${t.nom} »`),
        el("div.atelier__ligne", {},
          el("span.atelier__lib", {}, "Type"), selType,
          el("span.atelier__lib", {}, "Étiquettes"), selLib),
        el("div.atelier__ligne", {},
          el("span.atelier__lib", {}, "Valeurs"), selVal, selAgg,
          el("button.btn", { onclick: creer }, "Créer le graphique")),
        rendu,
        el("div.atelier__etat", {},
          el("span", {}, "Le graphique regroupe les données comme un croisement : il ne les modifie jamais."))
      );
    }
  }
};

/** Applique une validation, en contrôlant d'abord son préalable éventuel.
 *  Permet à une étape d'exiger qu'un état posé plus tôt (un filtre, un tri) soit toujours en place. */
function appliquerValidation(v, f) {
  if (v.prealable) {
    const pre = (VALIDATEURS[v.prealable.type] || (() => ({ reussi: true })))(v.prealable, f);
    if (!pre.reussi) return { reussi: false, message: v.messagePrealable || pre.message };
  }
  const validateur = VALIDATEURS[v.type];
  return validateur ? validateur(v, f) : { reussi: false, message: "Contrôle indisponible." };
}

const Mission = {
  courante: null,

  progres(id) { return Store.etat.missions[id] || null; },

  demarrer(id) {
    const def = CONTENU.missions.find(m => m.id === id);
    if (!def) return false;
    const feuille = Feuille.creer(def.feuille);
    const sauvegarde = Store.etat.missions[id];
    if (sauvegarde?.brouillon) {
      Object.entries(sauvegarde.brouillon).forEach(([r, s]) => Feuille.saisir(feuille, r, s));
      Feuille.recalculer(feuille);
    }
    Mission.courante = {
      def, feuille,
      etape: Math.min(sauvegarde?.etape || 0, def.etapes.length - 1),
      indices: 0, indicesTotal: 0, etoiles: 0, certifs: [],
      etat: "encours", retour: null, tableurUI: null
    };
    return true;
  },

  etape() { const m = Mission.courante; return m ? m.def.etapes[m.etape] : null; },

  /** Objet passé au module d'indices : l'étape enrichie de sa fonction requise. */
  sourceIndices() {
    const e = Mission.etape();
    return e ? { ...e, fonctionRequise: e.fonctionRequise || e.validation?.fonctionRequise } : {};
  },

  indiceSuivant() {
    const m = Mission.courante;
    const liste = Indices.pour(Mission.sourceIndices());
    if (m.indices < liste.length) { m.indices++; m.indicesTotal++; }
    return liste.slice(0, m.indices);
  },

  /** Mémorise les cellules saisies par l'utilisateur pour reprendre la mission plus tard. */
  sauvegarderBrouillon() {
    const m = Mission.courante;
    if (!m) return;
    const brouillon = {};
    Object.entries(m.feuille.cellules).forEach(([ref, c]) => {
      if (!c.verrou && String(c.saisie).trim() !== "") brouillon[ref] = c.saisie;
    });
    Store.modifier(e => {
      const enr = e.missions[m.def.id] || (e.missions[m.def.id] = { statut: "en-cours", etoiles: 0, indicesUtilises: 0 });
      enr.brouillon = brouillon;
      enr.etape = m.etape;
      if (enr.statut !== "terminee") enr.statut = "en-cours";
    });
  },

  verifier() {
    const m = Mission.courante, e = Mission.etape();
    const res = appliquerValidation(e.validation, m.feuille);
    m.retour = res;
    if (res.reussi) {
      m.indices = 0;
      if (m.etape < m.def.etapes.length - 1) { m.etape++; Mission.sauvegarderBrouillon(); }
      else Mission.terminer();
    }
    return res;
  },

  terminer() {
    const m = Mission.courante, def = m.def;
    m.etoiles = m.indicesTotal === 0 ? 3 : m.indicesTotal <= 2 ? 2 : 1;
    const facteur = Math.max(0.3, 1 - 0.1 * m.indicesTotal);
    m.xp = Math.round(30 * (def.difficulte || 1) * facteur);
    m.certifs = Progression.enregistrerResultat({
      competences: def.competences, reussi: true, difficulte: def.difficulte || 1,
      xp: m.xp, facteur, idMission: def.id
    });
    Store.modifier(s => {
      const enr = s.missions[def.id];
      enr.statut = "terminee";
      enr.etoiles = Math.max(enr.etoiles || 0, m.etoiles);
      enr.indicesUtilises = m.indicesTotal;
      enr.termineeLe = new Date().toISOString();
      delete enr.brouillon;
    });
    m.etat = "bilan";
  },

  recommencer(id) {
    Store.modifier(e => { if (e.missions[id]) { delete e.missions[id].brouillon; e.missions[id].etape = 0; } });
    return Mission.demarrer(id);
  },

  quitter() { Mission.sauvegarderBrouillon(); Mission.courante = null; }
};

/* ══ 6f. AUTOTEST DU CONTENU ════════════════════════════════ */
/** Rejoue chaque exercice et chaque étape de mission dans le navigateur :
 *  la solution annoncée doit être acceptée, et rien ne doit être validé d'avance. */
const Autotest = {

  /** Fonctions appelées par une formule mais absentes du registre. */
  fonctionsInconnues(saisie) {
    const inconnues = [];
    const parcourir = n => {
      if (!n || typeof n !== "object") return;
      if (n.t === "fn" && !FONCTIONS[n.nom]) inconnues.push(n.nom);
      ["g", "d", "e"].forEach(k => parcourir(n[k]));
      (n.args || []).forEach(parcourir);
    };
    try { parcourir(Formules.arbre(String(saisie).replace(/^\s*=/, ""))); }
    catch (_) { return ["formule non analysable"]; }
    return inconnues;
  },

  /** Applique une solution formulée à la zone visée. @returns {boolean} rejouable */
  rejouer(feuille, v, solution) {
    if (v.type === "format") {
      const p = Ref.plage(v.plage);
      if (!p) return false;
      Ref.listePlage(p).forEach(r => { Feuille.cellule(feuille, r, true).format = v.format; });
      Feuille.recalculer(feuille);
      return true;
    }
    let refs = null;
    if (v.type === "plage") { const p = Ref.plage(v.plage); refs = p ? Ref.listePlage(p) : null; }
    else if (v.type === "colonne") { const t = Feuille.tableau(feuille, v.tableau); refs = t ? t.refsColonne(v.entete) : null; }
    // cibleSaisie : l'utilisateur écrit ailleurs que là où l'on contrôle (une saisie qui met un total à jour).
    else if (v.type === "cellule" || v.type === "matriciel") {
      const ou = v.cibleSaisie || v.cible;
      refs = ou ? [ou] : null;
    }
    if (!refs || !refs.length || solution === undefined || solution === null) return false;
    const brut = String(solution).trim();
    if (!brut) return false;
    // Une solution littérale (le niveau Découverte en compte) se saisit telle quelle,
    // sans décalage de références : seules les formules se recopient.
    if (!brut.startsWith("=")) {
      if (refs.length > 1) return false;
      const attendue = v.cibleSaisie || v.cible;
      if (attendue && attendue !== refs[0]) return false;
      if (!/^[-+]?[\d\s.,]+$/.test(brut)) return false;   // pas une consigne rédigée
      Feuille.saisir(feuille, refs[0], brut);
      Feuille.recalculer(feuille);
      return true;
    }
    const p0 = Ref.depuis(refs[0]);
    refs.forEach(r => {
      const q = Ref.depuis(r);
      Feuille.saisir(feuille, r, Formules.decaler(brut, q.col - p0.col, q.ligne - p0.ligne));
    });
    Feuille.recalculer(feuille);
    return true;
  },

  executer() {
    const anomalies = [];
    let controles = 0;
    const NIVEAUX = CONFIG.niveaux.map(n => n.id);
    const verifier = (ok, quoi, message) => { controles++; if (!ok) anomalies.push({ quoi, message }); };

    /* — Exercices — */
    const vus = new Set();
    const positionsAffichees = [];
    CONTENU.exercices.forEach(ex => {
      verifier(!vus.has(ex.id), ex.id, "identifiant en double"); vus.add(ex.id);
      verifier(NIVEAUX.includes(ex.niveau), ex.id, `niveau inconnu : ${ex.niveau}`);
      verifier(!!CONTENU.competences.find(c => c.id === ex.competence), ex.id, `compétence inconnue : ${ex.competence}`);
      verifier(!!(ex.retenir && ex.usage && ex.explication), ex.id, "point à retenir, usage ou explication manquant");
      const indices = Indices.pour(ex);
      verifier(indices.length >= 2 && indices[indices.length - 1].revele, ex.id, "indices incomplets ou sans solution finale");
      if (ex.type === "qcm") {
        verifier(Array.isArray(ex.options) && ex.reponse >= 0 && ex.reponse < ex.options.length, ex.id, "réponse hors des options");
        verifier(new Set(ex.options.map(o => String(o).trim().toLowerCase())).size === ex.options.length,
          ex.id, "deux options identiques");
        // La bonne réponse ne doit pas être devinable à sa seule position affichée.
        const ordre = TYPES_EXERCICE.qcm.ordreAffichage(ex);
        verifier(ordre.length === ex.options.length && new Set(ordre).size === ordre.length,
          ex.id, "le mélange des options perd ou duplique un choix");
        positionsAffichees.push(ordre.indexOf(ex.reponse));
      }
      if (ex.type === "formule") {
        verifier(TYPES_EXERCICE.formule.valider(ex, ex.solutions[0]).reussi, ex.id, "la solution annoncée est refusée");
        verifier(!TYPES_EXERCICE.formule.valider(ex, "=ZZZZ(A1)").reussi, ex.id, "une formule fausse est acceptée");
        const inconnues = Autotest.fonctionsInconnues(ex.solutions[0]);
        verifier(inconnues.length === 0, ex.id, `la solution appelle une fonction absente du moteur : ${inconnues.join(", ")}`);
        if (ex.fonction) verifier(Formules.utilise(ex.solutions[0], ex.fonction), ex.id,
          `la solution n'utilise pas ${ex.fonction}, pourtant annoncée dans l'indice`);
      }
      if (ex.type === "grille") {
        const v = ex.validation || { ...ex, type: "cellule" };
        const f = Feuille.creer(ex.feuille);
        // Une solution ne doit pointer que sur des cellules réellement renseignées,
        // sinon l'énoncé demande de référencer une case vide.
        if (String(ex.solution || "").startsWith("=")) {
          const citees = String(ex.solution).match(/\$?[A-Z]{1,3}\$?\d+/g) || [];
          citees.forEach(r => {
            const ref = r.replace(/\$/g, "");
            const p = Ref.depuis(ref);
            const dansLaFeuille = p && p.col < ex.feuille.colonnes && p.ligne < ex.feuille.lignes;
            verifier(dansLaFeuille, ex.id, `la solution cite ${ref}, hors des limites de la feuille`);
            if (dansLaFeuille && ref !== v.cible) {
              const contenu = ex.feuille.cellules[ref];
              verifier(contenu !== undefined, ex.id, `la solution cite ${ref}, qui est vide dans l'énoncé`);
            }
          });
        }
        verifier(!TYPES_EXERCICE.grille.valider(ex, f).reussi, ex.id, "déjà validé avant toute action");
        if (Autotest.rejouer(f, v, ex.solution)) {
          const r = TYPES_EXERCICE.grille.valider(ex, f);
          verifier(r.reussi, ex.id, `la solution annoncée est refusée — ${r.message || ""}`);
        }
      }
    });

    /* — Distribution des bonnes réponses : aucune position ne doit dominer — */
    if (positionsAffichees.length >= 10) {
      const compte = {};
      positionsAffichees.forEach(p => { compte[p] = (compte[p] || 0) + 1; });
      const max = Math.max(...Object.values(compte));
      const part = max / positionsAffichees.length;
      verifier(part <= 0.45, "QCM (ensemble)",
        `${Math.round(part * 100)} % des bonnes réponses tombent à la même position : elles deviendraient devinables`);
    }

    /* — Missions — */
    const vusM = new Set();
    CONTENU.missions.forEach(def => {
      verifier(!vusM.has(def.id), def.id, "identifiant en double"); vusM.add(def.id);
      verifier(NIVEAUX.includes(def.niveau), def.id, `niveau inconnu : ${def.niveau}`);
      def.competences.forEach(c =>
        verifier(!!CONTENU.competences.find(x => x.id === c), def.id, `compétence inconnue : ${c}`));
      const f = Feuille.creer(def.feuille);
      def.etapes.forEach((e, i) => {
        const nom = `${def.id} · étape ${i + 1}`;
        const v = e.validation;
        verifier(!!VALIDATEURS[v.type], nom, `type de contrôle inconnu : ${v.type}`);
        verifier(!!(e.solution && e.retenir), nom, "solution ou point à retenir manquant");
        if (String(e.solution || "").trim().startsWith("=")) {
          const inconnues = Autotest.fonctionsInconnues(e.solution);
          verifier(inconnues.length === 0, nom, `la solution appelle une fonction absente du moteur : ${inconnues.join(", ")}`);
        }
        if (!VALIDATEURS[v.type]) return;
        if (v.prealable) {                          // dépend d'un état posé par un atelier : non rejouable ici
          Autotest.rejouer(f, v, e.solution);
          return;
        }
        verifier(!appliquerValidation(v, f).reussi, nom, "déjà validée avant toute action");
        if (Autotest.rejouer(f, v, e.solution)) {
          const r = appliquerValidation(v, f);
          verifier(r.reussi, nom, `la solution annoncée est refusée — ${r.message || ""}`);
        }
      });
    });

    return { controles, anomalies };
  }
};

/* ══ 7. VUES ════════════════════════════════════════════════ */
const Vues = {};

/* — Mémoire d'écran : jamais persistée, jamais lue par la logique — */
const Affichage = {
  retourFrais: false,          // vrai seulement au rendu qui suit une réponse : seul déclencheur d'animation
  avant: new WeakMap(),        // maîtrise relevée avant la première réponse d'une série ou d'une mission
  delta: null,                 // effet du dernier exercice sur sa compétence
  bilanFrais: false,           // vrai seulement au rendu qui suit la fin d'une mission
  vu: new Map(),               // dernière maîtrise affichée par compétence, pour n'animer que ce qui a changé

  consommerFrais() { const f = Affichage.retourFrais; Affichage.retourFrais = false; return f; },

  avantReponse(contexte, ids) {
    let reg = Affichage.avant.get(contexte);
    if (!reg) { reg = new Map(); Affichage.avant.set(contexte, reg); }
    const instant = ids.map(id => Math.round(Progression.maitrise(id).effective));
    ids.forEach((id, i) => { if (!reg.has(id)) reg.set(id, instant[i]); });
    return instant[0];
  },

  apresReponse(ex, avant, res) {
    const m = Progression.maitrise(ex.competence);
    const serie = Store.etat.competences[ex.competence]?.serie || 0;
    Affichage.retourFrais = true;
    Affichage.delta = { id: ex.id, avant, apres: Math.round(m.effective), serie,
      valide: !!res.reussi && serie >= CONFIG.serieConsolidation && m.brute >= 100 };
  }
};

const CODES_ERREUR = /(#(?:SYNTAXE|GUILLEMET|REF|VALEUR|CYCLE|PLAGE|ARGS|TAILLE|PROPAGATION|VIDE|TRI)!|#NOM\?|#DIV\/0!|#N\/A)/;

/** Texte dont les codes d'erreur sont mis en évidence ; le texte lui-même n'est pas modifié. */
function avecCodes(texte) {
  return String(texte).split(CODES_ERREUR).map((part, i) => i % 2 ? el("code.code-err", {}, part) : part);
}

/** Fonctions du catalogue citées dans un texte, quand elles ont une fiche : pour proposer d'aller les voir. */
function fonctionsCitees(texte) {
  return Formules.catalogue().map(f => f.nom).filter(nom => {
    if (!Fiche.disponible(nom)) return false;
    const motif = new RegExp("(^|[^A-Z.])" + nom.replace(/\./g, "\\.") + "(?![A-Z]|\\.[A-Z])");
    return motif.test(texte);
  });
}

/** Sépare l'explication de la solution attendue, quand le message en porte une. */
function corpsMessage(message) {
  if (!message) return [];
  const m = /^([\s\S]*?)\s*(Solution attendue|La bonne réponse était)\s*:\s*([\s\S]+)$/.exec(message);
  if (!m) return [el("p", {}, ...avecCodes(message))];
  return [
    m[1] ? el("p", {}, ...avecCodes(m[1])) : null,
    el("div.retour__solution", {},
      el("span.retour__etiquette", {}, m[2]),
      m[2] === "Solution attendue" ? el("code", {}, m[3]) : el("span", {}, m[3]))
  ];
}

/** Effet d'une réponse sur la compétence : ce qui donne envie de continuer. */
function ligneProgres(ex, r) {
  const d = Affichage.delta;
  if (!d || d.id !== ex.id) return null;
  if (!r.reussi) return el("div.retour__progres", {}, el("p", {}, "Cette question reviendra dans une prochaine série."));
  const comp = CONTENU.competences.find(c => c.id === ex.competence);
  const total = CONFIG.serieConsolidation, gain = d.apres - d.avant;
  const pips = el("span.pips", { role: "img", "aria-label": `${Math.min(d.serie, total)} sur ${total}` },
    Array.from({ length: total }, (_, i) => el("span", { class: i < d.serie ? "plein" : "" })));
  return el("div.retour__progres", {},
    el("div.retour__ligne", {}, el("span", {}, `Maîtrise · ${comp ? comp.nom : ex.competence}`),
      el("span.mono", {}, `${d.avant} % → ${d.apres} %`, gain > 0 ? el("span.delta", {}, ` +${gain}`) : null)),
    d.valide
      ? el("div.retour__ligne.retour__valide", {}, "Compétence validée : trois réussites d'affilée sans indice.")
      : el("div.retour__ligne", {}, el("span", {}, "Réussites sans indice d'affilée"), pips));
}

/** Carte de retour unique : réussite, échec, indice utilisé, codes d'erreur. */
function carteRetour(o) {
  const frais = Affichage.consommerFrais();
  return el("div.retour" + (o.reussi ? ".retour--juste" : ".retour--faux"),
    { id: "retour-actif", role: "status", "data-frais": frais ? "1" : null, style: o.style },
    el("div.retour__tete", {},
      el("span.retour__icone", { "aria-hidden": "true" }, o.reussi ? "✓" : "✕"),
      el("span.retour__titre", {}, o.titre),
      o.xp > 0 ? el("span.retour__xp", {}, `+${o.xp} XP`) : null),
    el("div.retour__corps", {},
      ...corpsMessage(o.message),
      o.explication ? el("p", {}, o.explication) : null,
      ...(o.notes || []).map(t => el("p.retour__note", {}, t)),
      o.progres || null,
      o.usage ? el("div.retour__usage", {}, el("b", {}, o.usage.etiquette), o.usage.texte) : null));
}

/** Après une réponse, le focus passe au bouton de suite : Entrée enchaîne, sans souris. */
function focaliserSuite(bouton, carte) {
  bouton.setAttribute("aria-describedby", "retour-actif");
  bouton.addEventListener("keydown", e => { if (e.repeat) e.preventDefault(); });
  if (carte.dataset.frais === "1") setTimeout(() => bouton.focus(), 120);
}

/** Retour d'un essai libre : même présentation que le retour officiel, mais sans XP ni progression. */
function carteEssai(res) {
  return el("div.retour" + (res.reussi ? ".retour--juste" : ".retour--faux") + ".retour--essai", { role: "status" },
    el("div.retour__tete", {},
      el("span.retour__icone", { "aria-hidden": "true" }, res.reussi ? "✓" : "✕"),
      el("span.retour__titre", {}, res.reussi ? "Essai libre : correct" : "Essai libre : pas encore")),
    el("div.retour__corps", {},
      // La solution est déjà affichée dans le retour officiel au-dessus : inutile de la répéter à chaque essai.
      ...corpsMessage(res.message).filter(n => !(n && n.classList && n.classList.contains("retour__solution"))),
      el("p.retour__note", {}, "Votre premier résultat reste celui qui compte : votre progression n'est pas modifiée.")));
}

/** Essai libre après un échec. La réponse est évaluée par `valider`, fonction pure du type d'exercice :
 *  rien n'est enregistré (ni XP, ni maîtrise, ni série) et le premier résultat reste celui qui compte. */
function zoneEssai(ex) {
  const zone = el("div.essai");
  const libelle = ex.type === "grille" ? "Recommencer sur une feuille neuve" : "Réessayer";
  const proposer = () => zone.replaceChildren(
    el("button.btn.essai__bouton", { onclick: lancer }, libelle),
    el("p.tres-muet.essai__note", {}, "Essai libre : votre premier résultat reste celui qui compte."));
  function lancer() {
    const rappels = [];
    const verdict = el("div.essai__verdict");
    const api = {
      repondre(r) {
        const res = TYPES_EXERCICE[ex.type].valider(ex, r);
        rappels.forEach(fn => fn({ ...res, reponse: r }));
        verdict.replaceChildren(carteEssai(res),
          ...(res.reussi ? [] : [el("button.btn.btn--nu.essai__bouton", { onclick: lancer }, "Réessayer encore")]));
      },
      surRetour(fn) { rappels.push(fn); },
      reponsePrecedente: null
    };
    zone.replaceChildren(el("div.essai__titre", {}, "Essai libre"), TYPES_EXERCICE[ex.type].rendre(ex, api), verdict);
  }
  proposer();
  return zone;
}

    ),

  );

function ligneCompetence(c) {
  const m = c.effective !== undefined ? c : { ...c, ...Progression.maitrise(c.id) };
  const exos = CONTENU.exercices.filter(x => x.competence === c.id && Contenu.accessible(x));
  const reussis = exos.filter(x => (Store.etat.exercices[x.id]?.reussites || 0) > 0).length;
  const restants = exos.length - reussis;

  const etat = Store.etat.competences[c.id] || {};
  const eff = Math.round(m.effective);
  const depuis = Affichage.vu.get(c.id);
  Affichage.vu.set(c.id, eff);
  const efface = m.jamaisTravaillee ? 0 : Math.max(0, (m.brute || 0) - eff);
  const valide = !m.jamaisTravaillee && eff >= 100;
  const serie = Math.min(etat.serie || 0, CONFIG.serieConsolidation);
  const jours = etat.derniereActivite ? Math.floor((Date.now() - new Date(etat.derniereActivite).getTime()) / 86400000) : null;
  const aReprendre = m.jamaisTravaillee || efface > 0 || m.effective < CONFIG.seuilRevision;

  const meta = [];
  if (valide) meta.push(el("span.puce.puce--ok", {}, "Validée"));
  else if (!m.jamaisTravaillee) meta.push(el("span.competence__serie", {},
    "Sans indice d'affilée",
    el("span.pips", { role: "img", "aria-label": `${serie} sur ${CONFIG.serieConsolidation}` },
      Array.from({ length: CONFIG.serieConsolidation }, (_, i) => el("span", { class: i < serie ? "plein" : "" })))));
  if (efface > 0) meta.push(el("span.puce.puce--erosion", {},
    `S'efface : −${efface} pts` + (jours !== null ? ` après ${jours} jours sans pratique` : "")));
  if (aReprendre) meta.push(el("button.btn.btn--nu.competence__reprise", {
    onclick: () => {
      if (!Session.courante && !Session.demarrer(c.id, 5)) { Toast.afficher("Aucun exercice disponible pour cette compétence."); return; }
      Routeur.aller("/exercices");
    } }, m.jamaisTravaillee ? "Commencer" : "S'entraîner"));

  return el("div.competence", {},
    el("div.competence__tete", {},
      el("div.competence__nom", {}, m.nom),
      el("div.competence__val", {}, m.jamaisTravaillee ? "non travaillée" : `${eff} %`)
    ),
    cellules(eff, 10, false, { fantome: efface > 0 ? m.brute : undefined, depuis, ok: valide }),
    meta.length ? el("div.competence__meta", {}, meta) : null,
    el("div.competence__desc", {},
      exos.length
        ? `${m.desc} · ${reussis} exercice(s) réussi(s) sur ${exos.length}` + (restants ? ` — ${restants} jamais réussi(s)` : "")
        : m.desc)
  );
}

  const p = Parcours.courant, ch = p.ch;

  const pas = p.etape === "lecon" ? 0 : p.etape === "bilan" ? p.liste.length : p.index;

  bloc.append(el("div.serie", {},

function questionChapitre(rafraichir) {
  const p = Parcours.courant, ex = Parcours.exercice();
  const bloc = el("div");
  const rappels = [];
  const api = {
    repondre(r) {
      const avant = Affichage.avantReponse(p, [ex.competence]);
      Affichage.apresReponse(ex, avant, Parcours.repondre(r));
      rafraichir();
    },
    surRetour(fn) { rappels.push(fn); },
    reponsePrecedente: p.etat === "retour" ? p.dernier.reponse : null
  };

  bloc.append(el("div.exo__meta", {},
    el("span.puce", {}, p.ch.titre),
    ex.categorie ? el("span.puce", {}, ex.categorie) : null));
  bloc.append(el("div.exo__question", {}, ex.question));
  if (ex.consigne) bloc.append(el("div.exo__consigne", {}, ex.consigne));
  if (ex.extrait) bloc.append(el("div.extrait", {}, ex.extrait));
  if (ex.apercu) bloc.append(apercuTableau(ex.apercu));
  bloc.append(TYPES_EXERCICE[ex.type].rendre(ex, api));

  const listeIndices = Indices.pour(ex);
  if (listeIndices.length && p.etat === "question") {
    const panneau = el("div.indices");
    const bouton = el("button.btn.btn--nu.indices__btn", {});
    const maj = () => {
      const restants = listeIndices.length - p.indices;
      const suiv = listeIndices[p.indices];
      bouton.textContent = restants === 0 ? "Tout est affiché"
        : suiv.revele ? "Afficher la solution"
        : p.indices === 0 ? "Besoin d'un indice ?" : "Indice suivant";
      bouton.disabled = restants === 0;
    };
    bouton.addEventListener("click", () => {
      const vus = Parcours.indiceSuivant();
      panneau.replaceChildren(bouton, ...vus.map(i =>
        el("div.indice" + (i.revele ? ".indice--solution" : ""), {},
          el("div.indice__titre", {}, i.titre), el("div", {}, i.texte))));
      maj();
    });
    maj();
    panneau.append(bouton);
    bloc.append(panneau);
  }

  if (p.etat === "retour") {
    const r = p.dernier;
    rappels.forEach(fn => fn(r));
    const carte = carteRetour({
      reussi: r.reussi, titre: r.reussi ? "Bonne réponse" : "Pas tout à fait", xp: r.xp,
      message: r.message, explication: ex.explication,
      progres: ligneProgres(ex, r),
      usage: ex.retenir ? { etiquette: "À retenir", texte: ex.retenir } : null
    });
    bloc.append(carte);
    if (!r.reussi) bloc.append(zoneEssai(ex));
    const suite = el("button.btn.btn--fort.btn--large", { onclick: () => { Parcours.suivant(); rafraichir(); window.scrollTo(0, 0); } },
      p.index < p.liste.length - 1 ? "Continuer" : "Terminer le chapitre");
    focaliserSuite(suite, carte);
    bloc.append(el("div", { style: "margin-top:16px" }, suite));
  }
  return bloc;
}

  bloc.append(el("div.serie", {},
    el("button.btn.btn--nu", { "aria-label": "Quitter la série", onclick: () => { Session.quitter(); rafraichir(); } }, "✕"),
    el("div.serie__cellules", {}, cellules(((s.etat === "bilan" ? s.liste.length : s.index) / s.liste.length) * 100, s.liste.length)),
    el("div.serie__compte", {}, s.etat === "bilan" ? "Terminé" : `${s.index + 1} / ${s.liste.length}`)
  ));

  bloc.append(s.etat === "bilan" ? ecranBilan(rafraichir) : ecranQuestion(rafraichir));
  return bloc;
}

function ecranQuestion(rafraichir) {
  const s = Session.courante, ex = Session.exercice();
  const bloc = el("div");
  const rappels = [];
  const api = {
    repondre(r) {
      const avant = Affichage.avantReponse(s, [ex.competence]);
      Affichage.apresReponse(ex, avant, Session.repondre(r));
      rafraichir();
    },
    surRetour(fn) { rappels.push(fn); },
    reponsePrecedente: s.etat === "retour" ? s.dernier.reponse : null
  };

  const comp = CONTENU.competences.find(c => c.id === ex.competence);
  bloc.append(el("div.exo__meta", {},
    el("span.puce", {}, comp ? comp.nom : ex.competence),
    ex.categorie ? el("span.puce", {}, ex.categorie) : null,
    el("span.tres-muet.mono", { style: "font-size:11.5px" }, "•".repeat(ex.difficulte || 1))
  ));
  bloc.append(el("div.exo__question", {}, ex.question));
  if (ex.consigne) bloc.append(el("div.exo__consigne", {}, ex.consigne));
  if (ex.extrait) bloc.append(el("div.extrait", {}, ex.extrait));
  if (ex.apercu) bloc.append(apercuTableau(ex.apercu));

  bloc.append(TYPES_EXERCICE[ex.type].rendre(ex, api));

  /* — Indices progressifs, à la demande — */
  const listeIndices = Indices.pour(ex);
  if (listeIndices.length && s.etat === "question") {
    const panneau = el("div.indices");
    const bouton = el("button.btn.btn--nu.indices__btn", {});
    const majBouton = () => {
      const restants = listeIndices.length - s.indices;
      const suivant = listeIndices[s.indices];
      bouton.disabled = restants === 0;
      bouton.textContent = restants === 0 ? "Tous les indices sont affichés"
        : suivant.revele ? "Afficher la solution"
        : s.indices === 0 ? "Besoin d'un indice ?" : "Indice suivant";
      bouton.classList.toggle("indices__btn--solution", !!suivant?.revele && restants > 0);
    };
    bouton.addEventListener("click", () => {
      Session.indiceSuivant().slice(-1).forEach(ind => {
        panneau.insertBefore(el("div.indice" + (ind.revele ? ".indice--solution" : ""), {},
          el("b", {}, ind.titre),
          el("span", { class: ind.revele || /^=/.test(ind.texte) ? "mono" : "" }, ind.texte)), bouton);
      });
      majBouton();
    });
    majBouton();
    panneau.append(bouton);
    bloc.append(panneau);
  }

  if (s.etat === "retour") {
    rappels.forEach(fn => fn(s.dernier));
    const r = s.dernier;
    const carte = carteRetour({
      reussi: r.reussi, titre: r.reussi ? "Correct" : "Pas tout à fait", xp: r.xp,
      message: r.message, explication: ex.explication,
      notes: r.reussi && r.indices > 0
        ? [r.xp === 0 ? "Solution consultée : pas d'expérience gagnée, mais la question reviendra."
                      : `${r.indices} indice(s) utilisé(s) : expérience réduite.`]
        : [],
      progres: ligneProgres(ex, r),
      usage: ex.usage ? { etiquette: "À quoi ça sert", texte: ex.usage } : null
    });
    bloc.append(carte);
    if (!r.reussi) bloc.append(zoneEssai(ex));
    const suite = el("button.btn.btn--fort.btn--large", { onclick: () => { Session.suivant(); rafraichir(); window.scrollTo(0, 0); } },
      s.index < s.liste.length - 1 ? "Continuer" : "Voir le bilan");
    focaliserSuite(suite, carte);
    bloc.append(el("div", { style: "margin-top:18px" }, suite));
  }
  return bloc;
}

function ecranBilan(rafraichir) {
  const s = Session.courante;
  const total = s.liste.length;
  const bloc = el("div");
  const parfait = s.reussites === total;

  bloc.append(el("div.bilan-hero", {},
    el("div.entete__sur", {}, "Bilan"),
    el("h1", {}, parfait ? "Sans faute" : `${s.reussites} bonnes réponses sur ${total}`),
    el("p", {}, parfait
      ? "Série terminée sans erreur. Vous pouvez viser une compétence plus exigeante."
      : "Les questions ratées reviendront en priorité dans vos prochaines séries."),
    el("div.bilan-hero__chiffres", {},
      el("div.bilan-hero__chiffre", {}, el("b", {}, `+${s.xp}`), el("span", {}, "XP gagnés")),
      el("div.bilan-hero__chiffre", {}, el("b", {}, `${s.reussites} / ${total}`), el("span", {}, "réussies")),
      s.aides ? el("div.bilan-hero__chiffre", {}, el("b", {}, `${s.aides}`), el("span", {}, "avec indice")) : null)
  ));

  const competencesVues = [...new Set(s.liste.map(e => e.competence))];
  bloc.append(el("div.carte", {},
    el("div.bilan__ligne", {}, el("span", {}, "Expérience gagnée"), el("span.mono", {}, `+${s.xp} XP`)),
    el("div.bilan__ligne", {}, el("span", {}, "Niveau"), el("span.mono", {}, `${Progression.niveau().niveau} — ${Progression.niveau().titre}`)),
    s.aides ? el("div.bilan__ligne", {}, el("span", {}, "Questions aidées"), el("span.mono", {}, `${s.aides} sur ${total}`)) : null,
    ...competencesVues.map(id => {
      const c = CONTENU.competences.find(x => x.id === id);
      const m = Progression.maitrise(id);
      const av = Affichage.avant.get(s)?.get(id);
      const gain = av !== undefined ? Math.round(m.effective) - av : 0;
      return el("div.bilan__ligne", {}, el("span", {}, c.nom),
        el("span", { style: "display:flex;align-items:center;gap:12px" },
          gain > 0 ? el("span.bilan__delta", {}, `+${gain} pts`) : null,
          el("span", { style: "width:120px" }, cellules(m.effective, 10, true, { depuis: av, ok: m.effective >= 100 }))));
    })
  ));

  if (s.certifs.length) {
    bloc.append(el("div.section", {},
      el("div.section__titre", {}, el("h2", {}, "Nouvelles certifications")),
      el("div.certifs", {}, s.certifs.map(c =>
        el("div.certif", { "data-obtenue": "1" },
          el("div.certif__ico", {}, c.ico), el("b", {}, c.nom), el("span", {}, c.desc))))
    ));
  }

  /* — Résumé : ce que la série a fait travailler — */
  const vues = s.liste.slice(0, s.index + 1);
  const fonctions = [...new Set(vues.flatMap(fonctionsDe))];
  if (fonctions.length) {
    bloc.append(el("div.section", {},
      el("div.section__titre", {}, el("h2", {}, "Fonctions rencontrées")),
      el("div.carte", {}, fonctions.map(nom =>
        el("div.resume__ligne", {},
          el("span.mono", { style: "min-width:230px;color:var(--accent-fort)" }, FONCTIONS[nom].signature),
          el("span.tres-muet", { style: "flex:1" }, FONCTIONS[nom].aide),
          Fiche.disponible(nom)
            ? el("button.btn.btn--nu", { style: "padding:4px 10px;font-size:12.5px",
                onclick: () => Fiche.ouvrir(nom) }, "S'entraîner")
            : null)))
    ));
  }

  const aRetenir = [...new Set(vues.map(e => e.retenir).filter(Boolean))];
  if (aRetenir.length) {
    bloc.append(el("div.section", {},
      el("div.section__titre", {}, el("h2", {}, "À retenir")),
      el("div.carte", {}, aRetenir.map(t =>
        el("div.resume__point", {}, el("span.resume__puce", {}, "→"), el("span", {}, t))))
    ));
  }

  bloc.append(el("div", { style: "margin-top:20px;display:flex;gap:8px;flex-wrap:wrap" },
    el("button.btn.btn--fort", { onclick: () => { Session.demarrer(s.competence, 5); rafraichir(); } }, "Nouvelle série"),
    el("button.btn", { onclick: () => { Session.quitter(); rafraichir(); } }, "Choisir une compétence"),
    el("button.btn.btn--nu", { onclick: () => { Session.quitter(); location.hash = "#/accueil"; } }, "Retour à l'accueil")
  ));
  return bloc;
}

Vues.fiche = () => {
  const v = el("div", {});
  const etat = Fiche.courante;
  if (!etat || !FICHES[etat.nom]) {
    return el("div.vide", {}, el("div.vide__boite", {},
      el("h3", {}, "Aucune fonction sélectionnée"),
      el("p", {}, "Ouvrez le lexique et choisissez une fonction pour vous entraîner dessus."),
      el("button.btn.btn--plein", { style: "margin-top:14px", onclick: () => Lexique.ouvrir() }, "Ouvrir le lexique")));
  }
  const f = FICHES[etat.nom], def = FONCTIONS[etat.nom];
  const total = Fiche.nbEtapes();

  v.append(el("div.section__titre", { style: "margin-bottom:14px" },
    el("h1.mono", { style: "font-size:22px;color:var(--accent-fort)" }, etat.nom),
    el("button.btn.btn--nu", { onclick: () => Lexique.ouvrir() }, "Autre fonction")));

  v.append(el("div.fiche__etapes", {}, Array.from({ length: total }, (_, i) =>
    el("div.fiche__jalon" + (i <= etat.etape ? ".fiche__jalon--actif" : ""), {}))));

  const bloc = (label, contenu) => el("div.fiche__bloc", {},
    el("div.fiche__label", {}, label), contenu);

  /* — Présentation — */
  if (etat.etape === 0) {
    v.append(el("div.carte", {},
      bloc("À quoi ça sert", el("p.fiche__texte", {}, f.but)),
      bloc("Quand on y pense", el("p.fiche__texte", {}, f.contexte)),
      bloc("Comment ça s'écrit", el("div.fiche__syntaxe", {}, def ? def.signature : etat.nom)),
      bloc("Erreur fréquente", el("p.fiche__texte", {}, f.erreur)),
      f.voirAussi && f.voirAussi.length
        ? bloc("Voir aussi", el("div", { style: "display:flex;gap:8px;flex-wrap:wrap" },
            f.voirAussi.map(n => el("button.btn.btn--nu.mono", { style: "font-size:12.5px;padding:5px 10px",
              onclick: () => Fiche.disponible(n) ? Fiche.ouvrir(n) : Toast.afficher("Fiche détaillée pas encore disponible pour " + n + ".") },
              n + (Fiche.disponible(n) ? "" : " ·")))))
        : null
    ));
    v.append(el("div", { style: "margin-top:18px;display:flex;gap:10px" },
      el("button.btn.btn--plein", { onclick: () => Fiche.avancer(1) },
        f.entrainements.length ? "S'entraîner" : "Terminer")));
    return v;
  }

  /* — Fin — */
  if (etat.etape === total - 1) {
    v.append(el("div.carte", {},
      el("h2", { style: "margin-bottom:8px" }, "C'est tout pour cette fonction"),
      el("p.muet", { style: "font-size:14px;line-height:1.6" },
        "Rien n'a été noté ni comptabilisé : cet espace sert uniquement à vous exercer. Revenez-y autant de fois que nécessaire."),
      el("div", { style: "margin-top:16px;display:flex;gap:10px;flex-wrap:wrap" },
        el("button.btn", { onclick: () => { Fiche.courante.etape = 0; Fiche.courante.saisies = []; Fiche.courante.retours = []; Fiche.courante.reveles = []; Routeur.rendre(); } }, "Revoir la fiche"),
        el("button.btn.btn--plein", { onclick: () => Lexique.ouvrir() }, "Une autre fonction"))
    ));
    return v;
  }

  /* — Entraînement — */
  const i = etat.etape - 1, ent = f.entrainements[i], retour = etat.retours[i], revele = etat.reveles[i];
  const champ = el("input.saisie.mono", { type: "text", value: etat.saisies[i] || "", spellcheck: "false",
    placeholder: "=…", "aria-label": "Votre formule" });
  champ.addEventListener("keydown", ev => { if (ev.key === "Enter") { Affichage.retourFrais = true; Fiche.verifier(i, champ.value); } });

  v.append(el("div.carte", {},
    el("div.fiche__label", {}, `Entraînement ${i + 1} sur ${f.entrainements.length}`),
    el("p.fiche__texte", { style: "margin-bottom:14px" }, ent.enonce),
    champ,
    el("div", { style: "margin-top:12px;display:flex;gap:8px;flex-wrap:wrap" },
      el("button.btn.btn--plein", { onclick: () => { Affichage.retourFrais = true; Fiche.verifier(i, champ.value); } }, "Vérifier"),
      revele ? null : el("button.btn.btn--nu", { onclick: () => Fiche.reveler(i) }, "Voir la solution")),
    retour ? carteRetour({
      reussi: retour.reussi, titre: retour.reussi ? "C'est exactement ça" : "Pas encore",
      message: retour.reussi ? null : (retour.message || "Vérifiez la syntaxe et les séparateurs."),
      explication: retour.reussi ? ent.explication : null, style: "margin-top:14px"
    }) : null,
    (revele || (retour && retour.reussi))
      ? el("div.fiche__bloc", { style: "margin-top:16px" },
          el("div.fiche__label", {}, "Solution"),
          el("div.fiche__syntaxe", {}, ent.solutions[0]),
          retour && retour.reussi ? null : el("p.fiche__texte", { style: "margin-top:10px" }, ent.explication))
      : null
  ));

  v.append(el("div", { style: "margin-top:18px;display:flex;gap:10px" },
    el("button.btn", { onclick: () => Fiche.avancer(-1) }, "Précédent"),
    el("button.btn.btn--plein", { onclick: () => Fiche.avancer(1) },
      i + 1 < f.entrainements.length ? "Suivant" : "Terminer")));
  return v;
};

/* ══ 8. ROUTEUR ═════════════════════════════════════════════ */
const Routeur = (() => {
  const routes = [];
  function enregistrer(r) { routes.push(r); }

  function courante() {
    const chemin = location.hash.replace("#", "") || "/accueil";
    return routes.find(r => r.chemin === chemin) || routes[0];
  }

  function rendre() {
    const route = courante();
    document.title = `${route.titre} — Classe'R`;
    const zone = document.getElementById("zone-contenu");
    if (!zone) return;
    zone.replaceChildren(Vues[route.vue]());
    document.querySelectorAll(".rail__lien").forEach(a => {
      if (a.getAttribute("href") === "#" + route.chemin) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    zone.scrollTo?.(0, 0); window.scrollTo(0, 0);
  }

  function construireRail() {
    const nav = el("nav.rail__nav", { "aria-label": "Navigation principale" },
      routes.filter(r => r.nav).map(r =>
        el("a.rail__lien", { href: "#" + r.chemin }, icone(r.icone), el("span", {}, r.court || r.titre))
      )
    );
    nav.append(el("div.rail__sep"), Lexique.bouton());
    return el("aside.rail", {},
      el("div.rail__marque", {}, el("div.logo", {}, "R"), el("div.rail__nom", {}, "Classe'R")),
      nav,
      el("div.rail__bas", {}, el("div.tres-muet", { style: "font-size:11.5px" },
        "Apprendre Excel en pratiquant"))
    );
  }

  function aller(chemin) {
    if (location.hash.replace("#", "") === chemin) rendre();
    else location.hash = chemin;
  }

  return { enregistrer, rendre, construireRail, aller };
})();

function appliquerTheme() {
  document.documentElement.dataset.theme = Store.etat.reglages.theme || "clair";
  document.querySelector('meta[name="theme-color"]')
    ?.setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--fond").trim());
}

function onboarding() {
  const donnees = { prenom: "", niveau: "debutant" };
  const niveaux = [
    ["debutant", "Je débute", "Je connais à peine les formules."],
    ["intermediaire", "Je me débrouille", "SOMME, SI et les tris ne me font pas peur."],
    ["avance", "Je suis à l'aise", "Je veux surtout gagner en méthode et en vitesse."]
  ];
  const boiteOptions = el("div.options", {});
  niveaux.forEach(([val, titre, desc]) => {
    const o = el("label.option", { "data-choisi": val === donnees.niveau ? "1" : "0" },
      el("input", { type: "radio", name: "niveau", value: val, checked: val === donnees.niveau ? "" : null,
        onchange: () => {
          donnees.niveau = val;
          boiteOptions.querySelectorAll(".option").forEach(x => x.dataset.choisi = "0");
          o.dataset.choisi = "1";
        } }),
      el("div", {}, el("b", {}, titre), el("span", {}, desc))
    );
    boiteOptions.append(o);
  });

  const champ = el("label.champ", {},
    el("span.champ__lib", {}, "Votre prénom (facultatif)"),
    el("input", { type: "text", placeholder: "Ex. Camille", oninput: ev => donnees.prenom = ev.target.value })
  );

  Modale.ouvrir({
    titre: "Bienvenue dans Classe'R",
    description: "Deux questions pour caler le point de départ. Rien n'est définitif : la progression s'ajuste à vos résultats.",
    contenu: el("div", {}, champ, el("div.champ", {}, el("span.champ__lib", {}, "Où en êtes-vous avec Excel ?"), boiteOptions)),
    fermable: false,
    actions: [{ libelle: "Commencer", fort: true, action: () => {
      const depart = { debutant: 0, intermediaire: 25, avance: 45 }[donnees.niveau];
      Store.modifier(e => {
        e.profil.prenom = donnees.prenom.trim();
        e.profil.niveauDeclare = donnees.niveau;
        e.profil.onboardingFait = true;
        Object.values(e.competences).forEach(c => { c.maitrise = depart; });
      });
      Routeur.rendre();
      Toast.afficher("C'est parti. Vos premières séries arrivent bientôt.", "accent");
    } }]
  });
}

function demarrer() {
  Store.charger();
  Packs.normaliser();
  appliquerTheme();
  Progression.majSerie();

  document.getElementById("app").replaceChildren(
    // Le routeur lit location.hash : le lien d'évitement donne le focus sans y toucher.
    el("a.saut", { href: "#", onclick: ev => { ev.preventDefault(); document.getElementById("zone-contenu").focus(); } },
      "Aller au contenu"),
    Routeur.construireRail(),
    el("main.principal", {}, el("div.contenu", { id: "zone-contenu", tabindex: "-1" }))
  );

  window.addEventListener("hashchange", Routeur.rendre);
  document.addEventListener("keydown", ev => { if (ev.key === "Escape" && Lexique.estOuvert()) Lexique.fermer(); });
  Bus.sur("etat:change", () => {});   // point d'accroche pour les futurs modules
  Routeur.rendre();

  if (!Store.etat.profil.onboardingFait) onboarding();
}
