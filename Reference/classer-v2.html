              calcul: d => Formatage.versDate(versNombre(d)).getUTCDate() },
  JOURS:    { signature: "JOURS(date_fin; date_début)", aide: "nombre de jours entre deux dates",
              calcul: (fin, debut) => versNombre(fin) - versNombre(debut) },
  RECHERCHEX:{ signature: "RECHERCHEX(valeur; plage_recherche; plage_résultat; [si_absent])",
              aide: "cherche une valeur et renvoie la donnée correspondante",
              calcul: (val, rech, res, siAbsent) => {
                const r = [rech].flat(Infinity), s = [res].flat(Infinity);
                if (r.length !== s.length) throw new ErreurCalcul("#TAILLE!");
                const i = r.findIndex(x => egalValeur(x, val));
                if (i === -1) {
                  if (siAbsent !== undefined) return siAbsent;
                  throw new ErreurCalcul("#N/A");
                }
                return s[i];
              } },
  RECHERCHEV:{ signature: "RECHERCHEV(valeur; tableau; n° colonne)",
              aide: "cherche dans la première colonne et renvoie une colonne située à droite",
              paresseuse: true, min: 3,
              calcul: (evaluer, args, ctx) => {
                const rect = Formules.rectNoeud(args[1], ctx.feuille);
                if (!rect) throw new ErreurCalcul("#REF!");
                const val = evaluer(args[0]);
                const col = versNombre(evaluer(args[2]));
                if (col < 1 || col > rect.c2 - rect.c1 + 1) throw new ErreurCalcul("#REF!");
                for (let l = rect.l1; l <= rect.l2; l++) {
                  if (egalValeur(ctx.lire(Ref.vers(rect.c1, l)), val)) return ctx.lire(Ref.vers(rect.c1 + col - 1, l));
                }
                throw new ErreurCalcul("#N/A");
              } },
  EQUIV:    { signature: "EQUIV(valeur; plage; [type])", aide: "position d'une valeur dans une plage (0 = correspondance exacte)",
              calcul: (val, plage, type) => {
                const t = [plage].flat(Infinity);
                const mode = type === undefined ? 0 : versNombre(type);
                if (mode === 0) {
                  const i = t.findIndex(x => egalValeur(x, val));
                  if (i === -1) throw new ErreurCalcul("#N/A");
                  return i + 1;
                }
                const croissant = mode > 0;
                for (let i = 1; i < t.length; i++) {
                  if (comparerValeurs(t[i - 1], t[i]) * (croissant ? 1 : -1) > 0) throw new ErreurCalcul("#TRI!");
                }
                let pos = -1;
                t.forEach((x, i) => { if (croissant ? comparerValeurs(x, val) <= 0 : comparerValeurs(x, val) >= 0) pos = i; });
                if (pos === -1) throw new ErreurCalcul("#N/A");
                return pos + 1;
              } },
  INDEX:    { signature: "INDEX(plage; n° ligne; [n° colonne])", aide: "renvoie la valeur située à une position dans une plage",
              paresseuse: true, min: 2,
              calcul: (evaluer, args, ctx) => {
                const rect = Formules.rectNoeud(args[0], ctx.feuille);
                if (!rect) throw new ErreurCalcul("#REF!");
                const nbL = rect.l2 - rect.l1 + 1, nbC = rect.c2 - rect.c1 + 1;
                let li = versNombre(evaluer(args[1]));
                let co = args[2] !== undefined ? versNombre(evaluer(args[2])) : null;
                if (co === null) {
                  if (nbL === 1) { co = li; li = 1; }
                  else if (nbC === 1) { co = 1; }
                  else throw new ErreurCalcul("#ARGS!");
                }
                if (li < 1 || li > nbL || co < 1 || co > nbC) throw new ErreurCalcul("#REF!");
                return ctx.lire(Ref.vers(rect.c1 + co - 1, rect.l1 + li - 1));
              } },
  FILTRE:   { signature: "FILTRE(plage; condition; [si_vide])", aide: "ne conserve que les lignes qui remplissent la condition",
              matricielle: true,
              calcul: (plage, condition, siVide) => {
                const f = formeDe(plage), c = [condition].flat(Infinity);
                if (c.length !== f.nbLigne) throw new ErreurCalcul("#TAILLE!");
                const out = [];
                for (let l = 0; l < f.nbLigne; l++) {
                  let garde = false;
                  try { garde = versBool(c[l]); } catch (_) { garde = false; }
                  if (garde) for (let k = 0; k < f.nbCol; k++) out.push(plage[l * f.nbCol + k]);
                }
                if (!out.length) {
                  if (siVide !== undefined) return siVide;
                  throw new ErreurCalcul("#VIDE!");
                }
                return matrice(out, out.length / f.nbCol, f.nbCol);
              } },
  TRIER:    { signature: "TRIER(plage; [n° colonne]; [ordre])", aide: "trie les lignes d'une plage (1 croissant, -1 décroissant)",
              matricielle: true,
              calcul: (plage, colonne, ordre) => {
                const f = formeDe(plage);
                const col = colonne === undefined ? 1 : versNombre(colonne);
                const sens = ordre === undefined ? 1 : (versNombre(ordre) < 0 ? -1 : 1);
                if (col < 1 || col > f.nbCol) throw new ErreurCalcul("#REF!");
                const lignes = [];
                for (let l = 0; l < f.nbLigne; l++) lignes.push(plage.slice(l * f.nbCol, (l + 1) * f.nbCol));
                lignes.sort((a, b) => comparerValeurs(a[col - 1], b[col - 1]) * sens);
                return matrice(lignes.flat(), f.nbLigne, f.nbCol);
              } },
  UNIQUE:   { signature: "UNIQUE(plage)", aide: "ne garde qu'une occurrence de chaque valeur",
              matricielle: true,
              calcul: plage => {
                const f = formeDe(plage), vus = new Set(), out = [];
                for (let l = 0; l < f.nbLigne; l++) {
                  const ligne = plage.slice(l * f.nbCol, (l + 1) * f.nbCol);
                  const cle = ligne.map(v => versTexte(v).toLowerCase()).join("\u0000");
                  if (vus.has(cle)) continue;
                  vus.add(cle); out.push(...ligne);
                }
                return matrice(out, out.length / f.nbCol, f.nbCol);
              } },
  LET:      { signature: "LET(nom; valeur; …; calcul)", aide: "nomme des résultats intermédiaires pour clarifier une formule",
              paresseuse: true, min: 3, matricielle: true,
              calcul: (evaluer, args, ctx) => {
                if (args.length % 2 === 0) throw new ErreurCalcul("#ARGS!");
                const variables = Object.assign({}, ctx.variables);
                for (let i = 0; i + 1 < args.length - 1; i += 2) {
                  if (!args[i] || args[i].t !== "var") throw new ErreurCalcul("#NOM?");
                  variables[args[i].v.toUpperCase()] = Formules.evaluerNoeud(args[i + 1], { ...ctx, variables });
                }
                return Formules.evaluerNoeud(args[args.length - 1], { ...ctx, variables });
              } },
  ESTVIDE:  { signature: "ESTVIDE(valeur)", aide: "vrai si la cellule est vide", calcul: v => v === null || v === "" },
  ESTNUM:   { signature: "ESTNUM(valeur)", aide: "vrai si c'est un nombre", calcul: v => typeof v === "number" },
  ESTTEXTE: { signature: "ESTTEXTE(valeur)", aide: "vrai si c'est du texte", calcul: v => typeof v === "string" }
};

const Formules = {
  pret: true,

  /* — Analyse lexicale — */
  /** Guillemets courbes, apostrophes typographiques, point-virgule grec, espaces insécables :
   *  autant de substitutions faites par les claviers et les traitements de texte.
   *  On les ramène à leur équivalent standard plutôt que de refuser la formule. */
  assainir(source) {
    return String(source)
      .replace(/[\u201C\u201D\u201E\u00AB\u00BB]/g, '"')
      .replace(/[\u2018\u201A]/g, "'")
      .replace(/\u037E/g, ";")
      .replace(/[\u00A0\u202F\u2009]/g, " ")
      .replace(/[\u2212\u2013\u2014]/g, "-");
  },

  lexer(source) {
    source = Formules.assainir(source);
    const jetons = [];
    let i = 0;
    const est = (re, s) => re.test(s);
    while (i < source.length) {
      const ch = source[i];
      if (/\s/.test(ch)) { i++; continue; }
      if (ch === '"' || ch === "'") {          // l'apostrophe est tolérée : beaucoup l'emploient par habitude
        const clot = ch;
        let j = i + 1, txt = "";
        while (j < source.length && source[j] !== clot) { txt += source[j]; j++; }
        if (j >= source.length) throw new ErreurCalcul("#GUILLEMET!");
        jetons.push({ t: "txt", v: txt }); i = j + 1; continue;
      }
      if (/[0-9]/.test(ch) || (ch === "." && /[0-9]/.test(source[i + 1] || ""))) {
        let j = i;
        while (j < source.length && /[0-9.,]/.test(source[j])) {
          if ((source[j] === "," || source[j] === ".") && !/[0-9]/.test(source[j + 1] || "")) break;
          j++;
        }
        jetons.push({ t: "nb", v: parseFloat(source.slice(i, j).replace(",", ".")) }); i = j; continue;
      }
      if (/[A-Za-z_$\u00C0-\u024F]/.test(ch)) {
        let j = i;
        while (j < source.length && /[A-Za-z0-9_.$\u00C0-\u024F]/.test(source[j])) j++;
        const mot = source.slice(i, j);
        i = j;
        while (i < source.length && /\s/.test(source[i])) i++;
        if (source[i] === "(") { jetons.push({ t: "fn", v: mot.toUpperCase() }); continue; }
        if (/^vrai$/i.test(mot)) { jetons.push({ t: "bool", v: true }); continue; }
        if (/^faux$/i.test(mot)) { jetons.push({ t: "bool", v: false }); continue; }
        if (est(/^\$?[A-Za-z]{1,3}\$?\d+$/, mot)) { jetons.push({ t: "ref", v: mot }); continue; }
        // Colonne entière : reconnue avant le deux-points (D:) comme après (:D)
        if (/^\$?[A-Za-z]{1,3}$/.test(mot) && (source[i] === ":" || jetons[jetons.length - 1]?.t === ":")) {
          jetons.push({ t: "col", v: mot }); continue;
        }
        jetons.push({ t: "nom", v: mot });   // variable nommée (LET) — sinon #NOM? à l'évaluation
        continue;
      }
      const deux = source.slice(i, i + 2);
      if (["<=", ">=", "<>"].includes(deux)) { jetons.push({ t: "op", v: deux }); i += 2; continue; }
      if ("+-*/^&=<>".includes(ch)) { jetons.push({ t: "op", v: ch }); i++; continue; }
      if (ch === "%") { jetons.push({ t: "pct" }); i++; continue; }
      if (ch === "(") { jetons.push({ t: "(" }); i++; continue; }
      if (ch === ")") { jetons.push({ t: ")" }); i++; continue; }
      if (ch === ":") { jetons.push({ t: ":" }); i++; continue; }
      if (ch === ";" || ch === ",") { jetons.push({ t: ";" }); i++; continue; }
      throw new ErreurCalcul("#SYNTAXE!");
    }
    return jetons;
  },

  /* — Analyse syntaxique (descente récursive) — */
  parser(jetons) {
    let p = 0;
    const voir = () => jetons[p];
    const avaler = t => { if (jetons[p]?.t !== t) throw new ErreurCalcul("#SYNTAXE!"); return jetons[p++]; };

    function comparaison() {
      let g = concat();
      while (voir()?.t === "op" && ["=", "<>", "<", ">", "<=", ">="].includes(voir().v)) {
        const op = jetons[p++].v; g = { t: "bin", op, g, d: concat() };
      }
      return g;
    }
    function concat() {
      let g = additif();
      while (voir()?.t === "op" && voir().v === "&") { p++; g = { t: "bin", op: "&", g, d: additif() }; }
      return g;
    }
    function additif() {
      let g = multiplicatif();
      while (voir()?.t === "op" && ["+", "-"].includes(voir().v)) {
        const op = jetons[p++].v; g = { t: "bin", op, g, d: multiplicatif() };
      }
      return g;
    }
    function multiplicatif() {
      let g = puissance();
      while (voir()?.t === "op" && ["*", "/"].includes(voir().v)) {
        const op = jetons[p++].v; g = { t: "bin", op, g, d: puissance() };
      }
      return g;
    }
    function puissance() {
      let g = unaire();
      while (voir()?.t === "op" && voir().v === "^") { p++; g = { t: "bin", op: "^", g, d: unaire() }; }
      return g;
    }
    function unaire() {
      if (voir()?.t === "op" && ["-", "+"].includes(voir().v)) {
        const op = jetons[p++].v; return { t: "un", op, e: unaire() };
      }
      return postfixe();
    }
    function postfixe() {
      let e = primaire();
      while (voir()?.t === "pct") { p++; e = { t: "pct", e }; }
      return e;
    }
    function primaire() {
      const j = voir();
      if (!j) throw new ErreurCalcul("#SYNTAXE!");
      if (j.t === "nb") {
        p++;
        if (voir()?.t === ":" && jetons[p + 1]?.t === "nb") {   // plage de lignes : 2:5
          p++; const fin = jetons[p++];
          return { t: "plageLigne", a: j.v, b: fin.v };
        }
        return { t: "nb", v: j.v };
      }
      if (j.t === "nom") { p++; return { t: "var", v: j.v }; }
      if (j.t === "col") {                                      // plage de colonnes : D:D
        p++;
        if (voir()?.t !== ":") throw new ErreurCalcul("#NOM?");
        p++; const fin = avaler("col");
        return { t: "plageCol", a: j.v, b: fin.v };
      }
      if (j.t === "txt")  { p++; return { t: "txt", v: j.v }; }
      if (j.t === "bool") { p++; return { t: "bool", v: j.v }; }
      if (j.t === "ref") {
        p++;
        if (voir()?.t === ":") { p++; const fin = avaler("ref"); return { t: "plage", a: j.v, b: fin.v }; }
        return { t: "ref", v: j.v };
      }
      if (j.t === "fn") {
        p++; avaler("(");
        const args = [];
        if (voir()?.t !== ")") {
          args.push(comparaison());
          while (voir()?.t === ";") { p++; args.push(comparaison()); }
        }
        avaler(")");
        return { t: "fn", nom: j.v, args };
      }
      if (j.t === "(") { p++; const e = comparaison(); avaler(")"); return e; }
      throw new ErreurCalcul("#SYNTAXE!");
    }

    const arbre = comparaison();
    if (p < jetons.length) throw new ErreurCalcul("#SYNTAXE!");
    return arbre;
  },

  /** Analyse avec cache : une même formule n'est analysée qu'une fois. */
  cache: new Map(),
  arbre(source) {
    if (Formules.cache.has(source)) {
      const c = Formules.cache.get(source);
      if (c.erreur) throw new ErreurCalcul(c.erreur);
      return c.arbre;
    }
    try {
      const arbre = Formules.parser(Formules.lexer(source));
      Formules.cache.set(source, { arbre });
      return arbre;
    } catch (err) {
      const code = err instanceof ErreurCalcul ? err.code : "#SYNTAXE!";
      Formules.cache.set(source, { erreur: code });
      throw new ErreurCalcul(code);
    }
  },

  /** Rectangle couvert par un nœud de plage : { c1, c2, l1, l2 } ou null. */
  rectNoeud(n, f) {
    if (!n || typeof n !== "object") return null;
    if (n.t === "ref") {
      const p = Ref.depuis(n.v.replace(/\$/g, ""));
      return p ? { c1: p.col, c2: p.col, l1: p.ligne, l2: p.ligne } : null;
    }
    if (n.t === "plage") return Ref.plage(`${n.a}:${n.b}`.replace(/\$/g, ""));
    if (n.t === "plageCol") {
      const c1 = Ref.colonne(n.a.replace(/\$/g, "")), c2 = Ref.colonne(n.b.replace(/\$/g, ""));
      return { c1: Math.min(c1, c2), c2: Math.max(c1, c2), l1: 0, l2: f.nbLigne - 1 };
    }
    if (n.t === "plageLigne") return { c1: 0, c2: f.nbCol - 1, l1: Math.min(n.a, n.b) - 1, l2: Math.max(n.a, n.b) - 1 };
    return null;
  },

  /** Références couvertes par un nœud de plage, sans lire les valeurs. */
  refsNoeud(n, f) {
    if (!n || typeof n !== "object") return [];
    if (n.t === "ref") return [n.v.replace(/\$/g, "").toUpperCase()];
    if (n.t === "plage") {
      const p = Ref.plage(`${n.a}:${n.b}`.replace(/\$/g, ""));
      return p ? Ref.listePlage(p) : [];
    }
    if (n.t === "plageCol") {
      const c1 = Ref.colonne(n.a.replace(/\$/g, "")), c2 = Ref.colonne(n.b.replace(/\$/g, ""));
      return Ref.listePlage({ c1: Math.min(c1, c2), c2: Math.max(c1, c2), l1: 0, l2: f.nbLigne - 1 });
    }
    if (n.t === "plageLigne") {
      return Ref.listePlage({ c1: 0, c2: f.nbCol - 1, l1: Math.min(n.a, n.b) - 1, l2: Math.max(n.a, n.b) - 1 });
    }
    return [];
  },

  /** Opération scalaire — extraite pour être réutilisée élément par élément. */
  operation(op, g, d) {
    if (op === "&") return versTexte(g) + versTexte(d);
    if (["=", "<>", "<", ">", "<=", ">="].includes(op)) {
      const texte = typeof g === "string" || typeof d === "string";
      const a = texte ? versTexte(g).toLowerCase() : versNombre(g);
      const b = texte ? versTexte(d).toLowerCase() : versNombre(d);
      return { "=": a === b, "<>": a !== b, "<": a < b, ">": a > b, "<=": a <= b, ">=": a >= b }[op];
    }
    const a = versNombre(g), b = versNombre(d);
    if (op === "/" && b === 0) throw new ErreurCalcul("#DIV/0!");
    return { "+": a + b, "-": a - b, "*": a * b, "/": a / b, "^": a ** b }[op];
  },

  lirePlage(p, ctx) {
    const valeurs = Ref.listePlage(p).map(r => {
      if (ctx.feuille.cellules[r]?.erreur) throw new ErreurCalcul(ctx.feuille.cellules[r].erreur);
      return ctx.lire(r);
    });
    return matrice(valeurs, p.l2 - p.l1 + 1, p.c2 - p.c1 + 1);
  },

  /** Références citées par une formule (pour l'ordre de calcul). */
  dependances(source, f) {
    const refs = new Set();
    const ajouter = p => Ref.listePlage(p).forEach(r => refs.add(r));
    const parcourir = n => {
      if (!n || typeof n !== "object") return;
      if (n.t === "ref") refs.add(n.v.replace(/\$/g, "").toUpperCase());
      else if (n.t === "plage") {
        const p = Ref.plage(`${n.a}:${n.b}`.replace(/\$/g, ""));
        if (p) ajouter(p);
      }
      else if (n.t === "plageCol" && f) {
        const c1 = Ref.colonne(n.a.replace(/\$/g, "")), c2 = Ref.colonne(n.b.replace(/\$/g, ""));
        ajouter({ c1: Math.min(c1, c2), c2: Math.max(c1, c2), l1: 0, l2: f.nbLigne - 1 });
      }
      else if (n.t === "plageLigne" && f) {
        ajouter({ c1: 0, c2: f.nbCol - 1, l1: Math.min(n.a, n.b) - 1, l2: Math.max(n.a, n.b) - 1 });
      }
      ["g", "d", "e"].forEach(k => parcourir(n[k]));
      (n.args || []).forEach(parcourir);
    };
    try { parcourir(Formules.arbre(source)); } catch (_) {}
    return [...refs];
  },

  /* — Évaluation — */
  evaluer(source, ctx) {
    try {
      // Un tableau de valeurs remonte tel quel : c'est le recalcul qui décide de le déployer.
      return { valeur: Formules.evaluerNoeud(Formules.arbre(source), ctx) };
    } catch (err) {
      return { erreur: err instanceof ErreurCalcul ? err.code : "#ERREUR!" };
    }
  },

  evaluerNoeud(n, ctx) {
    const ev = x => Formules.evaluerNoeud(x, ctx);
    switch (n.t) {
      case "nb": case "txt": case "bool": return n.v;
      case "ref": {
        const ref = n.v.replace(/\$/g, "").toUpperCase();
        const p = Ref.depuis(ref);
        if (!p || p.col >= ctx.feuille.nbCol || p.ligne >= ctx.feuille.nbLigne) throw new ErreurCalcul("#REF!");
        const c = ctx.feuille.cellules[ref];
        if (c?.erreur) throw new ErreurCalcul(c.erreur);
        return ctx.lire(ref);
      }
      case "plage": {
        const p = Ref.plage(`${n.a}:${n.b}`.replace(/\$/g, ""));
        if (!p) throw new ErreurCalcul("#REF!");
        return Formules.lirePlage(p, ctx);
      }
      case "plageCol": {                       // D:D — toute la hauteur de la feuille
        const c1 = Ref.colonne(n.a.replace(/\$/g, "")), c2 = Ref.colonne(n.b.replace(/\$/g, ""));
        if (Math.max(c1, c2) >= ctx.feuille.nbCol) throw new ErreurCalcul("#REF!");
        return Formules.lirePlage({ c1: Math.min(c1, c2), c2: Math.max(c1, c2), l1: 0, l2: ctx.feuille.nbLigne - 1 }, ctx);
      }
      case "plageLigne": {                     // 2:5 — toute la largeur de la feuille
        const l1 = Math.min(n.a, n.b) - 1, l2 = Math.max(n.a, n.b) - 1;
        if (l1 < 0 || l2 >= ctx.feuille.nbLigne) throw new ErreurCalcul("#REF!");
        return Formules.lirePlage({ c1: 0, c2: ctx.feuille.nbCol - 1, l1, l2 }, ctx);
      }
      case "un": {
        const v = versNombre(ev(n.e));
        return n.op === "-" ? -v : v;
      }
      case "pct": return versNombre(ev(n.e)) / 100;
      case "bin": {
        const g = ev(n.g), d = ev(n.d);
        if (Array.isArray(g) || Array.isArray(d)) {          // calcul élément par élément
          const forme = formeDe(Array.isArray(g) ? g : d);
          const taille = Array.isArray(g) ? g.length : d.length;
          if (Array.isArray(g) && Array.isArray(d) && g.length !== d.length) throw new ErreurCalcul("#TAILLE!");
          const out = [];
          for (let i = 0; i < taille; i++) {
            out.push(Formules.operation(n.op, Array.isArray(g) ? g[i] : g, Array.isArray(d) ? d[i] : d));
          }
          return matrice(out, forme.nbLigne, forme.nbCol);
        }
        return Formules.operation(n.op, g, d);
      }
      case "var": {
        const nom = n.v.toUpperCase();
        if (!ctx.variables || !(nom in ctx.variables)) throw new ErreurCalcul("#NOM?");
        return ctx.variables[nom];
      }
      case "fn": {
        const def = FONCTIONS[n.nom];
        if (!def) throw new ErreurCalcul("#NOM?");
        if (def.paresseuse) {
          if (n.args.length < (def.min || 1)) throw new ErreurCalcul("#ARGS!");
          return def.calcul(ev, n.args, ctx);
        }
        return def.calcul(...n.args.map(ev));
      }
      default: throw new ErreurCalcul("#SYNTAXE!");
    }
  },

  /** Décale les références relatives d'une formule (recopie). */
  decaler(saisie, dc, dl) {
    if (!saisie.startsWith("=")) return saisie;
    let corps = saisie.slice(1);
    // Plages de colonnes entières : D:D
    corps = corps.replace(/(\$?)([A-Za-z]{1,3}):(\$?)([A-Za-z]{1,3})(?![A-Za-z0-9(])/g,
      (tout, d1, a, d2, b) => {
        const ca = d1 ? Ref.colonne(a) : Ref.colonne(a) + dc;
        const cb = d2 ? Ref.colonne(b) : Ref.colonne(b) + dc;
        if (ca < 0 || cb < 0) return "#REF!";
        return d1 + Ref.lettre(ca) + ":" + d2 + Ref.lettre(cb);
      });
    // Plages de lignes entières : 2:5
    corps = corps.replace(/(?<![A-Za-z0-9$.,])(\$?)(\d+):(\$?)(\d+)(?![A-Za-z0-9.,])/g,
      (tout, d1, a, d2, b) => {
        const la = d1 ? +a : +a + dl;
        const lb = d2 ? +b : +b + dl;
        if (la < 1 || lb < 1) return "#REF!";
        return d1 + la + ":" + d2 + lb;
      });
    // Références de cellules : A1, $B$2
    corps = corps.replace(/(\$?)([A-Za-z]{1,3})(\$?)(\d+)/g, (tout, dCol, lettres, dLigne, num) => {
      const col = dCol ? Ref.colonne(lettres) : Ref.colonne(lettres) + dc;
      const ligne = dLigne ? parseInt(num, 10) - 1 : parseInt(num, 10) - 1 + dl;
      if (col < 0 || ligne < 0) return "#REF!";
      return dCol + Ref.lettre(col) + dLigne + (ligne + 1);
    });
    return "=" + corps;
  },

  /** Vrai si la formule utilise réellement la fonction demandée (analyse de l'arbre, pas du texte). */
  utilise(saisie, nom) {
    const cible = String(nom).toUpperCase();
    let trouve = false;
    const parcourir = n => {
      if (!n || typeof n !== "object" || trouve) return;
      if (n.t === "fn" && n.nom === cible) { trouve = true; return; }
      ["g", "d", "e"].forEach(k => parcourir(n[k]));
      (n.args || []).forEach(parcourir);
    };
    try { parcourir(Formules.arbre(String(saisie).replace(/^\s*=/, ""))); } catch (_) { return false; }
    return trouve;
  },

  messageErreur(code) {
    return {
      "#SYNTAXE!": "La formule est mal écrite : vérifiez les parenthèses et les points-virgules.",
      "#GUILLEMET!": "Un texte n'est pas refermé : chaque guillemet ouvert doit être refermé.",
      "#NOM?": "Cette fonction ou ce nom n'est pas reconnu par Classe'R.",
      "#REF!": "La formule pointe vers une cellule qui n'existe pas.",
      "#VALEUR!": "Un argument n'est pas du bon type (texte au lieu de nombre, par exemple).",
      "#DIV/0!": "Division par zéro.",
      "#CYCLE!": "La formule se référence elle-même, directement ou indirectement.",
      "#PLAGE!": "Une plage entière ne peut pas être utilisée ici. Indiquez une seule cellule, ou passez par une fonction comme SOMME, NB.SI ou SOUS.TOTAL.",
      "#ARGS!": "Il manque un argument à cette fonction.",
      "#TAILLE!": "Les deux plages doivent avoir exactement la même taille.",
      "#PROPAGATION!": "Le résultat ne peut pas se déployer : une cellule voisine est déjà occupée. Libérez la place sous ou à droite de la formule.",
      "#VIDE!": "Aucune ligne ne remplit la condition. Ajoutez un troisième argument pour choisir ce qui s'affiche dans ce cas.",
      "#TRI!": "La recherche approximative exige une plage triée. Ajoutez 0 en troisième argument pour une correspondance exacte.",
      "#N/A": "Aucun des cas prévus ne correspond : ajoutez un cas par défaut avec VRAI en dernier test."
    }[code] || "Erreur de calcul.";
  },

  /** Liste utilisée par les écrans d'aide. */
  catalogue() {
    return Object.entries(FONCTIONS).map(([nom, d]) => ({ nom, signature: d.signature, aide: d.aide }));
  }
};

const Feuille = {
  nouvelle(saisie = "") {
    return { saisie: String(saisie), valeur: null, erreur: null, format: null, verrou: false, titre: false };
  },

  creer(def = {}) {
    const f = {
      nom: def.nom || "Feuille1",
      nbCol: def.colonnes || 8,
      nbLigne: def.lignes || 20,
      largeurs: { ...def.largeurs },        // { A:150 }
      formatsCol: { ...def.formatsCol },    // { B:"monnaie" }
      tableaux: (def.tableaux || []).map(t => ({ ...t })),
      lignesMasquees: new Set(),
      reglesMFC: [],
      tcd: null,
      graphique: null,
      vue: { tri: null, filtres: {} },
      cellules: {}
    };
    Object.entries(def.cellules || {}).forEach(([ref, d]) => {
      const brut = (d !== null && typeof d === "object") ? d : { saisie: d };
      const c = Feuille.nouvelle(brut.saisie ?? "");
      if (brut.format) c.format = brut.format;
      if (brut.verrou) c.verrou = true;
      if (brut.titre) c.titre = true;
      f.cellules[ref] = c;
    });
    Feuille.recalculer(f);
    return f;
  },

  cellule(f, ref, creer = false) {
    if (f.cellules[ref]) return f.cellules[ref];
    return creer ? (f.cellules[ref] = Feuille.nouvelle("")) : null;
  },

  valeur(f, ref) { return f.cellules[ref]?.valeur ?? null; },

  /** Contexte transmis au moteur de formules (stable pour la phase 2b). */
  contexte(f) {
    return {
      lire: ref => Feuille.valeur(f, ref),
      plage: texte => {
        const p = Ref.plage(texte);
        return p ? Ref.listePlage(p).map(r => Feuille.valeur(f, r)) : [];
      },
      feuille: f
    };
  },

  /** Interprète une saisie brute : nombre français, pourcentage, montant, texte ou formule. */
  analyser(f, saisie) {
    const t = String(saisie).trim();
    if (t === "") return { valeur: null, erreur: null };
    if (t.startsWith("=")) {
      const r = Formules.evaluer(t.slice(1), Feuille.contexte(f));
      return { valeur: r.erreur ? null : r.valeur, erreur: r.erreur || null };
    }
    const nettoye = t.replace(/[\s\u00A0\u202F]/g, "").replace(",", ".");
    const pourcent = /^-?[\d.]+%$/.test(nettoye);
    const nombre = nettoye.replace(/[%€]/g, "");
    if (/^-?\d+(\.\d+)?$/.test(nombre)) {
      const v = parseFloat(nombre);
      return { valeur: pourcent ? v / 100 : v, erreur: null, formatAuto: pourcent ? "pourcent" : null };
    }
    const jmA = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(t);
    if (jmA) {
      const j = +jmA[1], m = +jmA[2];
      let a = +jmA[3]; if (a < 100) a += 2000;
      const d = new Date(Date.UTC(a, m - 1, j));
      if (d.getUTCMonth() === m - 1 && d.getUTCDate() === j)
        return { valeur: Formatage.versSerie(a, m, j), erreur: null, formatAuto: "date" };
    }
    if (/^(vrai|faux)$/i.test(t)) return { valeur: /^vrai$/i.test(t), erreur: null };
    return { valeur: t, erreur: null };
  },

  saisir(f, ref, saisie) {
    const c = Feuille.cellule(f, ref, true);
    c.saisie = String(saisie);
    return c;
  },

  /** Déploie le résultat d'une formule matricielle dans les cellules voisines.
   *  @returns {null|string} code d'erreur si la place n'est pas libre */
  propager(f, ref, tableau) {
    const forme = formeDe(tableau);
    const p = Ref.depuis(ref);
    if (p.col + forme.nbCol > f.nbCol || p.ligne + forme.nbLigne > f.nbLigne) return "#REF!";
    for (let l = 0; l < forme.nbLigne; l++) {
      for (let k = 0; k < forme.nbCol; k++) {
        if (!l && !k) continue;
        const cible = f.cellules[Ref.vers(p.col + k, p.ligne + l)];
        if (!cible) continue;
        const sienne = cible.propage && cible.source === ref;
        if (!sienne && String(cible.saisie).trim() !== "") return "#PROPAGATION!";
      }
    }
    const source = f.cellules[ref];
    source.matrice = tableau;
    source.valeur = tableau[0] === undefined ? null : tableau[0];
    for (let l = 0; l < forme.nbLigne; l++) {
      for (let k = 0; k < forme.nbCol; k++) {
        if (!l && !k) continue;
        const v = tableau[l * forme.nbCol + k];
        f.cellules[Ref.vers(p.col + k, p.ligne + l)] = {
          saisie: "", valeur: v === undefined ? null : v, erreur: null,
          format: source.format || null, verrou: false, titre: false, propage: true, source: ref
        };
      }
    }
    return null;
  },

  evaluerCellule(f, ref, cycles) {
    const c = f.cellules[ref];
    if (!c) return;
    if (cycles.has(ref)) { c.valeur = null; c.matrice = null; c.erreur = "#CYCLE!"; return; }
    const source = c.saisie.trim().slice(1);
    const r = Formules.evaluer(source, Feuille.contexte(f));
    if (r.erreur) { c.valeur = null; c.matrice = null; c.erreur = r.erreur; return; }

    if (Array.isArray(r.valeur)) {
      let arbre = null;
      try { arbre = Formules.arbre(source); } catch (_) {}
      if (arbre && ["ref", "plage", "plageCol", "plageLigne"].includes(arbre.t)) {
        c.valeur = null; c.matrice = null; c.erreur = "#PLAGE!"; return;   // une plage seule ne se déploie pas
      }
      const souci = Feuille.propager(f, ref, r.valeur);
      if (souci) { c.valeur = null; c.matrice = null; c.erreur = souci; return; }
      c.erreur = null;
      return;
    }

    c.valeur = r.valeur; c.matrice = null; c.erreur = null;
    if (!c.format) {                                // une fonction de date impose son affichage
      try {
        const a = Formules.arbre(source);
        if (a.t === "fn" && FONCTIONS[a.nom]?.formatSuggere) c.format = FONCTIONS[a.nom].formatSuggere;
      } catch (_) {}
    }
  },

  /** Recalcul : littéraux d'abord, puis formules dans l'ordre de leurs dépendances.
   *  Plusieurs passes permettent aux formules qui lisent une zone déployée de se mettre à jour. */
  recalculer(f) {
    const estFormule = ref => String(f.cellules[ref]?.saisie || "").trim().startsWith("=");
    Object.keys(f.cellules).forEach(r => {          // on repart des seules cellules saisies
      const c = f.cellules[r];
      if (!c.propage) return;
      if (String(c.saisie).trim() === "") delete f.cellules[r];
      else { delete c.propage; delete c.source; }  // l'utilisateur a écrit par-dessus : la cellule redevient sienne
    });

    const formules = [];
    Object.entries(f.cellules).forEach(([ref, c]) => {
      if (estFormule(ref)) { c.valeur = null; c.erreur = null; c.matrice = null; formules.push(ref); return; }
      const r = Feuille.analyser(f, c.saisie);
      c.valeur = r.valeur; c.erreur = r.erreur;
      if (r.formatAuto && !c.format) c.format = r.formatAuto;
    });

    const etat = {}, ordre = [], cycles = new Set();
    const visiter = ref => {
      if (etat[ref] === 2) return;
      if (etat[ref] === 1) { cycles.add(ref); return; }
      etat[ref] = 1;
      Formules.dependances(f.cellules[ref].saisie.trim().slice(1), f)
        .forEach(d => { if (estFormule(d)) visiter(d); });
      etat[ref] = 2;
      ordre.push(ref);
    };
    formules.forEach(visiter);

    let empreinte = null;
    for (let passe = 0; passe < 3; passe++) {
      ordre.forEach(ref => Feuille.evaluerCellule(f, ref, cycles));
      const actuelle = ordre.map(r => JSON.stringify(f.cellules[r]?.valeur)).join("|");
      if (actuelle === empreinte) break;
      empreinte = actuelle;
    }
  },

  /** Tableau de données nommé, déclaré dans la feuille :
   *  tableaux: [{ nom:"Ventes", plage:"A1:E6", entetes:true }]
   *  C'est la couche source des modules à venir (tri, filtres, TCD, graphiques). */
  tableau(f, nom) {
    const def = (f.tableaux || []).find(t => t.nom === nom);
    if (!def) return null;
    const p = Ref.plage(def.plage);
    if (!p) return null;
    const avecEntetes = def.entetes !== false;
    const ligneEntete = avecEntetes ? p.l1 : null;
    const entetes = [];
    for (let c = p.c1; c <= p.c2; c++) {
      entetes.push(avecEntetes ? versTexte(Feuille.valeur(f, Ref.vers(c, ligneEntete))) : Ref.lettre(c));
    }
    const colonne = entete => {
      const i = entetes.indexOf(entete);
      return i === -1 ? null : p.c1 + i;
    };
    const premiere = avecEntetes ? p.l1 + 1 : p.l1;
    return {
      nom: def.nom, plage: def.plage, entetes, premiereLigne: premiere, derniereLigne: p.l2,
      colDebut: p.c1, colFin: p.c2,
      colonne,
      /** Références d'une colonne, en-tête exclu : "B2:B6" */
      plageColonne(entete) {
        const c = colonne(entete);
        return c === null ? null : `${Ref.vers(c, premiere)}:${Ref.vers(c, p.l2)}`;
      },
      refsColonne(entete) {
        const c = colonne(entete);
        if (c === null) return [];
        const refs = [];
        for (let l = premiere; l <= p.l2; l++) refs.push(Ref.vers(c, l));
        return refs;
      },
      /** Lignes sous forme d'objets { entête: valeur }, avec les références d'origine. */
      lignes() {
        const out = [];
        for (let l = premiere; l <= p.l2; l++) {
          const ligne = { __ligne: l, __refs: {} };
          entetes.forEach((h, i) => {
            const ref = Ref.vers(p.c1 + i, l);
            ligne[h] = Feuille.valeur(f, ref);
            ligne.__refs[h] = ref;
          });
          out.push(ligne);
        }
        return out;
      }
    };
  },

  formatDe(f, ref) {
    const c = f.cellules[ref];
    if (c?.format) return c.format;
    const col = Ref.depuis(ref);
    return (col && f.formatsCol[Ref.lettre(col.col)]) || "auto";
  },

  /** Rendu textuel d'une cellule : { texte, classe } */
  afficher(f, ref) {
    const c = f.cellules[ref];
    if (!c) return { texte: "", classe: "" };
    if (c.erreur) return { texte: c.erreur, classe: "" };
    const v = c.valeur;
    if (v === null || v === "") return { texte: "", classe: "" };
    if (typeof v === "boolean") return { texte: v ? "VRAI" : "FAUX", classe: "cel--nombre" };
    if (typeof v === "number") return { texte: Formatage.nombre(v, Feuille.formatDe(f, ref)), classe: "cel--nombre" };
    return { texte: String(v), classe: c.titre ? "cel--titre" : "" };
  }
};

const Formatage = {
  EPOQUE: Date.UTC(1899, 11, 30),        // référence des numéros de série, comme Excel
  versSerie(a, m, j) { return Math.round((Date.UTC(a, m - 1, j) - Formatage.EPOQUE) / 86400000); },
  versDate(serie) { return new Date(Formatage.EPOQUE + Math.round(serie) * 86400000); },
  dateTexte(serie) {
    const d = Formatage.versDate(serie), p = n => String(n).padStart(2, "0");
    return `${p(d.getUTCDate())}/${p(d.getUTCMonth() + 1)}/${d.getUTCFullYear()}`;
  },
  formats: {
    auto:     { max: 2, min: 0 },
    entier:   { max: 0, min: 0 },
    nombre:   { max: 2, min: 2 },
    monnaie:  { max: 2, min: 2, style: "currency", currency: "EUR" },
    pourcent: { max: 1, min: 0, style: "percent" },
    texte:    null
  },
  libelles: { auto: "Auto", entier: "Entier", nombre: "Nombre", monnaie: "Monnaie", pourcent: "Pourcent", date: "Date", texte: "Texte" },
  nombre(v, format) {
    if (format === "date") return Formatage.dateTexte(v);
    const cfg = Formatage.formats[format];
    if (!cfg) return String(v);
    return new Intl.NumberFormat("fr-FR", {
      minimumFractionDigits: cfg.min, maximumFractionDigits: cfg.max,
      style: cfg.style, currency: cfg.currency
    }).format(v);
  }
};

/** Mise en forme conditionnelle : des règles déclaratives évaluées au moment du rendu.
 *  Les valeurs ne sont jamais modifiées — seule leur apparence change. */
const MFC = {
  types: {
    superieur: { nom: "Supérieur à", valeur: true,
                 teste: (v, r) => typeof v === "number" && v > versNombre(r.valeur) },
    inferieur: { nom: "Inférieur à", valeur: true,
                 teste: (v, r) => typeof v === "number" && v < versNombre(r.valeur) },
    egal:      { nom: "Égal à", valeur: true,
                 teste: (v, r) => (v !== null && v !== "") && egalValeur(v, r.valeur) },
    contient:  { nom: "Contient le texte", valeur: true,
                 teste: (v, r) => versTexte(v) !== "" && versTexte(v).toLowerCase().includes(versTexte(r.valeur).toLowerCase()) },
    vide:      { nom: "Cellule vide", valeur: false,
                 teste: v => v === null || v === "" },
    barres:    { nom: "Barres de données", valeur: false, barre: true,
                 teste: v => typeof v === "number" }
  },
  styles: { vert: "Vert", ambre: "Ambre", rouge: "Rouge", gras: "Gras" },

  dansPlage(regle, ref) {
    const p = Ref.plage(regle.plage || "");
    const q = Ref.depuis(ref);
    return !!(p && q && q.col >= p.c1 && q.col <= p.c2 && q.ligne >= p.l1 && q.ligne <= p.l2);
  },

  /** Première règle qui s'applique à la cellule, ou null. */
  appliquer(f, ref) {
    for (const r of (f.reglesMFC || [])) {
      const def = MFC.types[r.type];
      if (!def || !MFC.dansPlage(r, ref)) continue;
      const v = Feuille.valeur(f, ref);
      let passe = false;
      try { passe = def.teste(v, r); } catch (_) { passe = false; }
      if (!passe) continue;
      if (def.barre) {
        const vals = Ref.listePlage(Ref.plage(r.plage)).map(x => Feuille.valeur(f, x)).filter(x => typeof x === "number");
        const max = Math.max(...vals.map(Math.abs), 1);
        return { style: "barre", barre: Math.round(Math.abs(v) / max * 100) };
      }
      return { style: r.style || "ambre" };
    }
    return null;
  },

  /** Description lisible d'une règle, pour la liste de l'atelier. */
  libelle(r) {
    const def = MFC.types[r.type];
    const cible = def && def.valeur ? ` ${r.valeur}` : "";
    const style = MFC.types[r.type]?.barre ? "" : ` → ${MFC.styles[r.style] || r.style}`;
    return `${r.plage} : ${def ? def.nom : r.type}${cible}${style}`;
  }
};

/** Tableau croisé dynamique : regroupe les lignes d'un tableau de données
 *  selon un ou deux champs, et agrège un troisième. */
const TCD = {
  agregats: {
    somme:   { nom: "Somme",   calcul: a => a.filter(x => typeof x === "number").reduce((s, v) => s + v, 0) },
    moyenne: { nom: "Moyenne", calcul: a => { const n = a.filter(x => typeof x === "number"); return n.length ? n.reduce((s, v) => s + v, 0) / n.length : null; } },
    nb:      { nom: "Nombre",  calcul: a => a.filter(x => x !== null && x !== "").length },
    max:     { nom: "Maximum", calcul: a => { const n = a.filter(x => typeof x === "number"); return n.length ? Math.max(...n) : null; } },
    min:     { nom: "Minimum", calcul: a => { const n = a.filter(x => typeof x === "number"); return n.length ? Math.min(...n) : null; } }
  },

  /** @returns {null|{modL, modC, cellule, totalLigne, totalColonne, general}} */
  calculer(f, def) {
    if (!def || !def.lignes || !def.valeur) return null;
    const t = Feuille.tableau(f, def.tableau);
    if (!t || !t.entetes.includes(def.lignes) || !t.entetes.includes(def.valeur)) return null;
    if (def.colonnes && !t.entetes.includes(def.colonnes)) return null;

    const lignes = t.lignes();
    const modalites = champ => {
      const vus = new Map();
      lignes.forEach(l => { const k = versTexte(l[champ]); if (!vus.has(k)) vus.set(k, l[champ]); });
      return [...vus.entries()].sort((a, b) => comparerValeurs(a[1], b[1])).map(e => e[0]);
    };
    const modL = modalites(def.lignes);
    const modC = def.colonnes ? modalites(def.colonnes) : null;

    const SEP = "\u0000", TOT = "\u0000TOTAL";
    const paquets = {};
    const ranger = (cle, v) => { (paquets[cle] = paquets[cle] || []).push(v); };
    lignes.forEach(l => {
      const kl = versTexte(l[def.lignes]);
      const kc = modC ? versTexte(l[def.colonnes]) : "";
      const v = l[def.valeur];
      ranger(kl + SEP + kc, v);
      ranger(kl + SEP + TOT, v);
      if (modC) ranger(TOT + SEP + kc, v);
      ranger(TOT + SEP + TOT, v);
    });

    const agg = TCD.agregats[def.agregat] || TCD.agregats.somme;
    const val = cle => (paquets[cle] ? agg.calcul(paquets[cle]) : null);
    return {
      modL, modC, agregat: agg.nom,
      cellule: (l, c) => val(l + SEP + (c === undefined || c === null ? "" : c)),
      totalLigne: l => val(l + SEP + TOT),
      totalColonne: c => val(TOT + SEP + c),
      general: val(TOT + SEP + TOT)
    };
  }
};

/** Fabrique d'éléments SVG — createElement ne convient pas pour cet espace de noms. */
function svg(tag, attrs = {}, ...enfants) {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  enfants.flat().forEach(c => {
    if (c === null || c === undefined || c === false) return;
    n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  });
  return n;
}

/** Graphiques natifs en SVG : aucune bibliothèque, aucun réseau.
 *  Une série se calcule exactement comme un croisement à une dimension. */
const Graphique = {
  types: { colonnes: { nom: "Colonnes" }, barres: { nom: "Barres" }, lignes: { nom: "Courbe" }, secteurs: { nom: "Secteurs" } },
  palette: ["var(--g1)", "var(--g2)", "var(--g3)", "var(--g4)", "var(--g5)", "var(--g6)"],
  L: 640, H: 300,

  serie(f, def) {
    if (!def || !def.libelles || !def.valeurs) return null;
    const r = TCD.calculer(f, { tableau: def.tableau, lignes: def.libelles, colonnes: null,
                                valeur: def.valeurs, agregat: def.agregat });
    if (!r) return null;
    return r.modL.map(l => ({ nom: l, valeur: r.totalLigne(l) ?? 0 }));
  },

  couleur(i) { return Graphique.palette[i % Graphique.palette.length]; },
  fmt(v) { return Formatage.nombre(v, "auto"); },
  /** Équivalent textuel du graphique, pour les lecteurs d'écran et l'infobulle native. */
  resume(serie, type) {
    const nom = (Graphique.types[type] || { nom: "Graphique" }).nom;
    return `${nom} : ` + serie.map(s => `${s.nom} ${Graphique.fmt(s.valeur)}`).join(", ");
  },

  dessiner(serie, type) {
    if (!serie || !serie.length) return el("p.tcd__vide", {}, "Choisissez les champs, puis créez le graphique.");
    if (type === "secteurs") return Graphique.secteurs(serie);
    if (type === "barres") return Graphique.barres(serie);
    return Graphique.cartesien(serie, type);
  },

  /** Colonnes verticales et courbes : même repère, deux rendus. */
  cartesien(serie, type) {
    const { L, H } = Graphique, m = { g: 62, d: 18, h: 26, b: 44 };
    const lg = L - m.g - m.d, ht = H - m.h - m.b;
    const vals = serie.map(s => s.valeur);
    const max = Math.max(0, ...vals), min = Math.min(0, ...vals);
    const etendue = (max - min) || 1;
    const y = v => m.h + ht - ((v - min) / etendue) * ht;
    const pas = lg / serie.length;
    const noeuds = [];

    [max, min + etendue / 2, min].forEach(v => {
      noeuds.push(svg("line", { class: "graph__grille", x1: m.g, x2: m.g + lg, y1: y(v), y2: y(v) }));
      noeuds.push(svg("text", { x: m.g - 8, y: y(v) + 4, "text-anchor": "end" }, Graphique.fmt(v)));
    });
    noeuds.push(svg("line", { class: "graph__axe", x1: m.g, x2: m.g + lg, y1: y(0), y2: y(0) }));

    serie.forEach((s, i) => {
      const cx = m.g + (i + 0.5) * pas;
      if (type === "colonnes") {
        const lb = Math.min(pas * 0.6, 68);
        noeuds.push(svg("rect", { class: "graph__barre", x: cx - lb / 2, y: Math.min(y(s.valeur), y(0)),
          width: lb, height: Math.max(2, Math.abs(y(s.valeur) - y(0))), rx: 3, fill: Graphique.couleur(i) },
          svg("title", {}, `${s.nom} : ${Graphique.fmt(s.valeur)}`)));
      }
      noeuds.push(svg("text", { class: "graph__val", x: cx, y: y(s.valeur) + (s.valeur < 0 ? 16 : -7), "text-anchor": "middle" },
        Graphique.fmt(s.valeur)));
      noeuds.push(svg("text", { x: cx, y: H - 16, "text-anchor": "middle" }, s.nom));
    });

    if (type === "lignes") {
      const points = serie.map((s, i) => `${m.g + (i + 0.5) * pas},${y(s.valeur)}`).join(" ");
      noeuds.push(svg("polyline", { points, fill: "none", stroke: "var(--focus)", "stroke-width": 2.5,
        "stroke-linejoin": "round", "stroke-linecap": "round" }));
      serie.forEach((s, i) => noeuds.push(svg("circle", {
        cx: m.g + (i + 0.5) * pas, cy: y(s.valeur), r: 4.5, fill: "var(--focus)", stroke: "var(--surface)", "stroke-width": 2 },
        svg("title", {}, `${s.nom} : ${Graphique.fmt(s.valeur)}`))));
    }
    return el("div.graph", {}, svg("svg", { viewBox: `0 0 ${L} ${H}`, role: "img", "aria-label": Graphique.resume(serie, type) }, noeuds));
  },

  /** Barres horizontales : lisible quand les libellés sont longs ou nombreux. */
  barres(serie) {
    const { L } = Graphique, m = { g: 130, d: 70, h: 16, b: 16 };
    const H = Math.max(180, m.h + m.b + serie.length * 34);
    const lg = L - m.g - m.d;
    const max = Math.max(1, ...serie.map(s => Math.abs(s.valeur)));
    const pas = (H - m.h - m.b) / serie.length;
    const noeuds = [svg("line", { class: "graph__axe", x1: m.g, x2: m.g, y1: m.h, y2: H - m.b })];
    serie.forEach((s, i) => {
      const cy = m.h + (i + 0.5) * pas, lb = Math.abs(s.valeur) / max * lg;
      noeuds.push(svg("rect", { class: "graph__barre", x: m.g, y: cy - 10, width: Math.max(2, lb), height: 20, rx: 3, fill: Graphique.couleur(i) },
        svg("title", {}, `${s.nom} : ${Graphique.fmt(s.valeur)}`)));
      noeuds.push(svg("text", { x: m.g - 10, y: cy + 4, "text-anchor": "end" }, s.nom));
      noeuds.push(svg("text", { class: "graph__val", x: m.g + lb + 8, y: cy + 4 }, Graphique.fmt(s.valeur)));
    });
    return el("div.graph", {}, svg("svg", { viewBox: `0 0 ${L} ${H}`, role: "img", "aria-label": Graphique.resume(serie, "barres") }, noeuds));
  },

  /** Secteurs : réservé aux parts d'un tout, donc aux valeurs positives. */
  secteurs(serie) {
    if (serie.some(s => s.valeur < 0))
      return el("p.tcd__vide", {}, "Un graphique en secteurs ne peut pas représenter de valeurs négatives : il montre des parts d'un tout.");
    const total = serie.reduce((s, x) => s + x.valeur, 0);
    if (total <= 0) return el("p.tcd__vide", {}, "Aucune valeur à représenter.");

    const H = 300, cx = 150, cy = 150, r = 118;
    let angle = -Math.PI / 2;
    const parts = serie.map((s, i) => {
      const portion = s.valeur / total;
      const fin = angle + portion * Math.PI * 2;
      const p = a => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
      const [x1, y1] = p(angle), [x2, y2] = p(fin);
      const d = portion >= 0.999
        ? `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx - 0.01} ${cy - r} Z`
        : `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${portion > 0.5 ? 1 : 0} 1 ${x2} ${y2} Z`;
      angle = fin;
      return svg("path", { class: "graph__barre", d, fill: Graphique.couleur(i), stroke: "var(--surface)", "stroke-width": 2 },
        svg("title", {}, `${s.nom} : ${Graphique.fmt(s.valeur)} (${Math.round(portion * 100)} %)`));
    });

    const legende = el("div.graph__legende", {}, serie.map((s, i) =>
      el("span.graph__cle", {},
        el("span.graph__pastille", { style: `background:${Graphique.couleur(i)}` }),
        el("span", {}, `${s.nom} — ${Graphique.fmt(s.valeur)} (${Math.round(s.valeur / total * 100)} %)`))));

    return el("div.graph", {}, svg("svg", { viewBox: `0 0 300 ${H}`, role: "img", "aria-label": Graphique.resume(serie, "secteurs"), style: "max-width:320px;margin:0 auto" }, parts), legende);
  }
};

/* ══ 6c. TABLEUR — composant interactif ═════════════════════ */
/**
 * Crée une grille éditable.
 * @returns { element, feuille, focus(), rafraichir(), surChangement }
 */
function creerTableur(feuille, options = {}) {
  const opt = { outils: true, pied: true, hauteur: null, ...options };
  let actif = { c: 0, l: 0 }, ancre = { c: 0, l: 0 };
  let edition = null;                 // { ref, input, origine }
  let presse = null;                  // { cellules:[[{saisie,format}]] }
  const histo = { pile: [], index: -1 };
  const auChangement = [];

  /* — Utilitaires — */
  const refActive = () => Ref.vers(actif.c, actif.l);
  const zoneSel = () => ({
    c1: Math.min(actif.c, ancre.c), c2: Math.max(actif.c, ancre.c),
    l1: Math.min(actif.l, ancre.l), l2: Math.max(actif.l, ancre.l)
  });
  const refsSel = () => Ref.listePlage(zoneSel());
  const cloner = c => (c ? { ...c } : null);
  const borner = (v, max) => Math.max(0, Math.min(max, v));

  /* — Historique — */
  function transaction(refs, fn) {
    const avant = {}; refs.forEach(r => avant[r] = cloner(feuille.cellules[r]));
    fn();
    Feuille.recalculer(feuille);
    const apres = {}; refs.forEach(r => apres[r] = cloner(feuille.cellules[r]));
    histo.pile.splice(histo.index + 1);
    histo.pile.push({ avant, apres });
    histo.index = histo.pile.length - 1;
    majAffichage(); majOutils();
    auChangement.forEach(fn2 => fn2(feuille));
  }
  function appliquer(snapshot) {
    Object.entries(snapshot).forEach(([ref, c]) => {
      if (c) feuille.cellules[ref] = { ...c }; else delete feuille.cellules[ref];
    });
    Feuille.recalculer(feuille);
    majAffichage(); majOutils();
    auChangement.forEach(fn => fn(feuille));
  }
  function annuler() { if (histo.index < 0) return; appliquer(histo.pile[histo.index].avant); histo.index--; }
  function retablir() { if (histo.index >= histo.pile.length - 1) return; histo.index++; appliquer(histo.pile[histo.index].apres); }

  /* — Écriture — */
  /** Le verrou d'une cellule protège son contenu, pas son apparence :
   *  on peut toujours reformater une donnée d'énoncé, jamais la réécrire. */
  function ecrire(modifs) {          // { "A1": {saisie} | {format} }
    const refs = Object.keys(modifs);
    const bloquees = refs.filter(r => feuille.cellules[r]?.verrou && "saisie" in modifs[r]);
    const libres = refs.filter(r => !bloquees.includes(r));
    if (bloquees.length) Toast.afficher("Cette donnée fait partie de l'énoncé : son contenu n'est pas modifiable.");
    if (!libres.length) return;
    transaction(libres, () => {
      libres.forEach(r => {
        const c = Feuille.cellule(feuille, r, true);
        const verrou = c.verrou;
        if ("saisie" in modifs[r] && !verrou) c.saisie = modifs[r].saisie;
        if ("format" in modifs[r]) c.format = modifs[r].format;
      });
    });
  }

  /* — Rendu — */
  const barreRef = el("div.tableur__ref", {}, "A1");
  const barreFormule = el("input.tableur__formule", { type: "text", spellcheck: "false",
    "aria-label": "Barre de formule", placeholder: "Saisir une valeur ou une formule" });
  const barre = el("div.tableur__barre", {}, barreRef, el("div.tableur__fx", {}, "fx"), barreFormule);

  const grille = el("div.feuille");
  const idg = "grille" + (creerTableur.compteur = (creerTableur.compteur || 0) + 1);   // identifiants de cellules uniques par grille
  const zone = el("div.tableur__zone", { tabindex: "0", role: "grid", "aria-label": "Feuille de calcul" }, grille);
  if (opt.hauteur) zone.style.maxHeight = opt.hauteur;

  const statsPied = el("div.tableur__stats", {});
  const infoPied = el("div.mono", {}, "");
  const pied = el("div.tableur__pied", {}, statsPied, infoPied);
  const aide = el("div.aide-fonction", { style: "display:none" });
  // Explication du code d'erreur de la cellule active : lisible au clavier, au tactile et au lecteur d'écran.
  const erreurInfo = el("div.erreur-info", { role: "status", hidden: true });
  let erreurAffichee = "";

  const boutonsFormat = {};
  const outils = el("div.tableur__outils", {});
  const btnAnnuler = el("button.outil", { onclick: annuler, title: "Annuler (Ctrl+Z)" }, "↶ Annuler");
  const btnRetablir = el("button.outil", { onclick: retablir, title: "Rétablir (Ctrl+Y)" }, "↷ Rétablir");
  if (opt.outils) {
    outils.append(btnAnnuler, btnRetablir, el("div.outil--sep"));
    Object.keys(Formatage.libelles).forEach(fmt => {
      const b = el("button.outil", { onclick: () => appliquerFormat(fmt), "aria-pressed": "false" }, Formatage.libelles[fmt]);
      boutonsFormat[fmt] = b; outils.append(b);
    });
    outils.append(el("div.outil--sep"),
      el("button.outil", { onclick: effacerSelection, title: "Suppr" }, "Effacer"));
  }

  const racine = el("div.tableur", {}, barre, aide, opt.outils ? outils : null, zone, erreurInfo, opt.pied ? pied : null);

  const visible = l => !(feuille.lignesMasquees && feuille.lignesMasquees.has(l));
  /** Première ligne visible à partir de l, dans le sens donné. */
  function ligneVisible(l, sens = 1) {
    let x = borner(l, feuille.nbLigne - 1);
    while (!visible(x)) {
      x += sens;
      if (x < 0 || x >= feuille.nbLigne) {
        x = borner(l, feuille.nbLigne - 1);
        while (!visible(x) && x >= 0 && x < feuille.nbLigne) x -= sens;
        break;
      }
    }
    return borner(x, feuille.nbLigne - 1);
  }

  /** Sur un écran étroit, une feuille plus large que l'affichage oblige à faire défiler,
   *  et les colonnes de gauche disparaissent alors qu'elles portent les données de l'énoncé.
   *  On resserre proportionnellement les colonnes pour que l'ensemble reste visible. */
  function largeursAjustees() {
    const brutes = [];
    for (let c = 0; c < feuille.nbCol; c++) brutes.push(feuille.largeurs[Ref.lettre(c)] || 104);
    const total = brutes.reduce((s, v) => s + v, 0);
    const large = zone.clientWidth || racine.clientWidth || window.innerWidth || 900;
    const dispo = large - 44 - 16;
    if (total <= dispo || dispo < 200) return brutes;
    const MINI = 62;
    const facteur = Math.max(dispo / total, MINI * feuille.nbCol / total);
    return brutes.map(l => Math.max(MINI, Math.round(l * facteur)));
  }

  function dessiner() {
    const colonnes = ["44px", ...largeursAjustees().map(l => l + "px")];
    grille.style.gridTemplateColumns = colonnes.join(" ");

    // Structure ARIA : grille > rangées > cellules. Les rangées sont en display:contents, la mise en page ne change pas.
    const tete = [el("div.enTete.enTete--coin", { role: "columnheader", "aria-colindex": 1, "aria-label": "Numéros de ligne" })];
    for (let c = 0; c < feuille.nbCol; c++) tete.push(el("div.enTete.enTete--col", { "data-col": c, role: "columnheader", "aria-colindex": c + 2 }, Ref.lettre(c)));
    const rangees = [el("div.rangee", { role: "row", "aria-rowindex": 1 }, ...tete)];
    let visibles = 0;
    for (let l = 0; l < feuille.nbLigne; l++) {
      if (!visible(l)) continue;               // ligne filtrée : son numéro disparaît, comme dans Excel
      visibles++;
      const cases = [el("div.enTete.enTete--ligne", { "data-ligne": l, role: "rowheader", "aria-colindex": 1 }, l + 1)];
      for (let c = 0; c < feuille.nbCol; c++) {
        cases.push(el("div.cellule", { "data-ref": Ref.vers(c, l), id: idg + "-" + Ref.vers(c, l), role: "gridcell",
          "aria-colindex": c + 2 }, el("span.cel")));
      }
      rangees.push(el("div.rangee", { role: "row", "aria-rowindex": l + 2 }, ...cases));
    }
    zone.setAttribute("aria-rowcount", String(feuille.nbLigne + 1));
    zone.setAttribute("aria-colcount", String(feuille.nbCol + 1));
    grille.replaceChildren(...rangees);
    if (!visible(actif.l)) { actif = { ...actif, l: ligneVisible(actif.l) }; ancre = { ...actif }; }
    majAffichage();
  }

  const caseDe = ref => grille.querySelector(`.cellule[data-ref="${ref}"]`);

  function majAffichage() {
    grille.querySelectorAll(".cellule").forEach(boite => {
      const ref = boite.dataset.ref;
      if (edition && edition.ref === ref) return;
      const c = feuille.cellules[ref];
      const { texte, classe } = Feuille.afficher(feuille, ref);
      let span = boite.querySelector(".cel");
      if (!span || boite.querySelector("input")) { span = el("span.cel"); boite.replaceChildren(span); }
      span.className = "cel " + classe;
      span.textContent = texte;
      const mfc = MFC.appliquer(feuille, ref);
      if (mfc && mfc.style !== "barre") boite.dataset.mfc = mfc.style;
      else delete boite.dataset.mfc;
      let barre = boite.querySelector(".mfc-barre");
      if (mfc && mfc.barre !== undefined) {
        if (!barre) { barre = el("div.mfc-barre"); boite.prepend(barre); }
        barre.style.width = Math.max(3, mfc.barre) + "%";
      } else if (barre) barre.remove();
      boite.classList.toggle("verrou", !!c?.verrou);
      boite.classList.toggle("propage", !!c?.propage);
      boite.classList.toggle("erreur", !!c?.erreur);
      if (c?.verrou || c?.propage) boite.setAttribute("aria-readonly", "true"); else boite.removeAttribute("aria-readonly");
      if (c?.erreur) boite.setAttribute("aria-invalid", "true"); else boite.removeAttribute("aria-invalid");
      if (c?.erreur) boite.title = Formules.messageErreur(c.erreur);
      else boite.removeAttribute("title");
    });
    majSelection();
  }

  function majSelection() {
    const z = zoneSel(), ref = refActive();
    grille.querySelectorAll(".cellule").forEach(boite => {
      const p = Ref.depuis(boite.dataset.ref);
      const dedans = p.col >= z.c1 && p.col <= z.c2 && p.ligne >= z.l1 && p.ligne <= z.l2;
      const estActive = p.col === actif.c && p.ligne === actif.l;
      boite.classList.toggle("selection", dedans && !estActive);
      boite.classList.toggle("actif", estActive);
      boite.setAttribute("aria-selected", dedans || estActive ? "true" : "false");
      boite.querySelector(".poignee")?.remove();
    });
    if (!edition) caseDe(Ref.vers(z.c2, z.l2))?.append(el("div.poignee", { title: "Recopier vers le bas ou la droite" }));
    grille.querySelectorAll(".enTete--col").forEach(th =>
      th.classList.toggle("enTete--vise", +th.dataset.col >= z.c1 && +th.dataset.col <= z.c2));
    grille.querySelectorAll(".enTete--ligne").forEach(th =>
      th.classList.toggle("enTete--vise", +th.dataset.ligne >= z.l1 && +th.dataset.ligne <= z.l2));

    const multiple = z.c1 !== z.c2 || z.l1 !== z.l2;
    barreRef.textContent = multiple ? `${Ref.vers(z.c1, z.l1)}:${Ref.vers(z.c2, z.l2)}` : ref;
    zone.setAttribute("aria-activedescendant", idg + "-" + ref);
    if (!edition) barreFormule.value = feuille.cellules[ref]?.saisie || "";
    majPied();
    majOutils();
    majErreur(ref);
  }

  /** Pendant la saisie, rien ne bouge : le panneau garde son état jusqu'à la validation. */
  function majErreur(ref) {
    if (edition) return;
    const code = feuille.cellules[ref]?.erreur;
    const cle = code ? ref + code : "";
    if (cle === erreurAffichee) return;
    erreurAffichee = cle;
    if (!code) { erreurInfo.hidden = true; erreurInfo.replaceChildren(); return; }
    const message = Formules.messageErreur(code);
    const fns = fonctionsCitees(message);
    erreurInfo.replaceChildren(
      el("span.erreur-info__ref", {}, ref),
      el("code.code-err", {}, code),
      el("span", {}, message),
      ...(fns.length ? [el("span.erreur-info__voir", {}, "Voir dans le lexique :",
        ...fns.map(n => el("button.erreur-info__fn", { type: "button", onclick: () => Lexique.ouvrir(n) }, n)))] : []));
    erreurInfo.hidden = false;
  }

  function majPied() {
    if (!opt.pied) return;
    const valeurs = refsSel().map(r => feuille.cellules[r]?.valeur).filter(v => typeof v === "number");
    const nb = refsSel().filter(r => (feuille.cellules[r]?.saisie || "") !== "").length;
    statsPied.replaceChildren();
    if (valeurs.length) {
      const somme = valeurs.reduce((a, b) => a + b, 0);
      statsPied.append(
        el("span", {}, `Somme ${Formatage.nombre(somme, "auto")}`),
        el("span", {}, `Moyenne ${Formatage.nombre(somme / valeurs.length, "auto")}`),
        el("span", {}, `Nombre ${valeurs.length}`)
      );
    } else {
      statsPied.append(el("span.tres-muet", {}, nb ? `${nb} cellule(s) remplie(s)` : "Sélection vide"));
    }
    infoPied.textContent = feuille.nom;
  }

  function majOutils() {
    if (!opt.outils) return;
    btnAnnuler.disabled = histo.index < 0;
    btnRetablir.disabled = histo.index >= histo.pile.length - 1;
    const fmt = Feuille.formatDe(feuille, refActive());
    Object.entries(boutonsFormat).forEach(([k, b]) => b.setAttribute("aria-pressed", k === fmt ? "true" : "false"));
  }

  /* — Déplacement — */
  function allerA(c, l, etendre) {
    const cible = borner(l, feuille.nbLigne - 1);
    actif = { c: borner(c, feuille.nbCol - 1), l: visible(cible) ? cible : ligneVisible(cible) };
    if (!etendre) ancre = { ...actif };
    majSelection();
    caseDe(refActive())?.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  function deplacer(dc, dl, etendre) {
    if (dl === 0) return allerA(actif.c + dc, actif.l, etendre);
    let l = actif.l;
    for (let n = 0; n < Math.abs(dl); n++) {
      let suivant = l + Math.sign(dl);
      while (suivant >= 0 && suivant < feuille.nbLigne && !visible(suivant)) suivant += Math.sign(dl);
      if (suivant < 0 || suivant >= feuille.nbLigne) break;
      l = suivant;
    }
    allerA(actif.c + dc, l, etendre);
  }

  function estRempli(c, l) { return (feuille.cellules[Ref.vers(c, l)]?.saisie || "") !== ""; }
  function sautBloc(dc, dl, etendre) {
    let c = actif.c, l = actif.l;
    const dans = () => c + dc >= 0 && c + dc < feuille.nbCol && l + dl >= 0 && l + dl < feuille.nbLigne;
    if (estRempli(c, l) && dans() && estRempli(c + dc, l + dl)) {
      while (dans() && estRempli(c + dc, l + dl)) { c += dc; l += dl; }
    } else {
      while (dans() && !estRempli(c + dc, l + dl)) { c += dc; l += dl; }
      if (dans()) { c += dc; l += dl; }
    }
    allerA(c, l, etendre);
  }

  /* — Édition — */
  function cellulePeutEtreEditee(ref) {
    const c = feuille.cellules[ref];
    if (c?.verrou) { Toast.afficher("Cette donnée fait partie de l'énoncé : son contenu n'est pas modifiable."); return false; }
    if (c?.propage) { Toast.afficher(`Cette cellule est remplie par la formule matricielle de ${c.source} : modifiez-la là-bas.`); return false; }
    return true;
  }

  function commencerEdition(texteInitial = null) {
    const ref = refActive();
    if (edition || !cellulePeutEtreEditee(ref)) return;
    const boite = caseDe(ref);
    if (!boite) return;
    const input = el("input.editeur", { type: "text", spellcheck: "false",
      value: texteInitial !== null ? texteInitial : (feuille.cellules[ref]?.saisie || "") });
    input.addEventListener("input", () => { finInsertion(); barreFormule.value = input.value; majAide(input.value); });
    input.addEventListener("keydown", ev => {
      if (ev.key === "Enter")      { ev.preventDefault(); validerEdition(); deplacer(0, ev.shiftKey ? -1 : 1); zone.focus(); }
      else if (ev.key === "Tab")   { ev.preventDefault(); validerEdition(); deplacer(ev.shiftKey ? -1 : 1, 0); zone.focus(); }
      else if (ev.key === "Escape"){ ev.preventDefault(); annulerEdition(); zone.focus(); }
      ev.stopPropagation();
    });
    boite.replaceChildren(input);
    edition = { ref, input };
    input.focus();
    majAide(input.value);
    if (texteInitial === null) input.select();
    else input.setSelectionRange(input.value.length, input.value.length);
  }

  function validerEdition() {
    if (!edition) return;
    const { ref, input } = edition;
    const valeur = input.value;
    edition = null;
    finInsertion();
    majAide("");
    if ((feuille.cellules[ref]?.saisie || "") !== valeur) ecrire({ [ref]: { saisie: valeur } });
    else majAffichage();
  }

  /** Aide contextuelle : signature de la fonction en cours de saisie. */
  function majAide(texte) {
    const t = String(texte || "");
    let sig = null;
    if (t.startsWith("=")) {
      const noms = [...t.toUpperCase().matchAll(/([A-Z][A-Z0-9._]*)\s*\(/g)].map(m => m[1]);
      const dernier = noms[noms.length - 1];
      if (dernier && FONCTIONS[dernier]) sig = `${FONCTIONS[dernier].signature} — ${FONCTIONS[dernier].aide}`;
    }
    aide.textContent = sig || "";
    aide.style.display = sig ? "block" : "none";
  }

  function annulerEdition() {
    if (!edition) return;
    edition = null;
    finInsertion();
    majAide("");
    majAffichage();
    barreFormule.value = feuille.cellules[refActive()]?.saisie || "";
  }

  /** Recopie la cellule d'origine vers une plage, en décalant les références relatives. */
  function recopier(refSource, refsCibles) {
    const src = feuille.cellules[refSource];
    if (!src) return;
    const p0 = Ref.depuis(refSource);
    const modifs = {};
    refsCibles.forEach(r => {
      if (r === refSource) return;
      const p = Ref.depuis(r);
      modifs[r] = {
        saisie: src.saisie.startsWith("=")
          ? Formules.decaler(src.saisie, p.col - p0.col, p.ligne - p0.ligne)
          : src.saisie,
        format: src.format
      };
    });
    if (Object.keys(modifs).length) ecrire(modifs);
  }

  function effacerSelection() {
    const modifs = {};
    refsSel().forEach(r => { if (feuille.cellules[r]) modifs[r] = { saisie: "" }; });
    if (Object.keys(modifs).length) ecrire(modifs);
  }

  function appliquerFormat(fmt) {
    const modifs = {};
    refsSel().forEach(r => modifs[r] = { format: fmt === "auto" ? null : fmt });
    ecrire(modifs);
  }

  /* — Presse-papier — */
  function copier(couper = false) {
    const z = zoneSel(), lignes = [];
    for (let l = z.l1; l <= z.l2; l++) {
      const ligne = [];
      for (let c = z.c1; c <= z.c2; c++) {
        const cel = feuille.cellules[Ref.vers(c, l)];
        ligne.push({ saisie: cel?.saisie || "", format: cel?.format || null });
      }
      lignes.push(ligne);
    }
    presse = { cellules: lignes };
    const tsv = lignes.map(li => li.map(x => x.saisie).join("\t")).join("\n");
    try { navigator.clipboard?.writeText(tsv); } catch (_) {}
    if (couper) effacerSelection();
    Toast.afficher(couper ? "Cellules coupées." : "Cellules copiées.");
  }

  function coller(donnees = presse) {
    if (!donnees) return;
    const modifs = {};
    donnees.cellules.forEach((ligne, dl) => ligne.forEach((cel, dc) => {
      const c = actif.c + dc, l = actif.l + dl;
      if (c >= feuille.nbCol || l >= feuille.nbLigne) return;
      modifs[Ref.vers(c, l)] = { saisie: cel.saisie, format: cel.format };
    }));
    ecrire(modifs);
  }

  /* — Événements — */
  /* — Désignation de références à la souris pendant la saisie d'une formule — */
  let insertionRef = null;   // { debut, fin } : portion de texte occupée par la référence insérée

  /** Champ de saisie actuellement actif : cellule en édition ou barre de formule. */
  function champActif() {
    if (edition) return edition.input;
    if (document.activeElement === barreFormule) return barreFormule;
    return null;
  }

  /** Vrai si le curseur est à un endroit où Excel accepterait une référence. */
  function modeReference() {
    const input = champActif();
    if (!input || !input.value.startsWith("=")) return false;
    if (insertionRef) return true;
    const avant = input.value.slice(0, input.selectionStart).trimEnd();
    return /[=(;+\-*/^&<>%,:]$/.test(avant);
  }

  function surlignerRef(p1, p2) {
    const z = p2 ? { c1: Math.min(p1.col, p2.col), c2: Math.max(p1.col, p2.col),
                     l1: Math.min(p1.ligne, p2.ligne), l2: Math.max(p1.ligne, p2.ligne) } : null;
    grille.querySelectorAll(".cellule").forEach(b => {
      if (!z) { b.classList.remove("ref-visee"); return; }
      const q = Ref.depuis(b.dataset.ref);
      b.classList.toggle("ref-visee", q.col >= z.c1 && q.col <= z.c2 && q.ligne >= z.l1 && q.ligne <= z.l2);
    });
  }

  function insererReference(p1, p2) {
    const input = champActif();
    if (!input) return;
    const seule = p1.col === p2.col && p1.ligne === p2.ligne;
    const texte = seule
      ? Ref.vers(p1.col, p1.ligne)
      : `${Ref.vers(Math.min(p1.col, p2.col), Math.min(p1.ligne, p2.ligne))}:${Ref.vers(Math.max(p1.col, p2.col), Math.max(p1.ligne, p2.ligne))}`;
    const debut = insertionRef ? insertionRef.debut : input.selectionStart;
    const fin = insertionRef ? insertionRef.fin : input.selectionEnd;
    input.value = input.value.slice(0, debut) + texte + input.value.slice(fin);
    insertionRef = { debut, fin: debut + texte.length };
    input.setSelectionRange(insertionRef.fin, insertionRef.fin);
    input.focus();
    if (input === edition?.input) barreFormule.value = input.value;
    majAide(input.value);
    surlignerRef(p1, p2);
  }

  /** À appeler dès que l'utilisateur reprend la main au clavier. */
  function finInsertion() {
    if (!insertionRef) return;
    insertionRef = null;
    surlignerRef(null);
  }

  let glisse = null;   // "selection" | "poignee" | "reference"

  /** Sélectionne un bloc d'un coup : colonne, ligne ou feuille entière (clic sur un en-tête). */
  function selectionnerBloc(c1, l1, c2, l2) {
    const a = ligneVisible(l1, 1), b = ligneVisible(l2, -1);
    ancre = { c: c1, l: a };
    actif = { c: c2, l: b };
    majSelection();
    caseDe(Ref.vers(c1, a))?.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  grille.addEventListener("mousedown", ev => {
    const tete = ev.target.closest(".enTete");
    if (tete && !modeReference()) {
      ev.preventDefault();
      if (edition) validerEdition();
      if (tete.classList.contains("enTete--col")) selectionnerBloc(+tete.dataset.col, 0, +tete.dataset.col, feuille.nbLigne - 1);
      else if (tete.classList.contains("enTete--ligne")) selectionnerBloc(0, +tete.dataset.ligne, feuille.nbCol - 1, +tete.dataset.ligne);
      else selectionnerBloc(0, 0, feuille.nbCol - 1, feuille.nbLigne - 1);
      zone.focus();
      return;
    }
    const boite = ev.target.closest(".cellule");
    if (!boite) return;
    const p = Ref.depuis(boite.dataset.ref);

    if (modeReference()) {                       // on désigne une plage dans la formule
      ev.preventDefault();
      insererReference(p, p);
      glisse = { mode: "reference", depart: p };
      return;
    }
    if (edition) validerEdition();
    if (ev.target.classList.contains("poignee")) {
      glisse = { mode: "poignee", depart: zoneSel() };
      ev.preventDefault();
      return;
    }
    allerA(p.col, p.ligne, ev.shiftKey);
    glisse = { mode: "selection" };
    zone.focus();
    ev.preventDefault();
  });

  /** Cellule sous le pointeur ; hors de la grille, la plus proche : le glisser ne se perd pas au bord. */
  function celluleSous(x, y) {
    const r = zone.getBoundingClientRect();
    const cx = Math.min(Math.max(x, r.left + 48), r.right - 14);
    const cy = Math.min(Math.max(y, r.top + 34), r.bottom - 14);
    const e = document.elementFromPoint(cx, cy);
    return e && e.closest ? e.closest(".cellule") : null;
  }

  // Pendant un glisser, le texte de la page ne doit jamais être sélectionné à la place des cellules.
  document.addEventListener("selectstart", ev => { if (glisse) ev.preventDefault(); });

  document.addEventListener("mousemove", ev => {
    if (!glisse) return;
    if (!(ev.buttons & 1)) { glisse = null; return; }          // bouton relâché hors de la fenêtre
    const z = zone.getBoundingClientRect();                      // défilement automatique près des bords
    if (ev.clientY > z.bottom - 14) zone.scrollTop += 14; else if (ev.clientY < z.top + 30) zone.scrollTop -= 14;
    if (ev.clientX > z.right - 14) zone.scrollLeft += 14; else if (ev.clientX < z.left + 48) zone.scrollLeft -= 14;
    const boite = celluleSous(ev.clientX, ev.clientY);
    if (!boite) return;
    const p = Ref.depuis(boite.dataset.ref);
    if (glisse.mode === "selection") { actif = { c: p.col, l: p.ligne }; majSelection(); }
    else if (glisse.mode === "reference") { insererReference(glisse.depart, p); }
    else {
      const d = glisse.depart;
      glisse.cible = { c1: Math.min(d.c1, p.col), c2: Math.max(d.c2, p.col),
                       l1: Math.min(d.l1, p.ligne), l2: Math.max(d.l2, p.ligne) };
      grille.querySelectorAll(".cellule").forEach(b => {
        const q = Ref.depuis(b.dataset.ref);
        b.classList.toggle("source-copie",
          q.col >= glisse.cible.c1 && q.col <= glisse.cible.c2 && q.ligne >= glisse.cible.l1 && q.ligne <= glisse.cible.l2);
      });
    }
  });

  document.addEventListener("mouseup", () => {
    if (glisse?.mode === "poignee" && glisse.cible) {
      const source = Ref.vers(glisse.depart.c1, glisse.depart.l1);
      recopier(source, Ref.listePlage(glisse.cible));
      grille.querySelectorAll(".source-copie").forEach(b => b.classList.remove("source-copie"));
    }
    glisse = null;
  });

  grille.addEventListener("dblclick", ev => {
    if (ev.target.closest(".cellule")) commencerEdition();
  });

  zone.addEventListener("keydown", ev => {
    if (edition) return;
    const ctrl = ev.ctrlKey || ev.metaKey;
    const k = ev.key;
    const nav = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[k];
    if (nav) {
      ev.preventDefault();
      ctrl ? sautBloc(nav[0], nav[1], ev.shiftKey) : deplacer(nav[0], nav[1], ev.shiftKey);
    }
    else if (k === "Enter")  { ev.preventDefault(); deplacer(0, ev.shiftKey ? -1 : 1); }
    else if (k === "F2")     { ev.preventDefault(); commencerEdition(); }
    else if (k === "Tab")    { ev.preventDefault(); deplacer(ev.shiftKey ? -1 : 1, 0); }
    else if (k === "Delete" || k === "Backspace") { ev.preventDefault(); effacerSelection(); }
    else if (k === "Home")   { ev.preventDefault(); allerA(0, ctrl ? 0 : actif.l, ev.shiftKey); }
    else if (k === "End")    { ev.preventDefault(); allerA(feuille.nbCol - 1, actif.l, ev.shiftKey); }
    else if (k === "PageDown"){ ev.preventDefault(); deplacer(0, 10, ev.shiftKey); }
    else if (k === "PageUp") { ev.preventDefault(); deplacer(0, -10, ev.shiftKey); }
    else if (ctrl && (k === "z" || k === "Z")) { ev.preventDefault(); ev.shiftKey ? retablir() : annuler(); }
    else if (ctrl && (k === "y" || k === "Y")) { ev.preventDefault(); retablir(); }
    else if (ctrl && (k === "c" || k === "C")) { ev.preventDefault(); copier(); }
    else if (ctrl && (k === "x" || k === "X")) { ev.preventDefault(); copier(true); }
    else if (ctrl && (k === "v" || k === "V")) { /* géré par l'événement paste */ }
    else if (ctrl && (k === "d" || k === "D")) { ev.preventDefault(); const z = zoneSel(); recopier(Ref.vers(z.c1, z.l1), refsSel()); }
    else if (ctrl && (k === "r" || k === "R")) { ev.preventDefault(); const z = zoneSel(); recopier(Ref.vers(z.c1, z.l1), refsSel()); }
    else if (!ctrl && !ev.altKey && k.length === 1) { ev.preventDefault(); commencerEdition(k); }
  });

  zone.addEventListener("paste", ev => {
    const texte = ev.clipboardData?.getData("text/plain");
    if (!texte) return;
    ev.preventDefault();
    const cellules = texte.replace(/\r/g, "").split("\n").map(li => li.split("\t").map(s => ({ saisie: s, format: null })));
    coller({ cellules });
  });

  barreFormule.addEventListener("input", () => { finInsertion(); majAide(barreFormule.value); });
  barreFormule.addEventListener("keydown", ev => {
    if (ev.key === "Enter") {
      ev.preventDefault();
      const ref = refActive();
      if (cellulePeutEtreEditee(ref)) ecrire({ [ref]: { saisie: barreFormule.value } });
      deplacer(0, 1); zone.focus();
    } else if (ev.key === "Escape") {
      barreFormule.value = feuille.cellules[refActive()]?.saisie || "";
      zone.focus();
    }
  });
  barreFormule.addEventListener("blur", () => { finInsertion(); majAide(""); barreFormule.value = feuille.cellules[refActive()]?.saisie || ""; });

  dessiner();
  return {
    element: racine,
    feuille,
    focus: () => zone.focus(),
    selectionner: (c, l) => allerA(c, l, false),
    rafraichir: () => { Feuille.recalculer(feuille); majAffichage(); },
    redessiner: () => dessiner(),
    appliquer: modifs => ecrire(modifs),
    remplacerFeuille(nouvelle) { feuille = nouvelle; histo.pile = []; histo.index = -1; actif = { c: 0, l: 0 }; ancre = { c: 0, l: 0 }; dessiner(); },
    surChangement: fn => auChangement.push(fn)
  };
}

/* ══ 6d. MOTEUR D'EXERCICES ════════════════════════════════ */
/** Chaque type sait se dessiner et se valider. Ajouter un type = ajouter une entrée. */
const TYPES_EXERCICE = {

  qcm: {
    /** Les options sont écrites avec la bonne réponse en tête : elles sont mélangées
     *  à l'affichage, sinon la position suffirait à répondre.
     *  Le mélange est déterministe (dérivé de l'identifiant) pour rester stable
     *  entre le rendu et la correction, tout en différant d'un exercice à l'autre. */
    ordreAffichage(ex) {
      let graine = 0;
      for (const c of String(ex.id)) graine = (graine * 31 + c.charCodeAt(0)) % 100000;
      const suivant = () => (graine = (graine * 1103515245 + 12345) % 2147483648) / 2147483648;
      const ordre = ex.options.map((_, i) => i);
      for (let i = ordre.length - 1; i > 0; i--) {          // mélange de Fisher-Yates
        const j = Math.floor(suivant() * (i + 1));
        [ordre[i], ordre[j]] = [ordre[j], ordre[i]];
      }
      return ordre;
    },

    rendre(ex, api) {
      const boite = el("div.choix");
      const ordre = TYPES_EXERCICE.qcm.ordreAffichage(ex);
      ordre.forEach((source, position) => {
        boite.append(el("button", { onclick: () => api.repondre(source) },
          el("span.lettre", {}, String.fromCharCode(65 + position)),
          el("span", {}, ex.options[source])));
      });
      api.surRetour(res => {
        [...boite.children].forEach((b, position) => {
          const source = ordre[position];
          b.disabled = true;
          if (source === ex.reponse) b.dataset.etat = "juste";
          else if (source === res.reponse) b.dataset.etat = "faux";
        });
      });
      return boite;
    },
    valider(ex, r) {
      return r === ex.reponse ? { reussi: true } : { reussi: false, message: `La bonne réponse était : ${ex.options[ex.reponse]}` };
    }
  },

  formule: {
    rendre(ex, api) {
      const champ = el("input.saisie-reponse", { type: "text", spellcheck: "false",
        placeholder: ex.gabarit || "=…", value: api.reponsePrecedente ?? "" });
      champ.addEventListener("keydown", e => { if (e.key === "Enter") api.repondre(champ.value); });
      const btn = el("button.btn.btn--fort", { onclick: () => api.repondre(champ.value) }, "Valider");
      api.surRetour(() => { champ.disabled = true; btn.disabled = true; });
      if (!api.reponsePrecedente) setTimeout(() => champ.focus(), 60);
      return el("div", {}, champ, el("div", { style: "margin-top:14px" }, btn));
    },
    valider(ex, texte) {
      // Même tolérance que le moteur : la comparaison ne doit pas achopper sur un guillemet courbe.
      const norm = s => Formules.assainir(s).toUpperCase().replace(/\s+/g, "").replace(/^=/, "").replace(/'/g, '"');
      const donne = norm(texte);
      if (!donne) return { reussi: false, message: "Aucune formule saisie." };
      if (ex.solutions.map(norm).includes(donne)) return { reussi: true };
      const rappel = `Solution attendue : ${ex.solutions[0]}`;
      let souci = null;
      try { Formules.arbre(String(texte).replace(/^\s*=/, "")); }
      catch (err) { souci = err instanceof ErreurCalcul ? err.code : "#SYNTAXE!"; }
      if (souci)     // ne pas accuser la fonction quand c'est la formule entière qui est illisible
        return { reussi: false, message: `${Formules.messageErreur(souci)} ${rappel}` };
      if (ex.fonction && !Formules.utilise(texte, ex.fonction))
        return { reussi: false, message: `La fonction ${ex.fonction} est attendue ici. ${rappel}` };
      if (/,/.test(texte) && !/"/.test(texte))
        return { reussi: false, message: `En français, les arguments se séparent par un point-virgule. ${rappel}` };
      if (!String(texte).trim().startsWith("="))
