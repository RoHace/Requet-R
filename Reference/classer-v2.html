<!DOCTYPE html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF9EE">
<title>Classe'R — Apprendre Excel en pratiquant</title>
<style>
/* ═══════════════════════════════════════════════════════════
   CLASSE'R — FEUILLE DE STYLE
   1. Jetons de design    2. Base    3. Mise en page
   4. Composants          5. Vues    6. Responsive
   ═══════════════════════════════════════════════════════════ */

/* ── 1. Jetons de design ─────────────────────────────────── */
:root{
  /* Jour — clair et chaleureux : on doit avoir envie d'ouvrir l'application. */
  --fond:#FFF9EE;      --surface:#FFFFFF;   --surface-2:#FFF2DC;
  --bord:#F0DFC2;      --bord-fort:#D9C09A;
  --texte:#3A2E21;     --texte-2:#63513C;   --texte-3:#7E6A52;
  --accent:#E8952B;    --accent-fort:#9A5408; --accent-doux:#FFEDD1;
  --ambre:#D2691E;     --ambre-doux:#FFE9D2;
  --rouge:#D94F5C;     --rouge-doux:#FFE3E4;
  --ciel:#8FD3F4;      --prairie:#7ECB7E;   --violet:#B58BD8;
  --r:14px; --r-s:9px; --r-l:20px;
  --ombre:0 2px 0 var(--bord);
  --ombre-l:0 4px 0 var(--bord-fort);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --t:140ms cubic-bezier(.4,0,.2,1);
  --g1:#E8952B; --g2:#7ECB7E; --g3:#6FA8DC; --g4:#B58BD8; --g5:#F2748A; --g6:#5FC9B7;
}

[data-theme="sombre"]{
  /* Nuit — même chaleur, moins de lumière. */
  --fond:#241E2E;      --surface:#2E2740;   --surface-2:#3A3150;
  --bord:#453A5E;      --bord-fort:#5C4E78;
  --texte:#FFF3E2;     --texte-2:#CFC2DC;   --texte-3:#A99BC0;
  --accent:#FFB84D;    --accent-fort:#FFD089; --accent-doux:#3D3252;
  --ambre:#FF9F5A;     --ambre-doux:#3F2E3C;
  --rouge:#FF7A8A;     --rouge-doux:#402336;
  --ciel:#6FB8DC;      --prairie:#77BE77;   --violet:#B58BD8;
  --ombre:0 2px 0 rgba(0,0,0,.35);
  --ombre-l:0 4px 0 rgba(0,0,0,.4);
  --g1:#FFB84D; --g2:#8FD98F; --g3:#7FB6EE; --g4:#C79BE8; --g5:#FF8A9C; --g6:#6FD9C7;
}


/* ── 2. Base ─────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--fond); color:var(--texte);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{margin:0; font-weight:650; letter-spacing:-.021em; line-height:1.25}
h1{font-size:26px} h2{font-size:19px} h3{font-size:15px} h4{font-size:13px}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
input,select{font:inherit; color:inherit}
/* Sans cela, un champ non stylé garde le fond blanc du navigateur, illisible en thème sombre. */
input[type="text"],input[type="search"],input[type="number"],input:not([type]),select,textarea{
  background:var(--fond); color:var(--texte);
}
.saisie{
  width:100%; padding:9px 11px; border-radius:var(--r-s);
  border:1px solid var(--champ-bord); background:var(--fond); color:var(--texte);
}
.note{
  border-left:3px solid var(--ambre); background:var(--ambre-doux); color:var(--texte);
  padding:12px 14px; border-radius:var(--r-s); font-size:13px; line-height:1.55; margin-top:14px;
}
.recherche-fn{
  width:100%; margin-bottom:12px; padding:9px 12px; border-radius:var(--r-s);
  border:1px solid var(--champ-bord); background:var(--fond); color:var(--texte); font-size:13.5px;
}
.fn-ligne{display:flex; gap:12px; padding:5px 0; font-size:13px; align-items:baseline; flex-wrap:wrap}
.fn-ligne__sig{min-width:250px; color:var(--accent-fort)}
.fn-ligne--lien{
  width:calc(100% + 16px); text-align:left; cursor:pointer; border-radius:var(--r-s);
  padding:5px 8px; margin:0 -8px; transition:background var(--t);
}
.fn-ligne--lien:hover{background:var(--surface-2)}
.fn-ligne--lien .tres-muet{flex:1}
.fn-ligne__fleche{color:var(--texte-3); font-size:14px}
.fn-ligne__vue{color:var(--accent); opacity:.55; font-size:15px; line-height:1}
.fiche__bloc{margin-bottom:20px}
.fiche__bloc:last-child{margin-bottom:0}
.fiche__label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--texte-3); font-weight:650; margin-bottom:7px;
}
.fiche__texte{font-size:14.5px; line-height:1.65; color:var(--texte)}
.fiche__syntaxe{
  font-family:var(--mono); font-size:13.5px; color:var(--accent-fort);
  background:var(--surface-2); padding:10px 13px; border-radius:var(--r-s);
  display:inline-block; max-width:100%; overflow-x:auto;
}
.fiche__etapes{display:flex; gap:5px; margin-bottom:18px}
.fiche__jalon{height:3px; flex:1; border-radius:2px; background:var(--bord); transition:background var(--t)}
.fiche__jalon--actif{background:var(--accent)}

/* — Parcours guidé — */
.chapitre{
  display:block; width:100%; text-align:left; margin-bottom:10px; cursor:pointer;
  transition:border-color var(--t), transform var(--t);
}
.chapitre:hover{border-color:var(--accent)}
.chapitre--fini{border-color:var(--accent)}
.chapitre__tete{display:flex; gap:13px; align-items:flex-start}
.chapitre__num{
  font-family:var(--mono); font-size:15px; font-weight:700; color:var(--accent);
  background:var(--accent-doux); border-radius:var(--r-s); padding:5px 9px; flex:none;
}
.chapitre h3{font-size:15px; margin-bottom:3px}
.chapitre__resume{font-size:13px; color:var(--texte-2); line-height:1.5}
.chapitre__coche{
  color:var(--accent-fort); font-size:16px; font-weight:700; flex:none;
}
.chapitre__pied{
  display:flex; justify-content:space-between; align-items:center;
  margin-top:11px; padding-top:10px; border-top:1px solid var(--bord); font-size:12.5px;
}
.lecon{
  background:var(--surface); border:1px solid var(--bord); border-radius:var(--r);
  padding:20px 22px; margin-top:4px;
}
.lecon__intro{font-size:15px; line-height:1.7; color:var(--texte)}
.lecon__points{margin:16px 0 0; padding-left:0; list-style:none}
.lecon__points li{
  font-size:14px; line-height:1.6; color:var(--texte-2);
  padding:7px 0 7px 20px; position:relative;
}
.lecon__points li::before{
  content:""; position:absolute; left:2px; top:15px;
  width:6px; height:6px; border-radius:2px; background:var(--accent);
}
.lecon__exemple{
  margin-top:20px; padding:16px; border-radius:var(--r-s);
  background:var(--surface-2); border:1px solid var(--bord);
}
.lecon__label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--texte-3); font-weight:650; margin-bottom:9px;
}
.lecon__code{
  font-family:var(--mono); font-size:14px; color:var(--accent-fort);
  background:var(--fond); border:1px solid var(--bord-fort); border-radius:var(--r-s);
  padding:11px 13px; white-space:pre-wrap; line-height:1.6;
}
.lecon__fleche{text-align:center; color:var(--texte-3); font-size:11px; padding:7px 0}
.lecon__resultat{
  font-family:var(--mono); font-size:14px; color:var(--texte);
  background:var(--accent-doux); border:1px solid var(--accent); border-radius:var(--r-s);
  padding:11px 13px; white-space:pre-wrap; line-height:1.6;
}
.lecon__commentaire{font-size:13px; color:var(--texte-2); line-height:1.6; margin-top:13px}
.lecon__astuce{
  margin-top:18px; padding:13px 15px; border-left:3px solid var(--ambre);
  background:var(--ambre-doux); border-radius:var(--r-s); font-size:13.5px; line-height:1.6;
}
.rail__sep{height:1px; background:var(--bord); margin:8px 10px; flex:none}
.rail__lien--outil[data-actif="1"]{background:var(--accent-doux); color:var(--accent-fort); font-weight:600}
.voile--lexique{align-items:flex-start; padding-top:8vh}
.lexique{
  background:var(--surface); border:1px solid var(--bord); border-radius:var(--r-l);
  box-shadow:var(--ombre-l); width:100%; max-width:600px; max-height:78vh;
  display:flex; flex-direction:column; padding:20px 22px;
  animation:monte 180ms cubic-bezier(.2,.8,.2,1);
}
.lexique__tete{display:flex; align-items:baseline; gap:10px; margin-bottom:13px}
.lexique__tete h2{flex:1}
.lexique__liste{overflow-y:auto; flex:1; min-height:0; margin-top:2px}
.lexique__groupe{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--texte-3);
  font-weight:650; padding:14px 0 5px; position:sticky; top:0; background:var(--surface);
}
.lexique__groupe:first-child{padding-top:2px}
.lexique__pied{font-size:12.5px; margin-top:12px; padding-top:12px; border-top:1px solid var(--bord)}
a{color:var(--accent); text-decoration:none}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
.mono{font-family:var(--mono); font-size:.92em; letter-spacing:-.01em}
.muet{color:var(--texte-2)}
.tres-muet{color:var(--texte-3)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

/* ── 3. Mise en page ─────────────────────────────────────── */
#app{display:flex; min-height:100%}

.rail{
  width:236px; flex:none; border-right:1px solid var(--bord);
  background:var(--surface); display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.rail__marque{padding:20px 18px 14px; display:flex; align-items:center; gap:10px}
.logo{
  width:28px; height:28px; border-radius:7px; flex:none;
  background:var(--accent); color:var(--sur-accent); display:grid; place-items:center;
  font-family:var(--mono); font-size:13px; font-weight:700;
}
.rail__nom{font-size:15px; font-weight:650; letter-spacing:-.02em}
.rail__nav{padding:6px 10px; display:flex; flex-direction:column; gap:2px}
.rail__lien{
  display:flex; align-items:center; gap:10px; padding:8px 10px;
  border-radius:var(--r-s); color:var(--texte-2); font-size:14px;
  font-weight:500; transition:background var(--t), color var(--t);
}
.rail__lien:hover{background:var(--surface-2); color:var(--texte)}
.rail__lien[aria-current="page"]{background:var(--accent-doux); color:var(--accent-fort); font-weight:600}
.rail__lien svg{width:17px; height:17px; flex:none}
.rail__bas{margin-top:auto; padding:14px 18px; border-top:1px solid var(--bord)}

.principal{flex:1; min-width:0; display:flex; flex-direction:column}
.contenu{width:100%; max-width:920px; margin:0 auto; padding:34px 28px 80px}

.entete{margin-bottom:26px}
.entete__sur{
  font-family:var(--mono); font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--texte-3); margin-bottom:7px;
}
.entete p{color:var(--texte-2); margin-top:6px; max-width:60ch}

/* ── 4. Composants ───────────────────────────────────────── */
.carte{
  background:var(--surface); border:1px solid var(--bord);
  border-radius:var(--r); padding:18px;
}
.carte--action{transition:border-color var(--t), box-shadow var(--t), transform var(--t); text-align:left; width:100%; display:block}
.carte--action:hover{border-color:var(--bord-fort); box-shadow:var(--ombre-l)}
.carte--action:disabled{opacity:.6; cursor:default; transform:none; box-shadow:none; border-color:var(--bord)}
.grille{display:grid; gap:14px}
.grille--2{grid-template-columns:repeat(2,1fr)}
.grille--3{grid-template-columns:repeat(3,1fr)}
.pile{display:flex; flex-direction:column; gap:14px}
.section{margin-top:32px}
.section__titre{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:9px 15px; border-radius:var(--r-s); font-size:14px; font-weight:550;
  border:1px solid var(--bord-fort); background:var(--surface); color:var(--texte);
  transition:background var(--t), border-color var(--t), opacity var(--t);
}
.btn:hover{background:var(--surface-2)}
.btn--fort{background:var(--accent); border-color:var(--accent); color:#fff}
.btn--fort:hover{background:var(--accent-fort); border-color:var(--accent-fort)}
.btn--nu{border-color:transparent; background:none; color:var(--texte-2)}
.btn--nu:hover{background:var(--surface-2); color:var(--texte)}
.btn--danger{color:var(--rouge-texte); border-color:var(--bord-fort)}
.btn--danger:hover{background:var(--rouge-doux)}
.btn:disabled{opacity:.5; cursor:default}
.btn--large{width:100%; padding:12px 16px}

.puce{
  display:inline-flex; align-items:center; gap:5px; padding:2px 8px;
  border-radius:100px; font-size:12px; font-weight:600;
  background:var(--surface-2); color:var(--texte-2);
}
.puce--accent{background:var(--accent-doux); color:var(--accent-fort)}
.puce--ambre{background:var(--ambre-doux); color:var(--ambre-texte)}

/* Signature : la progression s'affiche en cellules de tableur */
.cellules{display:flex; gap:2px}
.cellules span{
  flex:1; height:9px; background:var(--surface-2);
  border:1px solid var(--bord); border-radius:2px;
  transition:background var(--t), border-color var(--t);
}
.cellules span.pleine{background:var(--accent); border-color:var(--accent)}
.cellules span.partielle{background:var(--accent-doux); border-color:var(--accent)}
.cellules--fine span{height:6px}

.competence{padding:13px 0; border-bottom:1px solid var(--bord)}
.competence:last-child{border-bottom:0}
.competence__tete{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:8px}
.competence__nom{font-size:14px; font-weight:600}
.competence__val{font-family:var(--mono); font-size:13px; color:var(--texte-2)}
.competence__desc{font-size:12.5px; color:var(--texte-3); margin-top:7px}

.stat{padding:14px 16px}
.stat__val{font-size:24px; font-weight:680; letter-spacing:-.03em; line-height:1.1}
.stat__lib{font-size:12.5px; color:var(--texte-2); margin-top:3px}

.vide{
  text-align:center; padding:44px 24px; border:1px dashed var(--bord-fort);
  border-radius:var(--r); color:var(--texte-2);
  background-image:
    linear-gradient(to right, var(--bord) 1px, transparent 1px),
    linear-gradient(to bottom, var(--bord) 1px, transparent 1px);
  background-size:26px 26px; background-position:-1px -1px;
}
[data-theme="clair"] .vide{background-color:rgba(255,255,255,.72); background-blend-mode:normal}
.vide__boite{
  display:inline-block; background:var(--surface); padding:22px 26px;
  border:1px solid var(--bord); border-radius:var(--r);
}
.vide h3{margin-bottom:6px}
.vide p{font-size:13.5px; max-width:42ch; margin:0 auto}

.toasts{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; align-items:center}
.toast{
  background:var(--texte); color:var(--fond); padding:10px 16px;
  border-radius:100px; font-size:13.5px; font-weight:550; box-shadow:var(--ombre-l);
  animation:monte 200ms cubic-bezier(.2,.8,.2,1);
}
.toast--accent{background:var(--accent); color:var(--sur-accent)}
@keyframes monte{from{opacity:0; transform:translateY(8px)}}

.voile{position:fixed; inset:0; background:rgba(20,20,18,.45); z-index:50; display:grid; place-items:center; padding:20px; animation:fondu 140ms ease}
.modale{
  background:var(--surface); border-radius:var(--r-l); box-shadow:var(--ombre-l);
  width:100%; max-width:440px; padding:24px; animation:monte 180ms cubic-bezier(.2,.8,.2,1);
}
.modale h2{margin-bottom:8px}
.modale__actions{display:flex; gap:8px; justify-content:flex-end; margin-top:20px}
@keyframes fondu{from{opacity:0}}

.champ{display:block; margin-top:14px}
.champ__lib{display:block; font-size:13px; font-weight:600; margin-bottom:6px}
.champ input, .champ select{
  width:100%; padding:9px 11px; border-radius:var(--r-s);
  border:1px solid var(--champ-bord); background:var(--fond);
}
.options{display:flex; flex-direction:column; gap:8px; margin-top:6px}
.option{
  display:flex; gap:10px; align-items:flex-start; padding:11px 13px;
  border:1px solid var(--bord); border-radius:var(--r-s); cursor:pointer;
  transition:border-color var(--t), background var(--t);
}
.option:hover{border-color:var(--bord-fort)}
.option[data-choisi="1"]{border-color:var(--accent); background:var(--accent-doux)}
.option input{margin-top:3px; accent-color:var(--accent)}
.option b{display:block; font-size:14px; font-weight:600}
.option span{font-size:12.5px; color:var(--texte-2)}

.ligne-reglage{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 0; border-bottom:1px solid var(--bord)}
.ligne-reglage:last-child{border-bottom:0}
.ligne-reglage p{font-size:12.5px; color:var(--texte-2); margin-top:2px}
.segment{display:flex; flex-wrap:wrap; background:var(--surface-2); border-radius:var(--r-s); padding:2px; gap:2px}
.segment button{padding:5px 12px; border-radius:5px; font-size:13px; font-weight:550; color:var(--texte-2)}
.segment button[aria-pressed="true"]{background:var(--surface); color:var(--texte); box-shadow:var(--ombre)}

.certifs{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.certif{padding:14px; border-radius:var(--r); border:1px solid var(--bord); background:var(--surface); opacity:.5}
.certif[data-obtenue="1"]{opacity:1; border-color:var(--accent); background:var(--accent-doux)}
.certif__ico{font-size:19px; line-height:1}
.certif b{display:block; font-size:13.5px; font-weight:620; margin-top:8px}
.certif span{font-size:12px; color:var(--texte-2)}

.vue{animation:apparait 220ms cubic-bezier(.2,.8,.2,1)}
@keyframes apparait{from{opacity:0; transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

/* ── 5b. Tableur ─────────────────────────────────────────── */
.tableur{border:1px solid var(--bord); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.tableur__barre{display:flex; align-items:stretch; border-bottom:1px solid var(--bord)}
.tableur__ref{
  width:80px; flex:none; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:var(--fs-2); font-weight:650; color:var(--texte-2);
  border-right:1px solid var(--bord); background:var(--surface-2);
}
.tableur__fx{
  width:32px; flex:none; display:grid; place-items:center; border-right:1px solid var(--bord);
  font-family:var(--mono); font-size:12px; font-style:italic; color:var(--texte-3);
}
.tableur__formule{
  flex:1; min-width:0; border:0; background:none; padding:10px 12px;
  font-family:var(--mono); font-size:var(--fs-3);
}
.tableur__formule:focus{outline:none; background:var(--accent-doux); box-shadow:inset 0 0 0 2px var(--focus)}

.tableur__outils{
  display:flex; gap:3px; align-items:center; flex-wrap:wrap;
  padding:6px 8px; border-bottom:1px solid var(--bord); background:var(--surface-2);
}
.outil{padding:5px 10px; border-radius:var(--r-s); font-size:12.5px; font-weight:550; color:var(--texte-2); transition:background var(--t), color var(--t)}
.outil:hover:not(:disabled){background:var(--surface); color:var(--texte)}
.outil:disabled{opacity:.35; cursor:default}
.outil[aria-pressed="true"]{background:var(--surface); color:var(--accent-fort); box-shadow:var(--ombre)}
.outil--sep{width:1px; height:17px; background:var(--bord-fort); margin:0 4px; padding:0}

.tableur__zone{overflow:auto; max-height:60vh; outline:none}
.tableur__zone:focus-visible{outline:none; box-shadow:inset 0 0 0 2px var(--focus)}
.feuille{display:grid; width:max-content; font-size:var(--fs-3); user-select:none}
.tableur__barre,.tableur__outils,.tableur__pied{user-select:none}
.tableur__formule{user-select:text}
.rangee{display:contents}
.feuille > *, .rangee > *{
  height:30px; min-width:0; background:var(--surface);
  border-right:1px solid var(--bord); border-bottom:1px solid var(--bord);
}
.enTete{
  display:flex; align-items:center; justify-content:center; background:var(--surface-2);
  font-family:var(--mono); font-size:var(--fs-1); font-weight:650; color:var(--texte-3);
}
.enTete--col{position:sticky; top:0; z-index:3}
.enTete--ligne{position:sticky; left:0; z-index:3}
.enTete--coin{position:sticky; top:0; left:0; z-index:5}
.enTete--vise{color:var(--accent-fort); background:var(--accent-doux)}
.cellule{position:relative; cursor:cell}
.cel{display:block; padding:4px 8px; line-height:21px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cel--nombre{text-align:right; padding-right:10px; font-variant-numeric:tabular-nums}
.cel--titre{font-weight:650}
.cellule.verrou{background:var(--surface-2)}
.cellule.propage{box-shadow:inset 2px 0 0 var(--accent)}
.cellule.propage .cel{color:var(--texte-2)}
.cellule.selection{background:var(--selection); box-shadow:inset 0 0 0 1px var(--selection-ligne)}
.cellule.actif{box-shadow:inset 0 0 0 2px var(--focus), inset 0 0 0 3px var(--surface); z-index:2}
.cellule.erreur .cel{color:var(--rouge-texte); font-family:var(--mono); font-size:12.5px; font-weight:600}
.cellule.erreur:not(.selection){background:var(--rouge-doux)}
.cellule.attente .cel{color:var(--ambre-texte); font-family:var(--mono); font-size:12.5px}
.cellule.source-copie{outline:1px dashed var(--focus); outline-offset:-2px}
.cellule.ref-visee{outline:2px dashed var(--focus); outline-offset:-2px; background:var(--accent-doux)}
.cellule[data-mfc="vert"]{background:var(--ok-doux)}
.cellule[data-mfc="vert"] .cel{color:var(--ok-texte); font-weight:600}
.cellule[data-mfc="ambre"]{background:var(--ambre-doux)}
.cellule[data-mfc="ambre"] .cel{color:var(--ambre-texte); font-weight:600}
.cellule[data-mfc="rouge"]{background:var(--rouge-doux)}
.cellule[data-mfc="rouge"] .cel{color:var(--rouge-texte); font-weight:600}
.cellule[data-mfc="gras"] .cel{font-weight:700}
.mfc-barre{
  position:absolute; left:1px; top:3px; bottom:3px; z-index:0;
  background:var(--accent-doux); border:1px solid var(--accent); border-radius:2px;
}
.cellule .cel{position:relative; z-index:1}
.regle{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:8px 0; font-size:13px; border-top:1px solid var(--bord);
}
.regle__texte{flex:1; font-family:var(--mono); font-size:12.5px}
.regle__pastille{width:11px; height:11px; border-radius:3px; flex:none; border:1px solid var(--bord-fort)}
.tcd{margin-top:14px; overflow-x:auto}
.tcd table{border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums}
.tcd th,.tcd td{border:1px solid var(--bord); padding:6px 13px; text-align:right; white-space:nowrap}
.tcd thead th{background:var(--surface-2); font-size:11.5px; color:var(--texte-3); font-weight:650; text-align:center}
.tcd .tcd__cle{text-align:left; color:var(--texte); font-weight:600; background:var(--surface-2)}
.tcd .tcd__total{font-weight:700; background:var(--surface-2)}
.tcd__vide{font-size:13px; color:var(--texte-3); padding:10px 0}
.graph{margin-top:14px}
.graph svg{width:100%; height:auto; display:block}
.graph text{font-family:var(--sans); font-size:11px; fill:var(--texte-2)}
.graph text.graph__val{fill:var(--texte); font-weight:650; font-size:11.5px}
.graph .graph__axe{stroke:var(--bord-fort); stroke-width:1}
.graph .graph__grille{stroke:var(--bord); stroke-width:1; stroke-dasharray:3 3}
.graph__legende{display:flex; flex-wrap:wrap; gap:7px 16px; margin-top:10px; font-size:12.5px; color:var(--texte-2)}
.graph__cle{display:flex; align-items:center; gap:6px}
.graph__pastille{width:10px; height:10px; border-radius:2px; flex:none}
.poignee{
  position:absolute; right:-4px; bottom:-4px; width:8px; height:8px; z-index:4;
  background:var(--focus); border:1px solid var(--surface); border-radius:1px; cursor:crosshair;
}
.editeur{
  width:100%; height:29px; border:0; padding:4px 7px; background:var(--surface);
  font-family:var(--mono); font-size:var(--fs-3); outline:2px solid var(--focus); outline-offset:-2px;
}
.tableur__pied{
  display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  padding:7px 11px; border-top:1px solid var(--bord); background:var(--surface-2);
  font-size:12px; color:var(--texte-2);
}
.tableur__stats{display:flex; gap:14px; font-family:var(--mono); font-size:12px}
.aide-fonction{
  padding:8px 12px; border-top:1px solid var(--bord); background:var(--accent-doux);
  font-family:var(--mono); font-size:12px; color:var(--accent-fort);
}

/* ── 5c. Exercices ───────────────────────────────────────── */
.serie{display:flex; align-items:center; gap:14px; margin-bottom:22px}
.serie__cellules{flex:1}
.serie__compte{font-family:var(--mono); font-size:12.5px; color:var(--texte-2); flex:none}
.exo__meta{display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
.exo__question{font-size:18px; font-weight:620; letter-spacing:-.015em; line-height:1.4}
.exo__consigne{color:var(--texte-2); font-size:13.5px; margin-top:7px}
.extrait{
  font-family:var(--mono); font-size:13.5px; background:var(--surface-2); color:var(--texte);
  border:1px solid var(--bord); border-radius:var(--r-s); padding:11px 13px;
  margin-top:16px; white-space:pre-wrap; overflow-x:auto;
}
.apercu{border-collapse:collapse; font-size:13px; margin-top:16px; font-family:var(--mono)}
.apercu th,.apercu td{border:1px solid var(--bord); padding:5px 11px; text-align:left; white-space:nowrap}
.apercu th{background:var(--surface-2); font-size:11.5px; color:var(--texte-3); font-weight:650}
.choix{display:flex; flex-direction:column; gap:8px; margin-top:18px}
.choix button{
  display:flex; gap:11px; align-items:baseline; text-align:left; font-size:14px;
  padding:12px 14px; border:1px solid var(--bord); border-radius:var(--r-s); background:var(--surface);
  transition:border-color var(--t), background var(--t);
}
.choix button:hover:not(:disabled){border-color:var(--accent); background:var(--accent-doux)}
.choix button:disabled{cursor:default}
.choix .lettre{font-family:var(--mono); font-size:12px; color:var(--texte-3); flex:none}
.choix button[data-etat="juste"]{border-color:var(--accent); background:var(--accent-doux)}
.choix button[data-etat="faux"]{border-color:var(--rouge); background:var(--rouge-doux)}
.saisie-reponse{
  width:100%; margin-top:18px; padding:12px 14px; border:1px solid var(--champ-bord);
  border-radius:var(--r-s); font-family:var(--mono); font-size:14px; background:var(--fond);
}
.retour{margin-top:20px; padding:16px; border:1px solid var(--bord); border-radius:var(--r)}
.retour--juste{border-color:var(--accent); background:var(--accent-doux)}
.retour--faux{border-color:var(--rouge); background:var(--rouge-doux)}
.retour__titre{display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:650}
.retour p{font-size:13.5px; margin-top:9px; line-height:1.55}
.retour__usage{
  margin-top:13px; padding-top:12px; border-top:1px solid var(--bord-fort); font-size:13px;
}
.retour__usage b{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.07em; opacity:.75; margin-bottom:4px}
.bilan__ligne{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:10px 0; border-bottom:1px solid var(--bord); font-size:14px}
.bilan__ligne:last-child{border-bottom:0}
.indices{margin-top:20px; display:flex; flex-direction:column; gap:8px; align-items:flex-start}
.indices__btn{align-self:flex-start; font-size:13px; padding:7px 12px; border:1px dashed var(--bord-fort)}
.indices__btn:hover:not(:disabled){border-style:dashed; border-color:var(--accent); color:var(--accent-fort)}
.indices__btn--solution{color:var(--ambre-texte); border-color:var(--ambre)}
.indice{
  width:100%; padding:11px 13px; border-radius:var(--r-s);
  background:var(--surface-2); border-left:3px solid var(--bord-fort); font-size:13.5px;
  animation:monte 180ms cubic-bezier(.2,.8,.2,1);
}
.indice b{
  display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--texte-3); margin-bottom:4px;
}
.indice--solution{background:var(--ambre-doux); border-left-color:var(--ambre)}
.indice--solution b{color:var(--ambre-texte)}
.resume__ligne{display:flex; gap:12px; align-items:baseline; padding:5px 0; font-size:13px; flex-wrap:wrap}
.resume__point{display:flex; gap:10px; align-items:baseline; padding:7px 0; font-size:13.5px; line-height:1.5}
.resume__point + .resume__point{border-top:1px solid var(--bord)}
.resume__puce{color:var(--accent); flex:none; font-family:var(--mono)}

/* ── 5d. Missions ────────────────────────────────────────── */
.contexte{
  border-left:3px solid var(--accent); background:var(--accent-doux);
  padding:15px 17px; border-radius:var(--r-s);
}
.contexte b{
  display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--accent-fort); margin-bottom:4px;
}
.contexte p{font-size:13.5px; line-height:1.55; color:var(--texte)}
.etape{display:flex; gap:11px; align-items:baseline; padding:9px 0; font-size:13.5px; color:var(--texte-3)}
.etape + .etape{border-top:1px solid var(--bord)}
.etape__marque{
  flex:none; width:19px; height:19px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--mono); font-size:10.5px; border:1px solid var(--bord-fort); align-self:center;
}
.etape[data-etat="faite"]{color:var(--texte-2)}
.etape[data-etat="faite"] .etape__marque{background:var(--accent); border-color:var(--accent); color:var(--sur-accent)}
.etape[data-etat="courante"]{color:var(--texte); font-weight:600}
.etape[data-etat="courante"] .etape__marque{border-color:var(--accent); color:var(--accent-fort)}
.etoiles{display:inline-flex; gap:2px; font-size:14px; color:var(--bord-fort)}
.etoiles .pleine{color:var(--accent)}
.atelier{
  margin-top:16px; border:1px solid var(--bord); border-radius:var(--r);
  background:var(--surface); padding:14px 16px;
}
.atelier__titre{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--texte-3); font-weight:650; margin-bottom:12px;
}
.atelier__ligne{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
.atelier__lib{font-size:13px; color:var(--texte-2); min-width:66px}
.atelier select{
  padding:7px 9px; border:1px solid var(--champ-bord); border-radius:var(--r-s);
  background:var(--fond); font-size:13px;
}
.atelier .btn{padding:7px 12px; font-size:13px}
.atelier__valeurs{
  display:flex; flex-wrap:wrap; gap:6px 14px; padding:11px 0 4px;
  border-top:1px solid var(--bord); margin-top:4px;
}
.atelier__valeur{display:flex; gap:6px; align-items:center; font-size:13px; cursor:pointer}
.atelier__valeur input{accent-color:var(--accent)}
.atelier__etat{
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  padding-top:11px; margin-top:8px; border-top:1px solid var(--bord);
  font-size:12.5px; color:var(--texte-2);
}

/* ── 6. Responsive ───────────────────────────────────────── */
@media (max-width:820px){
  #app{flex-direction:column}
  .rail{
    position:fixed; bottom:0; top:auto; left:0; right:0; width:auto; height:auto;
    flex-direction:row; border-right:0; border-top:1px solid var(--bord); z-index:40;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .rail__marque,.rail__bas{display:none}
  .rail__nav{flex-direction:row; width:100%; padding:6px; justify-content:space-around}
  .rail__lien{flex-direction:column; gap:3px; font-size:10.5px; padding:6px 4px; flex:1; justify-content:center}
  .contenu{padding:22px 18px 96px}
  .grille--2,.grille--3{grid-template-columns:1fr}
  h1{font-size:23px}
  .rail__lien span{font-size:10px}
  .tableur__zone{max-height:52vh}
  .tableur__ref{width:62px}
  .rail__sep{display:none}
  .rail__lien span{font-size:9.5px}
  .voile--lexique{padding:0}
  .lexique{max-width:none; max-height:100vh; height:100vh; border-radius:0; border:0}
}

/* Formes généreuses, reliefs francs, aucun flou : l'application doit avoir l'air
   accueillante plutôt que professionnelle. La grille du tableur reste sobre,
   parce que c'est le seul endroit où la densité prime sur le style. */
.carte,.lecon,.retour,.atelier,.vide__boite{
  border-width:2px; box-shadow:var(--ombre-l);
}
.btn{
  border:2px solid var(--bord-fort); border-radius:var(--r-s);
  box-shadow:0 3px 0 var(--bord-fort); font-weight:650;
  transition:transform var(--t), box-shadow var(--t), background var(--t);
}
.btn:hover{transform:none; box-shadow:0 3px 0 var(--bord-fort)}
.btn:active{transform:translateY(3px); box-shadow:none}
.btn--plein,.btn--fort{
  background:var(--accent); color:#3A2E21; border-color:var(--accent-fort);
  box-shadow:0 3px 0 var(--accent-fort);
}
.btn--plein:hover,.btn--fort:hover{transform:none; box-shadow:0 3px 0 var(--accent-fort)}
.btn--plein:active,.btn--fort:active{transform:translateY(3px); box-shadow:none}
.btn--nu{box-shadow:none; border-color:transparent}
.btn--nu:hover{transform:none; box-shadow:none; background:var(--surface-2)}
.puce{border:1.5px solid var(--bord-fort); font-weight:650}
h1{letter-spacing:-.01em}
.entete__sur{color:var(--accent-fort); font-weight:700}

/* Illustration d'ambiance : un paysage simple, dessiné en blocs. */
.paysage{
  width:100%; height:118px; display:block; border-radius:var(--r) var(--r) 0 0;
  image-rendering:pixelated;
}
.accueil__banniere{
  border:2px solid var(--bord-fort); border-radius:var(--r);
  overflow:hidden; box-shadow:var(--ombre-l); margin-bottom:20px; background:var(--ciel);
}
.accueil__banniere .accueil__mot{padding:16px 18px; background:var(--surface)}
.vignette{width:17px; height:17px; display:block; margin:0 auto 3px; image-rendering:pixelated}
.chapitre__num{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-width:46px; padding:7px 6px; border:2px solid var(--bord-fort); background:var(--surface-2);
}

/* ── 7. Fondations ───────────────────────────────────────────
   Jetons ajoutés par la refonte : échelles typographique et d'espacement, mouvement,
   rôles de couleur (focus, texte sur accent, champs, réussite). Les règles qui les
   utilisent sont à leur place dans les sections ci-dessus. */
:root{
  /* Sélection de cellules : assez marquée pour qu'une plage se voie d'un coup d'œil */
  --selection:#FFD9A0; --selection-ligne:rgba(154,84,8,.4);
  /* Échelle typographique */
  --fs-1:12px; --fs-2:13px; --fs-3:14px; --fs-4:15px; --fs-5:18px; --fs-6:22px; --fs-7:26px;
  --lh-serre:1.25; --lh-texte:1.55; --lh-lecture:1.7;
  /* Espacements, pas de 4 */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  /* Mouvement : sortie rapide, aucun dépassement */
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-in-out:cubic-bezier(.77,0,.175,1);
  --dur-1:100ms; --dur-2:160ms; --dur-3:220ms;
  /* Rôles de couleur : contrastes ≥ 4,5:1 pour le texte, ≥ 3:1 pour les bordures et anneaux */
  --focus:var(--accent-fort);
  --sur-accent:#3A2E21;
  --ambre-texte:#9C4A0C;
  --rouge-texte:#B03343;
  --champ-bord:#9C8260;
  /* Réussite : distincte de l'accent, qui sert aussi à la sélection */
  --ok:#25793F; --ok-doux:#E2F3DF; --ok-texte:#1F6B3A; --sur-ok:#FFFFFF;
}
[data-theme="sombre"]{
  --selection:#5A4478; --selection-ligne:rgba(255,208,137,.45);
  --ambre-texte:var(--ambre);
  --rouge-texte:var(--rouge);
  --champ-bord:#9686B4;
  --ok:#6FCF8A; --ok-doux:#22382B; --ok-texte:#A6E3B0; --sur-ok:#1B1626;
}

/* ── 8. Retour de validation ─────────────────────────────────
   Un seul composant (carteRetour) pour exercices, chapitres, missions et fiches.
   Le seul mouvement est l'apparition de la carte, déclenchée par data-frais :
   posé par le JS uniquement au rendu qui suit une réponse, jamais au montage. */
:root{--sur-rouge:#FFFFFF}
[data-theme="sombre"]{--sur-rouge:#1B1626}

.retour{padding:0; margin-top:var(--sp-5); overflow:hidden}
.retour--juste{border-color:var(--ok); background:var(--ok-doux)}
.retour--faux{border-color:var(--rouge); background:var(--rouge-doux)}
.retour__tete{display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) var(--sp-4)}
.retour__icone{
  width:28px; height:28px; border-radius:50%; flex:none; display:grid; place-items:center;
  font-size:var(--fs-3); font-weight:700; line-height:1;
}
.retour--juste .retour__icone{background:var(--ok); color:var(--sur-ok)}
.retour--faux .retour__icone{background:var(--rouge-texte); color:var(--sur-rouge)}
.retour__titre{flex:1; font-size:var(--fs-4); font-weight:700}
.retour--juste .retour__titre{color:var(--ok-texte)}
.retour--faux .retour__titre{color:var(--rouge-texte)}
.retour__xp{
  flex:none; font-family:var(--mono); font-size:var(--fs-2); font-weight:700;
  padding:2px 11px; border-radius:100px; background:var(--ok); color:var(--sur-ok);
}
.retour__corps{padding:0 var(--sp-4) var(--sp-4)}
.retour__corps > :first-child{margin-top:0}
.retour p{font-size:var(--fs-3); line-height:var(--lh-texte); margin-top:var(--sp-2)}
.retour p.retour__note{font-size:var(--fs-2); color:var(--texte-2)}
.retour__solution{
  margin-top:var(--sp-3); padding:var(--sp-2) var(--sp-3); background:var(--surface);
  border:1px solid var(--bord-fort); border-radius:var(--r-s);
}
.retour__etiquette{
  display:block; font-size:var(--fs-1); font-weight:650; color:var(--texte-2); margin-bottom:2px;
}
.retour__solution code{font-family:var(--mono); font-size:var(--fs-3); color:var(--texte); user-select:all; overflow-wrap:anywhere}
.retour__progres{margin-top:var(--sp-3); padding-top:var(--sp-3); border-top:1px solid var(--bord-fort)}
.retour__progres p{margin-top:0}
.retour__ligne{
  display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3);
  font-size:var(--fs-2); color:var(--texte);
}
.retour__ligne + .retour__ligne{margin-top:var(--sp-2)}
.retour__valide{justify-content:flex-start; font-weight:650; color:var(--ok-texte)}
.delta{color:var(--ok-texte); font-weight:700}
.pips{display:inline-flex; gap:5px}
.pips span{width:11px; height:11px; border-radius:50%; border:2px solid var(--ok); background:transparent}
.pips span.plein{background:var(--ok)}

.code-err{
  font-family:var(--mono); font-size:.92em; font-weight:700; color:var(--rouge-texte);
  background:var(--surface); border:1px solid var(--rouge); border-radius:5px;
  padding:0 6px; white-space:nowrap;
}
.erreur-info{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:var(--sp-1) var(--sp-3);
  padding:var(--sp-2) var(--sp-3); border-top:2px solid var(--rouge); background:var(--rouge-doux);
  font-size:var(--fs-2); line-height:var(--lh-texte); color:var(--texte);
}
.erreur-info[hidden]{display:none}
.erreur-info__ref{font-family:var(--mono); font-weight:700; color:var(--texte-2)}

/* QCM corrigé : le vert est réservé à la réussite, et un symbole double la couleur. */
.choix button[data-etat="juste"]{border-color:var(--ok); background:var(--ok-doux)}
.choix button[data-etat="faux"]{border-color:var(--rouge)}
.choix button[data-etat]::after{margin-left:auto; flex:none; font-weight:700}
.choix button[data-etat="juste"]::after{content:"✓"; color:var(--ok-texte)}
.choix button[data-etat="faux"]::after{content:"✕"; color:var(--rouge-texte)}

/* Essai libre après un échec : visuellement rattaché au retour, mais net sur ce qui compte ou non. */
.essai{margin-top:var(--sp-4)}
.essai__titre{font-family:var(--mono); font-size:var(--fs-1); font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--texte-2); margin-bottom:var(--sp-2)}
.essai__note{font-size:var(--fs-2); margin-top:var(--sp-2)}
.essai__verdict{margin-top:var(--sp-3)}
.essai__verdict .btn{margin-top:var(--sp-3)}
.essai .retour{margin-top:0}
.retour--essai{border-style:dashed}

.erreur-info__voir{display:inline-flex; flex-wrap:wrap; align-items:center; gap:var(--sp-2); font-size:var(--fs-1); color:var(--texte-2)}
.erreur-info__fn{
  font-family:var(--mono); font-size:var(--fs-1); font-weight:700; color:var(--texte); background:var(--surface);
  border:2px solid var(--texte); border-radius:999px; padding:2px 12px; cursor:pointer;
}
.erreur-info__fn:hover{background:var(--surface-2)}
.accueil__revision{display:flex; align-items:center; gap:var(--sp-4); flex-wrap:wrap; justify-content:flex-end}
.accueil__revision .btn{padding:6px 14px; font-size:var(--fs-2)}

@keyframes retour-entree{from{opacity:0; transform:translateY(4px)}}
.retour[data-frais="1"]{animation:retour-entree var(--dur-2) var(--ease-out) both}

/* ── 9. Progression ──────────────────────────────────────────
   La maîtrise se lit en cellules ; ce qui s'efface se voit en pointillés ;
   la série sans indice se lit en trois points. */
.cellules span.erodee{background:transparent; border:1px dashed var(--ambre-texte)}
.cellules--ok span.pleine{background:var(--ok); border-color:var(--ok)}
@keyframes cellule-gagne{from{background:var(--surface-2); transform:scaleY(.55)}}
.cellules span.gagne{animation:cellule-gagne var(--dur-3) var(--ease-out) both}
.competence__meta{
  display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-2) var(--sp-4);
  margin-top:var(--sp-2); font-size:var(--fs-1); color:var(--texte-2);
}
.competence__serie{display:inline-flex; align-items:center; gap:var(--sp-2)}
.puce--ok{background:var(--ok-doux); color:var(--ok-texte); border-color:var(--ok)}
.puce--erosion{background:var(--ambre-doux); color:var(--ambre-texte); border-color:var(--ambre-texte)}
.competence__reprise{margin-left:auto; padding:4px 12px; font-size:var(--fs-1)}

.bilan-hero{
  text-align:center; padding:var(--sp-6) var(--sp-4); margin-bottom:var(--sp-4);
  background:var(--surface); border:2px solid var(--bord); border-radius:var(--r); box-shadow:var(--ombre-l);
}
.bilan-hero h1{margin-bottom:var(--sp-2)}
.bilan-hero p{color:var(--texte-2); max-width:52ch; margin:0 auto}
.bilan-hero__chiffres{display:flex; justify-content:center; gap:var(--sp-5); flex-wrap:wrap; margin-top:var(--sp-4)}
.bilan-hero__chiffre b{display:block; font-size:var(--fs-6); font-weight:700; letter-spacing:-.02em; line-height:1.1}
.bilan-hero__chiffre span{font-size:var(--fs-1); color:var(--texte-2)}
.etoiles--grandes{font-size:44px; line-height:1; gap:var(--sp-2); margin-bottom:var(--sp-3)}
.etoiles--grandes .pleine{color:var(--accent)}
@keyframes etoile-allume{from{opacity:0; transform:scale(.8)}}
.etoiles--grandes[data-frais="1"] .pleine{animation:etoile-allume var(--dur-3) var(--ease-out) both; animation-delay:calc(var(--i) * 90ms)}
.bilan__delta{font-family:var(--mono); font-size:var(--fs-2); font-weight:700; color:var(--ok-texte)}

/* ── 10. Graphiques et illustrations ─────────────────────────
   Statiques : un graphique est reconstruit à chaque affichage de l'atelier,
   une animation d'entrée se rejouerait donc sans que rien n'ait changé. */
.graph text{font-size:var(--fs-1)}
.graph text.graph__val{font-size:var(--fs-1)}
.graph rect.graph__barre{stroke:var(--texte-3); stroke-width:1}
.graph__pastille{border:1px solid var(--texte-3)}
.graph__legende{font-size:var(--fs-2)}

/* ── 11. Audit : navigation, mouvement, plateforme ───────── */
:root{color-scheme:light}
[data-theme="sombre"]{color-scheme:dark}
button,a,input,select,summary{touch-action:manipulation}
h1,h2,h3{text-wrap:balance}
.voile{overscroll-behavior:contain}
.saut{
  position:absolute; left:var(--sp-3); top:-64px; z-index:100; padding:var(--sp-2) var(--sp-4);
  background:var(--surface); color:var(--texte); border:2px solid var(--focus);
  border-radius:var(--r-s); font-weight:650;
}
.saut:focus{top:var(--sp-3)}
.contenu:focus-visible{outline:none}
/* Texte d'accent lisible : l'orange vif sert aux fonds et aux remplissages, pas au texte courant. */
a{color:var(--accent-fort)}
a:hover{text-decoration:underline}
.chapitre__num,.resume__puce{color:var(--accent-fort)}
:root{--etoile:#B8650A}
[data-theme="sombre"]{--etoile:var(--accent)}
.etoiles .pleine,.etoiles--grandes .pleine{color:var(--etoile)}
/* Pas de relief animé au survol (boutons, cartes, chapitres) : la pression (:active) reste le seul retour de geste. */
[data-theme="sombre"] .paysage{filter:brightness(.7) saturate(.85)}
</style>

/* ══ 2b. PACKS (extensions de contenu) ═════════════════════ */
/** Un pack ajoute des exercices et des missions sans jamais toucher au moteur.
 *  Le contenu livré d'origine constitue le pack « socle ». */
const Packs = {
  liste: [{ id: "socle", nom: "Socle Excel", desc: "Le parcours complet, du débutant à l'expert." }],

  ajouter(def) {
    if (!def || !def.id) return false;
    if (Packs.liste.some(p => p.id === def.id)) { console.warn("Pack déjà enregistré :", def.id); return false; }
    Packs.liste.push({ id: def.id, nom: def.nom || def.id, desc: def.desc || "" });
    (def.exercices || []).forEach(e => CONTENU.exercices.push({ ...e, pack: def.id }));
    (def.missions || []).forEach(m => CONTENU.missions.push({ ...m, pack: def.id }));
    (def.competences || []).forEach(c => {
      if (!CONTENU.competences.some(x => x.id === c.id)) CONTENU.competences.push({ actif: true, ...c, pack: def.id });
    });
    return true;
  },

  /** Rattache au socle tout contenu livré sans pack déclaré. */
  normaliser() {
    CONTENU.exercices.forEach(e => { if (!e.pack) e.pack = "socle"; });
    CONTENU.missions.forEach(m => { if (!m.pack) m.pack = "socle"; });
    CONTENU.competences.forEach(c => { if (!c.pack) c.pack = "socle"; });
  },

  compter(id) {
    return {
      exercices: CONTENU.exercices.filter(e => e.pack === id).length,
      missions: CONTENU.missions.filter(m => m.pack === id).length
    };
  },

  actif(id) { return !(Store.etat.reglages.packsDesactives || []).includes(id); },

  basculer(id) {
    Store.modifier(e => {
      const off = e.reglages.packsDesactives || (e.reglages.packsDesactives = []);
      const i = off.indexOf(id);
      if (i === -1) off.push(id); else off.splice(i, 1);
    });
  }
};

/* ══ 3. STORE (persistance + versionnage) ═══════════════════ */
const Store = (() => {
  const aujourdhui = () => new Date().toISOString().slice(0, 10);

  function etatInitial() {
    const competences = {};
    CONTENU.competences.forEach(c => {
      competences[c.id] = { maitrise: 0, tentatives: 0, reussites: 0, derniereActivite: null };
    });
    return {
      schema: CONFIG.schema,
      creeLe: new Date().toISOString(),
      profil: { prenom: "", niveauDeclare: null, onboardingFait: false },
      xp: 0,
      xpParJour: {},                          // "2026-08-04": 40
      serie: { jours: 0, dernierJour: null },
      competences,
      exercices: {},                          // id → { tentatives, reussites, derniereReussite }
      missions: {},                           // id → { statut, etoiles, indicesUtilises, meilleurScore }
      certifications: {},                     // id → { obtenueLe }
      dernierExport: null,
      fiches: {},
      stats: { seriesParfaites: 0 },
      reglages: { theme: "clair", niveauContenu: null, packsDesactives: [] }
    };
  }

  // Migrations futures : { 2: etat => {...} }
  const MIGRATIONS = {};

  function migrer(etat) {
    while (etat.schema < CONFIG.schema) {
      const suivante = etat.schema + 1;
      if (MIGRATIONS[suivante]) MIGRATIONS[suivante](etat);
      etat.schema = suivante;
    }
    // Réconciliation : nouvelles compétences ajoutées après coup
    CONTENU.competences.forEach(c => {
      if (!etat.competences[c.id]) {
        etat.competences[c.id] = { maitrise: 0, tentatives: 0, reussites: 0, derniereActivite: null };
      }
    });
    return etat;
  }

  let etat = etatInitial();
  let minuteur = null;

  function charger() {
    try {
      const brut = localStorage.getItem(CONFIG.cle);
      if (brut) etat = migrer({ ...etatInitial(), ...JSON.parse(brut) });
    } catch (err) {
      console.warn("Progression illisible, réinitialisation.", err);
    }
    API.etat = etat;
    return etat;
  }

  function sauver() {
    clearTimeout(minuteur);
    minuteur = setTimeout(() => {
      try { localStorage.setItem(CONFIG.cle, JSON.stringify(etat)); }
      catch (err) { Toast.afficher("Sauvegarde impossible : espace de stockage plein.", "erreur"); }
    }, 180);
  }

  const API = {
    etat,
    aujourdhui,
    charger, sauver,
    modifier(fn) { fn(etat); sauver(); Bus.emettre("etat:change"); },
    reinitialiser() {
      etat = etatInitial(); API.etat = etat;
      localStorage.removeItem(CONFIG.cle);
      Bus.emettre("etat:change");
    },
    exporter() {
      etat.dernierExport = new Date().toISOString();
      sauver();
      const blob = new Blob([JSON.stringify(etat, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `classer-progression-${aujourdhui()}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    },
    importer(texte) {
      const donnees = JSON.parse(texte);
      if (typeof donnees.xp !== "number" || !donnees.competences) throw new Error("format");
      etat = migrer({ ...etatInitial(), ...donnees });
      API.etat = etat;
      sauver(); Bus.emettre("etat:change");
    }
  };
  return API;
})();

/* ══ 4. PROGRESSION (XP, niveaux, maîtrise, certifications) ═ */
const Progression = (() => {
  const borne = (v, min, max) => Math.max(min, Math.min(max, v));

  function niveau() {
    const xp = Store.etat.xp;
    let n = 1;
    while (xp >= CONFIG.seuilCumul(n)) n++;
    const bas = CONFIG.seuilCumul(n - 1);
    const haut = CONFIG.seuilCumul(n);
    const titre = [...CONFIG.titres].reverse().find(t => n >= t.min).nom;
    return { niveau: n, titre, xpDansNiveau: xp - bas, xpRequis: haut - bas,
             pourcent: Math.round(((xp - bas) / (haut - bas)) * 100) };
  }

  function joursDepuis(iso) {
    if (!iso) return Infinity;
    return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  }

  /** Maîtrise brute (mémorisée) et effective (avec décroissance d'oubli). */
  function maitrise(idComp) {
    const c = Store.etat.competences[idComp];
    if (!c) return { brute: 0, effective: 0, jamaisTravaillee: true };
    const jours = joursDepuis(c.derniereActivite);
    const perte = jours === Infinity ? 0 : Math.max(0, jours - CONFIG.jouisAvantOubli) * CONFIG.vitesseOubli;
    const brute = Math.round(c.maitrise);
    const effective = borne(brute - perte, Math.round(brute * 0.5), 100);
    return { brute, effective: Math.max(0, effective),
             jamaisTravaillee: c.tentatives === 0 };
  }

  function ajouterXp(montant, raison) {
    Store.modifier(e => {
      e.xp += montant;
      const j = Store.aujourdhui();
      e.xpParJour[j] = (e.xpParJour[j] || 0) + montant;
    });
    return { montant, raison };
  }

  /** Point d'entrée unique appelé par les moteurs d'exercices et de missions.
   *  `facteur` réduit l'impact sur la maîtrise quand la réponse a été aidée par des indices. */
  function enregistrerResultat({ competences = [], reussi, difficulte = 1, xp = 0, facteur = 1, idExercice, idMission }) {
    const poids = ([0.8, 1, 1.2][difficulte - 1] ?? 1) * facteur;
    Store.modifier(e => {
      competences.forEach(id => {
        const c = e.competences[id]; if (!c) return;
        if (reussi) {
          c.maitrise = borne(c.maitrise + CONFIG.alphaMaitrise * poids * (100 - c.maitrise), 0, 100);
          // Seules les réussites sans indice consolident : trois d'affilée valident la compétence.
          c.serie = facteur >= 0.99 ? (c.serie || 0) + 1 : 0;
          if (c.serie >= CONFIG.serieConsolidation && c.maitrise >= CONFIG.seuilConsolidation) c.maitrise = 100;
        } else {
          // Un échec coûte, mais ne peut pas effacer des semaines de pratique.
          c.maitrise = borne(c.maitrise - Math.min(CONFIG.perteMax, CONFIG.alphaEchec * poids * c.maitrise), 0, 100);
          c.serie = 0;
        }
        c.tentatives++; if (reussi) c.reussites++;
        c.derniereActivite = new Date().toISOString();
      });
      if (idExercice) {
        const x = e.exercices[idExercice] || (e.exercices[idExercice] = { tentatives: 0, reussites: 0, derniereReussite: null });
        x.tentatives++; if (reussi) { x.reussites++; x.derniereReussite = new Date().toISOString(); }
      }
      if (idMission) {
        const m = e.missions[idMission] || (e.missions[idMission] = { statut: "en-cours", etoiles: 0, indicesUtilises: 0, meilleurScore: 0 });
        if (reussi) m.statut = "terminee";
      }
    });
    if (xp > 0 && reussi) ajouterXp(xp, "résultat");
    majSerie();
    return verifierCertifications();
  }

  function majSerie() {
    const j = Store.aujourdhui();
    const hier = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    Store.modifier(e => {
      if (e.serie.dernierJour === j) return;
      e.serie.jours = e.serie.dernierJour === hier ? e.serie.jours + 1 : 1;
      e.serie.dernierJour = j;
    });
  }

  /** Renvoie les certifications nouvellement obtenues. */
  function verifierCertifications() {
    const nouvelles = [];
    CONTENU.certifications.forEach(cert => {
      if (Store.etat.certifications[cert.id]) return;
      let ok = false;
      try { ok = cert.condition(Store.etat, API); } catch (_) {}
      if (ok) {
        Store.modifier(e => { e.certifications[cert.id] = { obtenueLe: new Date().toISOString() }; });
        nouvelles.push(cert);
      }
    });
    return nouvelles;
  }

  /** Compétences prioritaires : jamais travaillées ou sous le seuil de révision. */
  function pointsFaibles(nb = 3) {
    return Contenu.competencesVisibles()
      .map(c => ({ ...c, ...maitrise(c.id) }))
      .sort((a, b) => a.effective - b.effective)
      .slice(0, nb);
  }

  function xpDuJour() { return Store.etat.xpParJour[Store.aujourdhui()] || 0; }

  const API = { niveau, maitrise, ajouterXp, enregistrerResultat, majSerie,
                verifierCertifications, pointsFaibles, xpDuJour };
  return API;
})();

/* ══ 5. BUS (événements internes) ═══════════════════════════ */
const Bus = (() => {
  const abonnes = {};
  return {
    sur(evt, fn) { (abonnes[evt] ||= []).push(fn); },
    emettre(evt, data) { (abonnes[evt] || []).forEach(fn => fn(data)); }
  };
})();

/* ══ 6. UI ══════════════════════════════════════════════════ */
/** Fabrique d'éléments : el("div.carte", {onclick}, "texte", elEnfant) */
function el(selecteur, attrs = {}, ...enfants) {
  const [tag, ...classes] = selecteur.split(".");
  const n = document.createElement(tag || "div");
  if (classes.length) n.className = classes.join(" ");
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "class") n.className += " " + v;
    else n.setAttribute(k, v);
  }
  enfants.flat().forEach(c => {
    if (c === null || c === undefined || c === false) return;
    n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  });
  return n;
}

/** Barre de progression en cellules de tableur (élément signature). */
function cellules(pourcent, nb = 10, fine = false, opts = {}) {
  // opts.fantome : maîtrise acquise avant l'oubli, dessinée en pointillés au-delà de la valeur effective.
  // opts.depuis  : valeur affichée la fois précédente ; les cellules gagnées depuis jouent une fois leur remplissage.
  const efface = opts.fantome > pourcent ? Math.round(opts.fantome - pourcent) : 0;
  const c = el("div.cellules" + (fine ? ".cellules--fine" : "") + (opts.ok ? ".cellules--ok" : ""),
    { role: "img", "aria-label": `${Math.round(pourcent)} %` + (efface ? `, dont ${efface} points s'effacent` : "") });
  const pleines = (pourcent / 100) * nb;
  const avant = opts.depuis !== undefined ? Math.floor((opts.depuis / 100) * nb) : null;
  const fantome = opts.fantome !== undefined ? (opts.fantome / 100) * nb : 0;
  for (let i = 0; i < nb; i++) {
    const s = el("span");
    if (i < Math.floor(pleines)) { s.classList.add("pleine"); if (avant !== null && i >= avant) s.classList.add("gagne"); }
    else if (i < pleines) s.classList.add("partielle");
    else if (i < fantome) s.classList.add("erodee");
    c.append(s);
  }
  return c;
}

/** Lexique des formules : panneau consultable par-dessus l'écran en cours,
 *  sans jamais interrompre un exercice ou une mission. */
const Lexique = (() => {
  let voile = null, btn = null;

  const GROUPES = [
    { nom: "Calculs de base", fns: ["SOMME","MOYENNE","MIN","MAX","NB","NBVAL","NB.VIDE","ARRONDI","ABS","ENT","PUISSANCE"] },
    { nom: "Conditions", fns: ["SI","SI.CONDITIONS","ET","OU","NON","SIERREUR","ESTVIDE","ESTNUM","ESTTEXTE"] },
    { nom: "Calculs conditionnels", fns: ["NB.SI","SOMME.SI","NB.SI.ENS","SOMME.SI.ENS","MOYENNE.SI.ENS","SOUS.TOTAL"] },
    { nom: "Recherche", fns: ["RECHERCHEX","RECHERCHEV","EQUIV","INDEX"] },
    { nom: "Texte", fns: ["SUPPRESPACE","MAJUSCULE","MINUSCULE","NOMPROPRE","NBCAR","GAUCHE","DROITE","STXT","CONCAT","CONCATENER"] },
    { nom: "Dates", fns: ["AUJOURDHUI","DATE","ANNEE","MOIS","JOUR","JOURS"] }
  ];

  function construire(q = "") {
    const catalogue = Formules.catalogue();
    const parNom = Object.fromEntries(catalogue.map(f => [f.nom, f]));
    const classees = new Set(GROUPES.flatMap(g => g.fns));
    const groupes = GROUPES.map(g => ({ nom: g.nom, fns: g.fns.filter(n => parNom[n]).map(n => parNom[n]) }));
    const reste = catalogue.filter(f => !classees.has(f.nom));
    if (reste.length) groupes.push({ nom: "Autres", fns: reste });

    const compteur = el("span.tres-muet", { style: "font-size:13px" }, `${catalogue.length} fonctions`);
    const liste = el("div.lexique__liste", {});
    const recherche = el("input.recherche-fn", { type: "search", spellcheck: "false",
      placeholder: "Rechercher une fonction ou un usage…", "aria-label": "Rechercher une fonction" });

    const afficher = () => {
      const q = recherche.value.trim().toLowerCase();
      const garde = f => {
        if (!q) return true;
        const fiche = FICHES[f.nom];
        const champs = [f.nom, f.aide, f.signature, fiche ? fiche.but + " " + fiche.contexte : ""];
        return champs.some(c => c.toLowerCase().includes(q));
      };
      const noeuds = [];
      let trouves = 0;
      groupes.forEach(g => {
        const fns = g.fns.filter(garde);
        if (!fns.length) return;
        trouves += fns.length;
        noeuds.push(el("div.lexique__groupe", {}, g.nom));
        fns.forEach(f => {
          if (!Fiche.disponible(f.nom)) {
            noeuds.push(el("div.fn-ligne", {},
              el("span.mono.fn-ligne__sig", {}, f.signature),
              el("span.tres-muet", {}, f.aide)));
            return;
          }
          noeuds.push(el("button.fn-ligne.fn-ligne--lien", { type: "button",
            title: `S'entraîner sur ${f.nom}`, onclick: () => Fiche.ouvrir(f.nom) },
            el("span.mono.fn-ligne__sig", {}, f.signature),
            el("span.tres-muet", {}, f.aide),
            Fiche.dejaVue(f.nom) ? el("span.fn-ligne__vue", { title: "Fiche déjà consultée" }, "•") : null,
            el("span.fn-ligne__fleche", {}, "›")));
        });
      });
      if (!trouves) noeuds.push(el("p.tres-muet", { style: "font-size:13px;padding:14px 0" },
        "Aucune fonction ne correspond. Classe'R n'implémente que ce qui sert aux exercices : toute autre fonction renvoie #NOM?."));
      compteur.textContent = q ? `${trouves} sur ${catalogue.length}` : `${catalogue.length} fonctions`;
      liste.replaceChildren(...noeuds);
    };
    recherche.value = q;
    recherche.addEventListener("input", afficher);
    afficher();

    const boite = el("div.lexique", { role: "dialog", "aria-modal": "true", "aria-label": "Lexique des formules" },
      el("div.lexique__tete", {},
        el("h2", {}, "Lexique des formules"), compteur,
        el("button.btn.btn--nu", { onclick: () => API.fermer(), "aria-label": "Fermer le lexique" }, "✕")),
      recherche, liste,
      el("p.tres-muet.lexique__pied", {},
        "Cherchez par usage : « doublon », « retard », « espaces », « rapprocher ». Les fonctions surlignées ouvrent une fiche d'entraînement ; le point signale celles déjà consultées.")
    );
    voile = el("div.voile.voile--lexique", { onclick: ev => { if (ev.target === voile) API.fermer(); } }, boite);
    document.body.append(voile);
    piegeFocus(voile, { fermer: () => API.fermer() });
    setTimeout(() => recherche.focus(), 60);
  }

  const API = {
    estOuvert: () => !!voile,
    ouvrir(q) { if (!voile) { construire(typeof q === "string" ? q : ""); API.majBouton(); } },
    fermer() { if (voile) { voile.remove(); voile = null; API.majBouton(); } },
    basculer() { API.estOuvert() ? API.fermer() : API.ouvrir(); },
    majBouton() { if (btn) btn.dataset.actif = API.estOuvert() ? "1" : "0"; },
    bouton() {
      btn = el("button.rail__lien.rail__lien--outil", { "data-actif": "0", type: "button",
        title: "Lexique des formules", onclick: () => API.basculer() },
        icone("lexique"), el("span", {}, "Lexique"));
      return btn;
    }
  };
  return API;
})();

/** Entraînement libre sur une fonction : consultation puis mise en pratique.
 *  Aucun point, aucune maîtrise, aucun échec enregistré — c'est un espace personnel. */
const Fiche = {
  courante: null,

  disponible(nom) { return !!FICHES[nom]; },
  dejaVue(nom) { return !!(Store.etat.fiches || {})[nom]; },

  ouvrir(nom) {
    if (!FICHES[nom]) { Toast.afficher("La fiche détaillée de cette fonction n'existe pas encore."); return; }
    Fiche.courante = { nom, etape: 0, saisies: [], retours: [], reveles: [] };
    Store.modifier(e => {
      e.fiches = e.fiches || {};
      e.fiches[nom] = { vue: true, le: new Date().toISOString() };
    });
    if (Lexique.estOuvert()) Lexique.fermer();
    Routeur.aller("/fiche");
  },

  nbEtapes() {
    const f = FICHES[Fiche.courante?.nom];
    return f ? f.entrainements.length + 2 : 0;      // présentation + entraînements + fin
  },

  avancer(n) {
    const max = Fiche.nbEtapes() - 1;
    Fiche.courante.etape = Math.max(0, Math.min(max, Fiche.courante.etape + n));
    Routeur.rendre();
  },

  verifier(i, saisie) {
    const ent = FICHES[Fiche.courante.nom].entrainements[i];
    const res = TYPES_EXERCICE.formule.valider({ solutions: ent.solutions, fonction: Fiche.courante.nom }, saisie);
    Fiche.courante.saisies[i] = saisie;
    Fiche.courante.retours[i] = res;
    Routeur.rendre();
  },

  reveler(i) { Fiche.courante.reveles[i] = true; Routeur.rendre(); }
};

/** Parcours guidé : une leçon, puis les exercices qui l'appliquent.
 *  Les exercices sont ceux du vivier commun — une réussite compte partout. */
const Parcours = {
  courant: null,

  chapitre(id) { return CHAPITRES.find(c => c.id === id) || null; },

  exercicesDe(ch) {
    return ch.exercices.map(id => CONTENU.exercices.find(e => e.id === id)).filter(Boolean);
  },

  /** Part des exercices du chapitre déjà réussis au moins une fois. */
  avancement(ch) {
    const liste = Parcours.exercicesDe(ch);
    if (!liste.length) return { faits: 0, total: 0, part: 0 };
    const faits = liste.filter(e => (Store.etat.exercices[e.id]?.reussites || 0) > 0).length;
    return { faits, total: liste.length, part: Math.round(faits / liste.length * 100) };
  },

  termine(ch) { const a = Parcours.avancement(ch); return a.total > 0 && a.faits === a.total; },

  /** Premier chapitre non terminé : c'est là qu'on reprend. */
  suivantConseille() {
    return CHAPITRES.find(c => !Parcours.termine(c)) || null;
  },

  ouvrir(id) {
    const ch = Parcours.chapitre(id);
    if (!ch) return false;
    Parcours.courant = { ch, etape: "lecon", index: 0, liste: Parcours.exercicesDe(ch),
                         reussites: 0, indices: 0, etat: "question", dernier: null };
    return true;
  },

  commencer() {
    const p = Parcours.courant;
    if (!p || !p.liste.length) return;
    p.etape = "exercices"; p.index = 0; p.etat = "question"; p.dernier = null; p.indices = 0;
  },

  exercice() { const p = Parcours.courant; return p && p.etape === "exercices" ? p.liste[p.index] : null; },

  /** Même enregistrement que dans une série libre : la maîtrise progresse normalement. */
  repondre(reponse) {
    const p = Parcours.courant, ex = Parcours.exercice();
    const res = TYPES_EXERCICE[ex.type].valider(ex, reponse);
    const indices = Indices.pour(ex);
    const xp = res.reussi ? Math.round(10 * (ex.difficulte || 1) * Indices.multiplicateurXp(p.indices, indices)) : 0;
    Progression.enregistrerResultat({
      competences: [ex.competence], reussi: res.reussi, difficulte: ex.difficulte || 1, xp,
      facteur: res.reussi ? Indices.facteurMaitrise(p.indices, indices) : 1, idExercice: ex.id
    });
    if (res.reussi) p.reussites++;
    p.etat = "retour";
    p.dernier = { ...res, xp, reponse, indices: p.indices };
    return p.dernier;
  },

  indiceSuivant() {
    const p = Parcours.courant;
    const liste = Indices.pour(Parcours.exercice());
    if (p.indices < liste.length) p.indices++;
    return liste.slice(0, p.indices);
  },

  suivant() {
    const p = Parcours.courant;
    if (p.index < p.liste.length - 1) { p.index++; p.etat = "question"; p.dernier = null; p.indices = 0; }
    else p.etape = "bilan";
  },

  quitter() { Parcours.courant = null; }
};

/** Modale accessible : le focus reste dans la boîte, Échap ferme si c'est permis, et le focus revient
 *  à l'élément qui l'avait ouverte — quelle que soit la façon dont elle se referme. */
function piegeFocus(voile, { fermer = null } = {}) {
  const declencheur = document.activeElement;
  const focalisables = () => [...voile.querySelectorAll("button:not([disabled]), input:not([disabled]), select, textarea, a[href], [tabindex]:not([tabindex='-1'])")]
    .filter(e => e.offsetParent !== null || e === document.activeElement);
  voile.addEventListener("keydown", ev => {
    if (ev.key === "Escape" && fermer) { ev.preventDefault(); ev.stopPropagation(); fermer(); return; }
    if (ev.key !== "Tab") return;
    const l = focalisables(); if (!l.length) return;
    const premier = l[0], dernier = l[l.length - 1];
    if (!voile.contains(document.activeElement)) { ev.preventDefault(); premier.focus(); }
    else if (ev.shiftKey && document.activeElement === premier) { ev.preventDefault(); dernier.focus(); }
    else if (!ev.shiftKey && document.activeElement === dernier) { ev.preventDefault(); premier.focus(); }
  });
  const retirer = voile.remove.bind(voile);
  voile.remove = () => { retirer(); if (declencheur && declencheur.isConnected && declencheur !== document.body) declencheur.focus(); };
}

const Modale = {
  ouvrir({ titre, description, contenu, actions = [], fermable = true }) {
    const voile = el("div.voile");
    const boite = el("div.modale", { role: "dialog", "aria-modal": "true", "aria-label": titre });
    if (titre) boite.append(el("h2", {}, titre));
    if (description) boite.append(el("p.muet", {}, description));
    if (contenu) boite.append(contenu);
    if (actions.length) {
      boite.append(el("div.modale__actions", {}, actions.map(a =>
        el("button.btn" + (a.fort ? ".btn--fort" : ""), {
          onclick: () => { if (a.action?.(boite) !== false) voile.remove(); }
        }, a.libelle)
      )));
    }
    voile.append(boite);
    if (fermable) voile.addEventListener("click", e => { if (e.target === voile) voile.remove(); });
    document.body.append(voile);
    piegeFocus(voile, { fermer: fermable ? () => voile.remove() : null });
    boite.querySelector("input,button")?.focus();
    return voile;
  }
};

/* ══ 6b. TABLEUR — modèle ═══════════════════════════════════ */
/** Conversion entre coordonnées (col, ligne) 0-indexées et références « A1 ». */
const Ref = {
  lettre(col) {
    let s = "", n = col + 1;
    while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
    return s;
  },
  colonne(lettres) {
    let n = 0;
    for (const ch of lettres.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  },
  vers(col, ligne) { return Ref.lettre(col) + (ligne + 1); },
  depuis(ref) {
    const m = /^\$?([A-Za-z]+)\$?(\d+)$/.exec(String(ref).trim());
    return m ? { col: Ref.colonne(m[1]), ligne: parseInt(m[2], 10) - 1 } : null;
  },
  plage(texte) {
    const [a, b] = String(texte).split(":");
    const A = Ref.depuis(a), B = Ref.depuis(b || a);
    if (!A || !B) return null;
    return { c1: Math.min(A.col, B.col), c2: Math.max(A.col, B.col),
             l1: Math.min(A.ligne, B.ligne), l2: Math.max(A.ligne, B.ligne) };
  },
  listePlage(p) {
    const refs = [];
    for (let l = p.l1; l <= p.l2; l++) for (let c = p.c1; c <= p.c2; c++) refs.push(Ref.vers(c, l));
    return refs;
  }
};

/* ══ 6b-2. MOTEUR DE FORMULES ═══════════════════════════════ */
class ErreurCalcul extends Error {
  constructor(code) { super(code); this.code = code; }
}

/* — Registre de fonctions : ajouter une fonction = ajouter une entrée — */
const nombresDe = args => args.flat(Infinity).filter(v => typeof v === "number");
/** Un tableau de valeurs porte sa forme : les fonctions existantes continuent de l'aplatir sans le savoir. */
function matrice(valeurs, nbLigne, nbCol) {
  const a = valeurs.slice();
  a.nbLigne = nbLigne !== undefined ? nbLigne : valeurs.length;
  a.nbCol = nbCol !== undefined ? nbCol : 1;
  return a;
}
const formeDe = a => ({ nbLigne: a.nbLigne || a.length, nbCol: a.nbCol || 1 });
const refuserPlage = v => { if (Array.isArray(v)) throw new ErreurCalcul("#PLAGE!"); return v; };
const versNombre = v => {
  refuserPlage(v);
  if (v === null || v === "" || v === undefined) return 0;
  if (typeof v === "number") return v;
  if (typeof v === "boolean") return v ? 1 : 0;
  const n = parseFloat(String(v).replace(/[\s\u00A0\u202F]/g, "").replace(",", "."));
  if (Number.isNaN(n)) throw new ErreurCalcul("#VALEUR!");
  return n;
};
const versTexte = v => {
  refuserPlage(v);
  if (v === null || v === undefined) return "";
  if (typeof v === "boolean") return v ? "VRAI" : "FAUX";
  return String(v);
};
const versBool = v => {
  refuserPlage(v);
  if (typeof v === "boolean") return v;
  if (typeof v === "number") return v !== 0;
  if (v === null || v === "") return false;
  if (/^vrai$/i.test(String(v))) return true;
  if (/^faux$/i.test(String(v))) return false;
  throw new ErreurCalcul("#VALEUR!");
};

/** Critère au format Excel : "OK", ">10", "<>0", "<=100". */
function testerCritere(valeur, critere) {
  if (typeof critere === "boolean") return valeur === critere;
  const t = String(critere ?? "").trim();
  const m = /^(>=|<=|<>|>|<|=)?([\s\S]*)$/.exec(t);
  const op = m[1] || "=";
  const cible = m[2].trim();
  const estNombre = cible !== "" && /^-?[\d.,]+$/.test(cible);
  const a = estNombre ? (typeof valeur === "number" ? valeur : NaN) : versTexte(valeur).toLowerCase();
  const b = estNombre ? parseFloat(cible.replace(",", ".")) : cible.toLowerCase();
  switch (op) {
    case "=":  return a === b;
    case "<>": return a !== b;
    case ">":  return a > b;
    case "<":  return a < b;
    case ">=": return a >= b;
    case "<=": return a <= b;
    default:   return false;
  }
}

/** Comparaison universelle pour trier : nombres avant texte, casse ignorée. */
function comparerValeurs(a, b) {
  const na = typeof a === "number", nb = typeof b === "number";
  if (na && nb) return a - b;
  if (na) return -1;
  if (nb) return 1;
  return versTexte(a).localeCompare(versTexte(b), "fr", { sensitivity: "base" });
}

/** Égalité tolérante : nombres comparés strictement, textes sans casse ni espaces de bord. */
const egalValeur = (a, b) =>
  (typeof a === "number" && typeof b === "number")
    ? a === b
    : versTexte(a).trim().toLowerCase() === versTexte(b).trim().toLowerCase();

/** Indices des lignes qui satisfont tous les couples (plage, critère). */
function lignesRetenues(paires) {
  if (!paires.length) throw new ErreurCalcul("#ARGS!");
  const n = paires[0][0].length;
  const idx = [];
  for (let i = 0; i < n; i++) if (paires.every(([plage, critere]) => testerCritere(plage[i], critere))) idx.push(i);
  return idx;
}
function couples(reste) {
  const paires = [];
  for (let i = 0; i + 1 < reste.length; i += 2) paires.push([[reste[i]].flat(Infinity), reste[i + 1]]);
  return paires;
}

const FONCTIONS = {
  SOMME:    { signature: "SOMME(nombre1; nombre2; …)", aide: "additionne les valeurs",
              calcul: (...a) => nombresDe(a).reduce((s, v) => s + v, 0) },
  MOYENNE:  { signature: "MOYENNE(nombre1; …)", aide: "moyenne arithmétique",
              calcul: (...a) => { const n = nombresDe(a); if (!n.length) throw new ErreurCalcul("#DIV/0!"); return n.reduce((s, v) => s + v, 0) / n.length; } },
  MIN:      { signature: "MIN(nombre1; …)", aide: "plus petite valeur",
              calcul: (...a) => { const n = nombresDe(a); return n.length ? Math.min(...n) : 0; } },
  MAX:      { signature: "MAX(nombre1; …)", aide: "plus grande valeur",
              calcul: (...a) => { const n = nombresDe(a); return n.length ? Math.max(...n) : 0; } },
  NB:       { signature: "NB(plage)", aide: "compte les cellules contenant un nombre",
              calcul: (...a) => nombresDe(a).length },
  NBVAL:    { signature: "NBVAL(plage)", aide: "compte les cellules non vides",
              calcul: (...a) => a.flat(Infinity).filter(v => v !== null && v !== "").length },
  "NB.VIDE":{ signature: "NB.VIDE(plage)", aide: "compte les cellules vides",
              calcul: (...a) => a.flat(Infinity).filter(v => v === null || v === "").length },
  "NB.SI":  { signature: "NB.SI(plage; critère)", aide: "compte les cellules qui remplissent un critère",
              calcul: (plage, critere) => [plage].flat(Infinity).filter(v => testerCritere(v, critere)).length },
  "SOMME.SI":{ signature: "SOMME.SI(plage; critère; plage_somme)", aide: "additionne les cellules qui remplissent un critère",
              calcul: (plage, critere, plageSomme) => {
                const test = [plage].flat(Infinity);
                const somme = plageSomme === undefined ? test : [plageSomme].flat(Infinity);
                return test.reduce((t, v, i) => testerCritere(v, critere) && typeof somme[i] === "number" ? t + somme[i] : t, 0);
              } },
  ARRONDI:  { signature: "ARRONDI(nombre; décimales)", aide: "arrondit à n décimales",
              calcul: (n, d = 0) => { const p = 10 ** versNombre(d); return Math.round(versNombre(n) * p) / p; } },
  ABS:      { signature: "ABS(nombre)", aide: "valeur absolue", calcul: n => Math.abs(versNombre(n)) },
  ENT:      { signature: "ENT(nombre)", aide: "partie entière", calcul: n => Math.floor(versNombre(n)) },
  PUISSANCE:{ signature: "PUISSANCE(nombre; exposant)", aide: "élève à la puissance",
              calcul: (n, p) => versNombre(n) ** versNombre(p) },
  ET:       { signature: "ET(test1; test2; …)", aide: "vrai si tous les tests sont vrais",
              calcul: (...a) => a.flat(Infinity).every(versBool) },
  OU:       { signature: "OU(test1; test2; …)", aide: "vrai si au moins un test est vrai",
              calcul: (...a) => a.flat(Infinity).some(versBool) },
  NON:      { signature: "NON(test)", aide: "inverse le résultat logique", calcul: v => !versBool(v) },
  SI:       { signature: "SI(test; valeur_si_vrai; valeur_si_faux)", aide: "renvoie une valeur selon le test",
              paresseuse: true, min: 2,
              calcul: (evaluer, args) => versBool(evaluer(args[0])) ? evaluer(args[1]) : (args[2] ? evaluer(args[2]) : false) },
  "SOUS.TOTAL":{ signature: "SOUS.TOTAL(n° fonction; plage)", aide: "calcule en ignorant les lignes masquées par un filtre",
              paresseuse: true, min: 2,
              calcul: (evaluer, args, ctx) => {
                const code = versNombre(evaluer(args[0]));
                const refs = Formules.refsNoeud(args[1], ctx.feuille);
                const masquees = ctx.feuille.lignesMasquees;
                const valeurs = refs
                  .filter(r => !masquees || !masquees.has(Ref.depuis(r).ligne))
                  .map(r => ctx.lire(r));
                const nb = valeurs.filter(v => typeof v === "number");
                switch (code) {
                  case 1: if (!nb.length) throw new ErreurCalcul("#DIV/0!"); return nb.reduce((s, v) => s + v, 0) / nb.length;
                  case 2: return nb.length;
                  case 3: return valeurs.filter(v => v !== null && v !== "").length;
                  case 4: return nb.length ? Math.max(...nb) : 0;
                  case 5: return nb.length ? Math.min(...nb) : 0;
                  case 9: return nb.reduce((s, v) => s + v, 0);
                  default: throw new ErreurCalcul("#VALEUR!");
                }
              } },
  SUPPRESPACE:{ signature: "SUPPRESPACE(texte)", aide: "supprime les espaces inutiles",
              calcul: t => versTexte(t).trim().replace(/\s+/g, " ") },
  MAJUSCULE:{ signature: "MAJUSCULE(texte)", aide: "met en majuscules", calcul: t => versTexte(t).toUpperCase() },
  MINUSCULE:{ signature: "MINUSCULE(texte)", aide: "met en minuscules", calcul: t => versTexte(t).toLowerCase() },
  NOMPROPRE:{ signature: "NOMPROPRE(texte)", aide: "met une majuscule à chaque mot",
              calcul: t => versTexte(t).toLowerCase().replace(/(^|[\s-])(\p{L})/gu, (_, s, c) => s + c.toUpperCase()) },
  NBCAR:    { signature: "NBCAR(texte)", aide: "nombre de caractères", calcul: t => versTexte(t).length },
  GAUCHE:   { signature: "GAUCHE(texte; n)", aide: "n premiers caractères", calcul: (t, n = 1) => versTexte(t).slice(0, versNombre(n)) },
  DROITE:   { signature: "DROITE(texte; n)", aide: "n derniers caractères", calcul: (t, n = 1) => versTexte(t).slice(-versNombre(n)) },
  STXT:     { signature: "STXT(texte; départ; longueur)", aide: "extrait une portion de texte",
              calcul: (t, d, l) => versTexte(t).substr(versNombre(d) - 1, versNombre(l)) },
  CONCAT:   { signature: "CONCAT(texte1; texte2; …)", aide: "assemble des textes",
              calcul: (...a) => a.flat(Infinity).map(versTexte).join("") },
  CONCATENER:{ signature: "CONCATENER(texte1; …)", aide: "assemble des textes",
              calcul: (...a) => a.flat(Infinity).map(versTexte).join("") },
  "SOMME.SI.ENS":{ signature: "SOMME.SI.ENS(plage_somme; plage1; critère1; …)", aide: "additionne selon plusieurs critères",
              calcul: (somme, ...reste) => {
                const s = [somme].flat(Infinity);
                return lignesRetenues(couples(reste)).reduce((t, i) => typeof s[i] === "number" ? t + s[i] : t, 0);
              } },
  "NB.SI.ENS":{ signature: "NB.SI.ENS(plage1; critère1; …)", aide: "compte selon plusieurs critères",
              calcul: (...reste) => lignesRetenues(couples(reste)).length },
  "MOYENNE.SI.ENS":{ signature: "MOYENNE.SI.ENS(plage_moyenne; plage1; critère1; …)", aide: "moyenne selon plusieurs critères",
              calcul: (moyenne, ...reste) => {
                const s = [moyenne].flat(Infinity);
                const v = lignesRetenues(couples(reste)).map(i => s[i]).filter(x => typeof x === "number");
                if (!v.length) throw new ErreurCalcul("#DIV/0!");
                return v.reduce((a, b) => a + b, 0) / v.length;
              } },
  SIERREUR: { signature: "SIERREUR(valeur; valeur_si_erreur)", aide: "remplace une erreur par une valeur de secours",
              paresseuse: true, min: 2,
              calcul: (evaluer, args) => { try { return evaluer(args[0]); } catch (_) { return evaluer(args[1]); } } },
  "SI.CONDITIONS":{ signature: "SI.CONDITIONS(test1; valeur1; test2; valeur2; …)", aide: "enchaîne plusieurs tests sans imbriquer",
              paresseuse: true, min: 2,
              calcul: (evaluer, args) => {
                for (let i = 0; i + 1 < args.length; i += 2) if (versBool(evaluer(args[i]))) return evaluer(args[i + 1]);
                throw new ErreurCalcul("#N/A");
              } },
  AUJOURDHUI:{ signature: "AUJOURDHUI()", aide: "renvoie la date du jour", formatSuggere: "date",
              calcul: () => { const d = new Date(); return Formatage.versSerie(d.getFullYear(), d.getMonth() + 1, d.getDate()); } },
  DATE:     { signature: "DATE(année; mois; jour)", aide: "construit une date", formatSuggere: "date",
              calcul: (a, m, j) => Formatage.versSerie(versNombre(a), versNombre(m), versNombre(j)) },
  ANNEE:    { signature: "ANNEE(date)", aide: "extrait l'année d'une date",
              calcul: d => Formatage.versDate(versNombre(d)).getUTCFullYear() },
  MOIS:     { signature: "MOIS(date)", aide: "extrait le mois d'une date",
              calcul: d => Formatage.versDate(versNombre(d)).getUTCMonth() + 1 },
  JOUR:     { signature: "JOUR(date)", aide: "extrait le jour d'une date",
